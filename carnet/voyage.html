<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="theme-color" content="#EEEFF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101215" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<style>
/* ==========================================================================
   Direction visuelle : « la marge du carnet ».
   Une réglure verticale court le long du journal ; l'heure et les montants
   vivent dans la marge gauche comme des annotations au stylo, la photo et le
   lieu occupent la largeur restante.
   Une seule couleur saturée dans toute l'app (le bleu bille) : toute la
   couleur restante vient des photos, ce qui les rend automatiquement l'objet
   le plus important à l'écran.
   ========================================================================== */

:root {
  --papier:        #EEEFF1;
  --papier-haut:   #F8F8FA;   /* feuilles, champs : très légèrement au-dessus */
  --encre:         #14161C;
  --graphite:      #5D626E;
  --bille:         #1F3FE0;
  --bille-pale:    #E3E7FD;
  --reglure:       #D6D8DE;
  --rature:        #B32D25;
  --rature-pale:   #F7E3E1;

  --police-ui:       -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  --police-chiffres: ui-monospace, SFMono-Regular, Menlo, "Roboto Mono", "Segoe UI Mono", monospace;
  --police-texte:    ui-serif, "New York", "Noto Serif", Georgia, serif;

  --marge: 5.5rem;            /* largeur de la marge du carnet */
  --h-entete: 3.5rem;         /* recalculée en JS pour les en-têtes collants */
  --rayon: 10px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --papier:      #101215;
    --papier-haut: #191C21;
    --encre:       #E9EAEE;
    --graphite:    #8B909C;
    --bille:       #6E88FF;
    --bille-pale:  #1B2340;
    --reglure:     #262A31;
    --rature:      #F0796F;
    --rature-pale: #3A1F1D;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--papier);
  color: var(--encre);
  font-family: var(--police-ui);
  font-size: 16px;
  line-height: 1.45;
  overscroll-behavior-y: none;
  -webkit-tap-highlight-color: transparent;
}

button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--bille);
  outline-offset: 2px;
  border-radius: 3px;
}

/* Le mouvement répond aux actions, et à rien d'autre. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* --------------------------------------------------------- structure ---- */

#entete {
  position: sticky; top: 0; z-index: 30;
  background: var(--papier);
  padding: calc(env(safe-area-inset-top) + 0.7rem) 1rem 0.55rem;
  display: flex; align-items: baseline; gap: 0.6rem;
}
#entete h1 {
  font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em;
  margin: 0; flex: 0 0 auto;
}
#entete .entete__ville {
  flex: 1 1 auto; min-width: 0;
  font-size: 0.82rem; color: var(--graphite);
  background: none; border: 0; padding: 0.2rem 0.1rem; text-align: left;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  cursor: pointer;
}
#entete .entete__ville b { font-weight: 600; color: var(--encre); }
#entete .entete__actions { flex: 0 0 auto; display: flex; gap: 0.15rem; }

.ico {
  background: none; border: 0; cursor: pointer;
  width: 2.6rem; height: 2.6rem;
  display: grid; place-items: center;
  color: var(--encre); border-radius: 50%;
}
.ico:active { background: var(--reglure); }
.ico svg { width: 21px; height: 21px; display: block; }
.ico[aria-pressed="true"] { color: var(--bille); }

#vue {
  padding-bottom: calc(7rem + env(safe-area-inset-bottom));
  min-height: 60vh;
}

.retour {
  display: inline-flex; align-items: center; gap: 0.35rem;
  background: none; border: 0; color: var(--bille);
  padding: 0.4rem 0.2rem; margin: 0 0 0.2rem; cursor: pointer;
  font-size: 0.9rem;
}

/* ------------------------------------------------------------ journal ---- */

.jour__entete {
  position: sticky; top: var(--h-entete); z-index: 20;
  background: var(--papier);
  display: grid; grid-template-columns: 1fr auto;
  align-items: end; gap: 1rem;
  padding: 1.1rem 1rem 0.35rem;
  border-bottom: 1px solid var(--reglure);
  margin-bottom: 0.1rem;
}
.jour__date {
  font-size: 0.9rem; font-weight: 600; letter-spacing: -0.01em;
}
.jour__date.est-aujourdhui { color: var(--bille); }
.jour__totaux {
  font-family: var(--police-chiffres); font-variant-numeric: tabular-nums;
  font-size: 0.82rem; text-align: right; line-height: 1.25;
}
.jour__totaux .secondaire { color: var(--graphite); font-size: 0.76rem; }

.ligne {
  display: grid;
  grid-template-columns: var(--marge) minmax(0, 1fr);
  align-items: start;
}
.ligne__marge {
  font-family: var(--police-chiffres); font-variant-numeric: tabular-nums;
  text-align: right; padding: 0.85rem 0.85rem 1.3rem 0.4rem;
  font-size: 0.78rem; line-height: 1.5;
}
.ligne__heure { color: var(--graphite); }
.ligne__montant { color: var(--bille); display: block; margin-top: 0.15rem; }
.ligne__euros { color: var(--graphite); display: block; font-size: 0.72rem; }
.ligne__vide { color: var(--reglure); }

.ligne__corps {
  border-left: 1px solid var(--reglure);
  padding: 0.85rem 1rem 1.3rem 1rem;
  min-width: 0;
}
/* Un point sur la réglure marque chaque entrée : la ponctuation du carnet. */
.ligne__corps { position: relative; }
.ligne__corps::before {
  content: ""; position: absolute; left: -3px; top: 1.15rem;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--reglure);
}
.ligne--argent .ligne__corps::before { background: var(--bille); }

.ligne__ouvrir {
  display: block; width: 100%; text-align: left;
  background: none; border: 0; padding: 0; cursor: pointer; color: inherit;
}
.ligne__nom { font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; }
.ligne__nom.sans-nom { font-weight: 400; font-style: italic; color: var(--graphite); }
.ligne__meta { font-size: 0.82rem; color: var(--graphite); margin-top: 0.1rem; }
.ligne__mot { font-family: var(--police-texte); font-size: 0.95rem; margin-top: 0.4rem; }

.photo {
  display: block; width: 100%; height: auto;
  background: var(--reglure); border-radius: var(--rayon);
  margin-bottom: 0.55rem; object-fit: cover;
}
.photo--vide { aspect-ratio: 4 / 3; }

.etiquettes { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.45rem; }
.etiquette {
  font-size: 0.72rem; color: var(--graphite);
  border: 1px solid var(--reglure); border-radius: 999px;
  padding: 0.05rem 0.5rem;
}
.etiquette--achat { color: var(--bille); border-color: var(--bille); }

/* Animation d'ajout : la ligne se trace, elle n'apparaît pas en fondu. */
@keyframes tracer { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
.ligne--nouvelle { animation: tracer 200ms ease-out; }
@keyframes raturer { to { opacity: 0.25; } }
.ligne--rature { animation: raturer 160ms ease-in forwards; text-decoration: line-through; }

/* ---------------------------------------------------------- fiche lieu ---- */

.fiche { padding: 0.2rem 1rem 0; }
.fiche__nom { font-size: 1.5rem; font-weight: 650; letter-spacing: -0.02em; margin: 0.2rem 0 0.15rem; }
.fiche__nom.sans-nom { font-weight: 400; font-style: italic; color: var(--graphite); }
.fiche__meta { color: var(--graphite); font-size: 0.9rem; }
.fiche__mot { font-family: var(--police-texte); font-size: 1.02rem; margin: 0.8rem 0 0; }
.fiche__total {
  font-family: var(--police-chiffres); font-variant-numeric: tabular-nums;
  margin-top: 0.9rem; padding-top: 0.7rem; border-top: 1px solid var(--reglure);
  font-size: 0.85rem; color: var(--graphite);
}
.fiche__total b { color: var(--encre); font-weight: 600; }

.etoiles { color: var(--bille); letter-spacing: 0.12em; font-size: 0.95rem; }
.etoiles .off { color: var(--reglure); }

.galerie {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 0.4rem; margin: 0.9rem 0 0;
}
.galerie img, .galerie button { border-radius: 8px; }
.galerie button {
  padding: 0; border: 0; background: none; cursor: pointer;
  aspect-ratio: 1; overflow: hidden;
}
.galerie img { width: 100%; height: 100%; object-fit: cover; margin: 0; }
.galerie .ajouter {
  border: 1px dashed var(--reglure); color: var(--graphite);
  display: grid; place-items: center; font-size: 0.75rem; text-align: center;
  padding: 0.3rem;
}

.sous-titre {
  font-size: 0.78rem; font-weight: 600; color: var(--graphite);
  padding: 1.4rem 1rem 0.4rem; letter-spacing: 0;
}

/* -------------------------------------------------------------- listes ---- */

.rangee {
  display: flex; align-items: center; gap: 0.8rem; width: 100%;
  padding: 0.85rem 1rem; background: none; border: 0;
  border-bottom: 1px solid var(--reglure); cursor: pointer;
  text-align: left; color: inherit;
}
.rangee:active { background: var(--papier-haut); }
.rangee__texte { flex: 1 1 auto; min-width: 0; }
.rangee__titre { font-size: 0.97rem; font-weight: 550; }
.rangee__sous { font-size: 0.8rem; color: var(--graphite); }
.rangee__droite {
  font-family: var(--police-chiffres); font-variant-numeric: tabular-nums;
  font-size: 0.82rem; color: var(--graphite); text-align: right; flex: 0 0 auto;
}
.rangee__miniature { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex: 0 0 auto; background: var(--reglure); margin: 0; }

/* -------------------------------------------------------------- argent ---- */

.periode { padding: 0.3rem 1rem 0.2rem; }
.periode__nav { display: flex; align-items: center; gap: 0.2rem; margin-top: 0.5rem; }
.periode__libelle {
  flex: 1; text-align: center; font-size: 0.85rem; color: var(--graphite);
}
.periode__nav .ico { width: 2.4rem; height: 2.4rem; }
.periode__nav .ico[disabled] { opacity: 0.28; cursor: default; }

.argent__hero { padding: 1.4rem 1rem 0.2rem; }
/* Chiffre héros : même sans que le reste, chiffres proportionnels.
   `tabular-nums` donnerait à chaque chiffre la largeur d'un 0 et ferait
   flotter le nombre à cette taille — il est réservé aux colonnes. */
.hero {
  font-family: var(--police-ui);
  font-size: clamp(2.9rem, 14vw, 3.4rem);
  font-weight: 650; letter-spacing: -0.035em; line-height: 1.05;
}
.hero__sous { color: var(--graphite); font-size: 0.88rem; margin-top: 0.3rem; }

.bloc { margin-top: 2rem; }
.bloc__titre {
  font-size: 0.78rem; font-weight: 600; color: var(--graphite);
  margin: 0 0 0.6rem; padding: 0 1rem;
}
.bloc__note {
  font-size: 0.78rem; color: var(--graphite);
  padding: 0 1rem; margin-top: 0.7rem;
  border-left: 2px solid var(--reglure); margin-left: 1rem; padding-left: 0.7rem;
}

/* Rythme : une seule série, donc une seule teinte et aucune légende.
   Barres fines, extrémité arrondie 4 px ancrée sur la ligne de base,
   2 px de fond entre deux barres — jamais de contour. */
.rythme {
  display: flex; gap: 2px; align-items: flex-end;
  height: 78px; padding: 0 1rem;
  border-bottom: 1px solid var(--reglure);
}
.rythme__col {
  flex: 1; min-width: 0; height: 100%;
  display: flex; flex-direction: column; justify-content: flex-end;
  background: none; border: 0; padding: 0; cursor: pointer;
}
.rythme__barre {
  background: var(--bille); border-radius: 4px 4px 0 0; width: 100%;
}
.rythme__barre--zero { background: var(--reglure); }
.rythme__col:active .rythme__barre { opacity: 0.72; }
.rythme__axe { display: flex; gap: 2px; padding: 0.35rem 1rem 0; }
.rythme__axe span {
  flex: 1; min-width: 0; text-align: center;
  font-size: 0.68rem; color: var(--graphite);
  font-variant-numeric: tabular-nums;
  overflow: hidden; white-space: nowrap;
}

.part { padding: 0.55rem 1rem; }
.part--lien {
  display: block; width: 100%; text-align: left;
  background: none; border: 0; cursor: pointer; color: inherit;
}
.part--lien:active { background: var(--papier-haut); }
.part__haut { display: flex; align-items: baseline; gap: 0.8rem; }
.part__nom { flex: 1 1 auto; min-width: 0; font-size: 0.95rem; }
.part__nom--vide { color: var(--graphite); font-style: italic; }
.part__valeur {
  flex: 0 0 auto;
  font-family: var(--police-chiffres); font-variant-numeric: tabular-nums;
  font-size: 0.88rem;
}
.part__valeur--prevu { color: var(--graphite); }
.part__note { font-size: 0.76rem; color: var(--graphite); margin-top: 0.15rem; }
.part__piste {
  height: 3px; background: var(--reglure); border-radius: 2px;
  margin-top: 0.4rem; overflow: hidden;
}
.part__fill { height: 100%; background: var(--bille); border-radius: 2px; }

.jauge {
  height: 8px; background: var(--bille-pale); border-radius: 4px;
  margin-top: 0.45rem; overflow: hidden;
}
.jauge__fill { height: 100%; background: var(--bille); border-radius: 4px; }

.part__idees { margin-top: 0.4rem; }
.idee {
  display: flex; width: 100%; gap: 0.8rem; align-items: baseline;
  background: none; border: 0; cursor: pointer; color: inherit;
  padding: 0.35rem 0; text-align: left;
  border-top: 1px solid var(--reglure);
  font-size: 0.85rem;
}
.idee span:first-child { flex: 1 1 auto; min-width: 0; }
.idee__prix {
  flex: 0 0 auto; color: var(--graphite);
  font-family: var(--police-chiffres); font-variant-numeric: tabular-nums;
}

/* Un montant prévu mais pas dépensé reste gris : il n'a pas la voix du stylo. */
.ligne__prevu { color: var(--graphite) !important; }

.jour__totaux--lien {
  background: none; border: 0; padding: 0; cursor: pointer;
  color: inherit; font: inherit;
  font-family: var(--police-chiffres); font-variant-numeric: tabular-nums;
}

/* --------------------------------------------------------------- vide ---- */

.vide { padding: 3.5rem 1.6rem; text-align: center; }
.vide__trait { width: 1px; height: 3rem; background: var(--bille); margin: 0 auto 1.2rem; }
.vide h2 { font-family: var(--police-texte); font-weight: 400; font-size: 1.25rem; margin: 0 0 0.4rem; }
.vide p { color: var(--graphite); font-size: 0.92rem; margin: 0 0 1.2rem; }

/* ------------------------------------------------------ barre de saisie ---- */

#barre {
  position: fixed; z-index: 40;
  left: 0; right: 0; bottom: 0;
  padding: 0.5rem 0.75rem calc(0.5rem + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--papier) 62%, transparent);
  display: flex; gap: 0.45rem;
}
#barre button {
  border: 0; cursor: pointer; border-radius: var(--rayon);
  height: 3.5rem; display: flex; align-items: center; justify-content: center;
  gap: 0.45rem; font-size: 0.95rem; font-weight: 600;
}
.barre__photo { flex: 1 1 auto; background: var(--bille); color: #fff; }
.barre__photo:active { transform: scale(0.985); }
.barre__second {
  flex: 0 0 3.5rem; background: var(--papier-haut);
  color: var(--encre); border: 1px solid var(--reglure) !important;
  font-family: var(--police-chiffres);
}
#barre svg { width: 20px; height: 20px; }

/* ------------------------------------------------------------ feuilles ---- */

.voile {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(10, 12, 16, 0.42);
  display: flex; align-items: flex-end; justify-content: center;
}
@keyframes monter { from { transform: translateY(1.5rem); } }
.feuille {
  background: var(--papier);
  width: 100%; max-width: 560px;
  max-height: 92dvh; display: flex; flex-direction: column;
  border-radius: 16px 16px 0 0;
  animation: monter 180ms ease-out;
}
.feuille__entete {
  display: grid; grid-template-columns: 4.5rem 1fr 4.5rem;
  align-items: center; padding: 0.5rem 0.6rem;
  border-bottom: 1px solid var(--reglure);
}
.feuille__titre { text-align: center; font-size: 0.95rem; font-weight: 600; }
.feuille__entete button {
  background: none; border: 0; color: var(--bille); cursor: pointer;
  padding: 0.55rem 0.4rem; font-size: 0.92rem;
}
.feuille__entete button.principal { font-weight: 650; text-align: right; }
.feuille__corps {
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 0.9rem 1rem calc(1.4rem + env(safe-area-inset-bottom));
}

/* --------------------------------------------------------------- champs ---- */

.champ { margin-bottom: 0.95rem; }
.champ > label, .legende {
  display: block; font-size: 0.76rem; font-weight: 600;
  color: var(--graphite); margin-bottom: 0.28rem;
}
.champ input[type=text], .champ input[type=date], .champ input[type=time],
.champ input[type=number], .champ input[type=password], .champ select, .champ textarea {
  width: 100%; background: var(--papier-haut);
  border: 1px solid var(--reglure); border-radius: 8px;
  padding: 0.62rem 0.7rem; -webkit-appearance: none; appearance: none;
}
.champ select { background-image: none; }
.champ textarea { font-family: var(--police-texte); min-height: 5.5rem; resize: vertical; }
.champ input:focus, .champ select:focus, .champ textarea:focus {
  outline: none; border-color: var(--bille);
}
.champ .aide { font-size: 0.76rem; color: var(--graphite); margin-top: 0.3rem; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.trio { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.6rem; }

.segments { display: flex; gap: 0.3rem; }
.segments button {
  flex: 1; padding: 0.55rem 0.3rem; cursor: pointer;
  background: var(--papier-haut); border: 1px solid var(--reglure);
  border-radius: 8px; font-size: 0.85rem;
}
.segments button[aria-pressed="true"] {
  background: var(--bille-pale); border-color: var(--bille); color: var(--bille); font-weight: 600;
}

.etoiles-saisie { display: flex; gap: 0.15rem; }
.etoiles-saisie button {
  background: none; border: 0; cursor: pointer; font-size: 1.4rem;
  padding: 0.1rem 0.25rem; color: var(--reglure); line-height: 1;
}
.etoiles-saisie button.pleine { color: var(--bille); }

.bouton {
  display: block; width: 100%; text-align: center; cursor: pointer;
  padding: 0.8rem; border-radius: var(--rayon); font-size: 0.95rem; font-weight: 600;
  background: var(--bille); color: #fff; border: 0;
}
.bouton--calme { background: var(--papier-haut); color: var(--encre); border: 1px solid var(--reglure); }
.bouton--danger { background: none; color: var(--rature); border: 1px solid var(--rature); }
.bouton + .bouton { margin-top: 0.5rem; }

.lien-lieu {
  display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
  width: 100%; background: var(--papier-haut); border: 1px solid var(--reglure);
  border-radius: 8px; padding: 0.62rem 0.7rem; cursor: pointer; text-align: left;
}
.lien-lieu .chevron { color: var(--bille); flex: 0 0 auto; }

.filtres-actifs {
  display: flex; gap: 0.35rem; overflow-x: auto; padding: 0.5rem 1rem 0.2rem;
  scrollbar-width: none;
}
.filtres-actifs::-webkit-scrollbar { display: none; }
.filtres-actifs .puce {
  flex: 0 0 auto; font-size: 0.78rem; padding: 0.2rem 0.6rem;
  border-radius: 999px; background: var(--bille-pale); color: var(--bille);
  border: 0; cursor: pointer; white-space: nowrap;
}

/* ------------------------------------------------------------- toasts ---- */

#toasts {
  position: fixed; z-index: 60;
  left: 0; right: 0; bottom: calc(4.6rem + env(safe-area-inset-bottom));
  display: flex; flex-direction: column-reverse; align-items: center; gap: 0.4rem;
  pointer-events: none; padding: 0 0.75rem;
}
@keyframes toast-entree { from { transform: translateY(0.6rem); opacity: 0; } }
.toast {
  pointer-events: auto;
  background: var(--encre); color: var(--papier);
  border-radius: var(--rayon); padding: 0.65rem 0.5rem 0.65rem 0.9rem;
  font-size: 0.88rem; display: flex; align-items: center; gap: 0.5rem;
  max-width: 560px; width: 100%;
  animation: toast-entree 160ms ease-out;
}
.toast__texte { flex: 1 1 auto; min-width: 0; }
.toast button {
  background: none; border: 0; cursor: pointer; flex: 0 0 auto;
  color: var(--bille); font-weight: 600; padding: 0.3rem 0.5rem; font-size: 0.88rem;
}
@media (prefers-color-scheme: light) { .toast button { color: #8FA4FF; } }

/* ------------------------------------------------- visionneuse photo ---- */

#visionneuse {
  position: fixed; inset: 0; z-index: 70; background: #0b0d10;
  display: flex; align-items: center; justify-content: center;
}
#visionneuse img { max-width: 100%; max-height: 100%; object-fit: contain; }

<script>
"use strict";

/* ==========================================================================
   CARNET DE VOYAGE — phase 1 : saisie et consultation.

   Modèle : deux entités seulement.
     lieu       — un endroit, géolocalisé, noté, photographié
     evenement  — rattaché à un lieu, de type 'visite' | 'depense' | 'achat'

   Une visite, une dépense et un achat sont le MÊME objet avec un type
   différent. Les écrans « mes visites », « mes dépenses », « mes achats » ne
   sont que des filtres sur cette liste unique — il n'y a jamais trois tables.

   Devises : on stocke toujours le montant d'origine ET le taux du jour.
   L'euro est calculé à l'affichage, jamais écrit en base.
   ========================================================================== */

/* ------------------------------------------------------------ constantes -- */

const TYPES_LIEU = ['activité', 'boutique', 'restaurant', 'hébergement', 'transport', 'autre'];
const TYPES_EVENEMENT = ['visite', 'depense', 'achat'];
const LIBELLE_EVENEMENT = { visite: 'Visite', depense: 'Dépense', achat: 'Achat' };
const STATUTS_ACHAT = ['idée', 'acheté', 'offert'];
const CATEGORIES = ['nourriture', 'transport', 'hébergement', 'activité', 'souvenir', 'cadeau', 'santé', 'divers'];
const DEVISES_COURANTES = ['EUR', 'USD', 'GBP', 'CHF', 'JPY', 'THB', 'VND', 'IDR', 'INR', 'KRW',
  'CNY', 'MAD', 'TRY', 'CAD', 'AUD', 'MXN', 'BRL', 'ZAR', 'SEK', 'NOK', 'DKK', 'PLN', 'CZK', 'HUF'];

const RAYON_LIEU_M = 100;      // au-delà, c'est un autre lieu
const JOURS_CORBEILLE = 30;
const PHOTO_MAX_PX = 1600;
const VIGNETTE_MAX_PX = 400;
const PHOTO_QUALITE = 0.8;

/* ------------------------------------------------------------ utilitaires -- */

const $ = (sel, racine = document) => racine.querySelector(sel);

/** Construction de DOM sans innerHTML : rien de ce que je saisis n'est interprété. */
const PROPRIETES = new Set(['value', 'checked', 'disabled', 'textContent', 'selected', 'src', 'hidden']);
function h(balise, attrs, ...enfants) {
  const e = document.createElement(balise);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') Object.assign(e.style, v);
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (PROPRIETES.has(k)) e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const enfant of enfants.flat(4)) {
    if (enfant === null || enfant === undefined || enfant === false) continue;
    e.append(enfant instanceof Node ? enfant : document.createTextNode(String(enfant)));
  }
  return e;
}

function svg(chemin, extra) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('fill', 'none');
  s.setAttribute('stroke', 'currentColor');
  s.setAttribute('stroke-width', extra || '1.7');
  s.setAttribute('stroke-linecap', 'round');
  s.setAttribute('stroke-linejoin', 'round');
  s.setAttribute('aria-hidden', 'true');
  // Taille par défaut : sans elle, un SVG hors d'un contexte dimensionné
  // retomberait sur les 300 × 150 px du navigateur.
  s.setAttribute('width', '20');
  s.setAttribute('height', '20');
  for (const d of [].concat(chemin)) {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    s.append(p);
  }
  return s;
}

const ICONES = {
  recherche: ['M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14Z', 'M16.2 16.2 21 21'],
  points: ['M12 6h.01', 'M12 12h.01', 'M12 18h.01'],
  appareil: ['M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2l1.2-2h8.2l1.2 2h2.2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-9Z', 'M12 15.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z'],
  plume: ['M4 20s5.5-.5 9-4 5-9 5-9-5.5 1.5-9 5-5 8-5 8Z', 'M4 20l5-5'],
  fleche: ['M15 6l-6 6 6 6'],
  croix: ['M6 6l12 12', 'M18 6 6 18'],
  chevron: ['M9 6l6 6-6 6'],
};

const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10));

const delai = (ms) => new Promise((r) => setTimeout(r, ms));

/* -------------------------------------------------------------- dates ---- */

function isoLocal(d = new Date()) {
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function heureLocale(d = new Date()) {
  const p = (n) => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}
function dateDepuisIso(iso) {
  const [a, m, j] = String(iso).split('-').map(Number);
  return new Date(a, (m || 1) - 1, j || 1);
}
const FMT_JOUR = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const FMT_JOUR_ANNEE = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const FMT_COURT = new Intl.DateTimeFormat('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });

function formatJour(iso) {
  const d = dateDepuisIso(iso);
  const fmt = d.getFullYear() === new Date().getFullYear() ? FMT_JOUR : FMT_JOUR_ANNEE;
  return fmt.format(d);
}
const formatDateCourte = (iso) => FMT_COURT.format(dateDepuisIso(iso));

/* ------------------------------------------------------------- monnaie ---- */

function nombre(v) {
  if (typeof v === 'number') return v;
  if (!v) return NaN;
  // On accepte la virgule décimale française et les espaces de milliers.
  return parseFloat(String(v).replace(/\s| | /g, '').replace(',', '.'));
}

function formatMontant(valeur, devise) {
  if (!isFinite(valeur)) return '';
  try {
    return new Intl.NumberFormat('fr-FR', {
      style: 'currency', currency: devise || 'EUR',
      maximumFractionDigits: (devise === 'JPY' || devise === 'KRW' || devise === 'VND' || devise === 'IDR') ? 0 : 2,
    }).format(valeur);
  } catch (_) {
    // Code de devise inconnu d'Intl : on affiche quand même quelque chose de juste.
    return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 }).format(valeur) + ' ' + (devise || '');
  }
}
const formatEuros = (v) => formatMontant(v, 'EUR');

/** Conversion à l'affichage uniquement. Le montant en base n'est jamais réécrit. */
function enEuros(ev) {
  if (!ev || !isFinite(ev.montant)) return 0;
  if (ev.devise === 'EUR') return ev.montant;
  const taux = Number(ev.taux_vers_eur);
  return isFinite(taux) && taux > 0 ? ev.montant * taux : 0;
}
const aUnMontant = (ev) => isFinite(ev.montant) && ev.montant !== null && ev.montant !== 0;

/**
 * Une idée d'achat porte un montant estimé, mais cet argent n'est pas sorti.
 * Elle est donc exclue de TOUS les totaux et vit dans « reste à acheter ».
 */
const estIdee = (ev) => ev.type === 'achat' && ev.statut_achat === 'idée';
const estDepense = (ev) => aUnMontant(ev) && !estIdee(ev);

/* Nombre de jours couverts par un intervalle, bornes incluses. */
function nbJours(du, au) {
  return Math.round((dateDepuisIso(au) - dateDepuisIso(du)) / 86400000) + 1;
}
function decalerJours(iso, n) {
  const d = dateDepuisIso(iso);
  d.setDate(d.getDate() + n);
  return isoLocal(d);
}

/* ----------------------------------------------------------- géographie ---- */

/** Distance en mètres entre deux points (formule de haversine). */
function distance(lat1, lon1, lat2, lon2) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2
    + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

/* ==========================================================================
   BASE DE DONNÉES (IndexedDB)

   Règle absolue du projet : aucune perte de données. Toute écriture passe par
   `ecrire()`, dont la promesse ne se résout qu'à l'événement `complete` de la
   transaction. L'interface n'affiche jamais quelque chose comme enregistré
   avant ce moment-là.
   ========================================================================== */

const DB = { nom: 'carnet-voyage', version: 1, db: null };

function ouvrirBase() {
  return new Promise((ok, ko) => {
    if (!self.indexedDB) return ko(new Error('indexeddb-absent'));
    let req;
    try { req = indexedDB.open(DB.nom, DB.version); }
    catch (e) { return ko(e); }

    req.onupgradeneeded = () => {
      const db = req.result;

      if (!db.objectStoreNames.contains('lieux')) {
        const s = db.createObjectStore('lieux', { keyPath: 'id' });
        s.createIndex('ville', 'ville');
        s.createIndex('pays', 'pays');
        s.createIndex('type', 'type');
      }
      if (!db.objectStoreNames.contains('evenements')) {
        const s = db.createObjectStore('evenements', { keyPath: 'id' });
        s.createIndex('lieu_id', 'lieu_id');
        s.createIndex('date', 'date');
        s.createIndex('type', 'type');
        s.createIndex('beneficiaire', 'beneficiaire');
      }
      // Les photos vivent dans leur propre magasin : une ligne de journal se
      // lit sans jamais charger un seul octet d'image.
      if (!db.objectStoreNames.contains('photos')) {
        const s = db.createObjectStore('photos', { keyPath: 'id' });
        s.createIndex('parent', 'parent_id');
      }
      if (!db.objectStoreNames.contains('prefs')) {
        db.createObjectStore('prefs', { keyPath: 'cle' });
      }
    };

    req.onsuccess = () => {
      DB.db = req.result;
      // iOS peut fermer la connexion après une longue mise en veille : on la
      // rouvre à la demande plutôt que de laisser l'app dans un état mort.
      DB.db.onclose = () => { DB.db = null; };
      DB.db.onversionchange = () => { DB.db.close(); DB.db = null; };
      ok(DB.db);
    };
    req.onerror = () => ko(req.error || new Error('ouverture-refusee'));
    req.onblocked = () => ko(new Error('base-bloquee'));
  });
}

async function base() {
  if (!DB.db) await ouvrirBase();
  return DB.db;
}

const attendreReq = (req) => new Promise((ok, ko) => {
  req.onsuccess = () => ok(req.result);
  req.onerror = () => ko(req.error);
});

async function lire(magasin, cle) {
  const db = await base();
  return attendreReq(db.transaction(magasin, 'readonly').objectStore(magasin).get(cle));
}

async function lireTout(magasin) {
  const db = await base();
  return attendreReq(db.transaction(magasin, 'readonly').objectStore(magasin).getAll());
}

/**
 * Écriture confirmée. `fn` reçoit un objet { magasin: objectStore } et empile
 * ses opérations ; la promesse ne se résout qu'une fois la transaction
 * réellement validée par le navigateur.
 */
async function ecrire(magasins, fn) {
  const db = await base();
  const liste = [].concat(magasins);
  const tx = db.transaction(liste, 'readwrite');
  const stores = {};
  for (const m of liste) stores[m] = tx.objectStore(m);
  let resultat;
  try { resultat = fn(stores); } catch (e) { try { tx.abort(); } catch (_) {} throw e; }
  await new Promise((ok, ko) => {
    tx.oncomplete = () => ok();
    tx.onerror = () => ko(tx.error);
    tx.onabort = () => ko(tx.error || new Error('transaction-annulee'));
  });
  return resultat;
}

/** Traduit les échecs d'écriture en phrases utiles, jamais en excuses. */
function messageErreurEcriture(err) {
  const nom = err && err.name;
  if (nom === 'QuotaExceededError') {
    return "Le stockage du téléphone est plein. Videz la corbeille ou supprimez quelques photos, puis réessayez.";
  }
  if (nom === 'InvalidStateError' || nom === 'TransactionInactiveError') {
    return "La base s'est fermée pendant la mise en veille. Réessayez, elle se rouvre toute seule.";
  }
  return "L'enregistrement n'a pas abouti. Rien n'a été modifié — réessayez.";
}

/* ------------------------------------------------------------- préférences -- */

async function lirePrefs() {
  const tout = await lireTout('prefs');
  const p = {};
  for (const e of tout) p[e.cle] = e.valeur;
  return p;
}
async function ecrirePref(cle, valeur) {
  await ecrire('prefs', (s) => s.prefs.put({ cle, valeur }));
  etat.prefs[cle] = valeur;
}

/* ==========================================================================
   PHOTOS

   Redimensionnées côté client avant stockage : ~1600 px max en WebP qualité
   0.8, plus une vignette ~400 px conservée séparément pour les listes.
   Les deux sont des Blobs dans IndexedDB — jamais de base64, jamais de fichier
   externe.
   ========================================================================== */

let formatPhoto = null;   // 'image/webp' ou repli 'image/jpeg' (vieux Safari)

async function detecterFormat() {
  if (formatPhoto) return formatPhoto;
  const c = document.createElement('canvas');
  c.width = c.height = 1;
  const b = await new Promise((r) => c.toBlob(r, 'image/webp', 0.8));
  formatPhoto = (b && b.type === 'image/webp') ? 'image/webp' : 'image/jpeg';
  return formatPhoto;
}

/** Décodage tolérant : createImageBitmap gère l'orientation EXIF ; sinon, <img>. */
async function decoder(fichier) {
  if (self.createImageBitmap) {
    try { return await createImageBitmap(fichier, { imageOrientation: 'from-image' }); }
    catch (_) { /* certains Safari refusent les options : on retente sans */ }
    try { return await createImageBitmap(fichier); } catch (_) {}
  }
  const url = URL.createObjectURL(fichier);
  try {
    const img = new Image();
    img.decoding = 'sync';
    await new Promise((ok, ko) => {
      img.onload = ok;
      img.onerror = () => ko(new Error('image-illisible'));
      img.src = url;
    });
    return img;
  } finally {
    // L'URL reste valide jusqu'au dessin sur le canvas : on libère après coup.
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }
}

function dessiner(source, maxCote) {
  const l = source.width || source.naturalWidth;
  const hh = source.height || source.naturalHeight;
  const ratio = Math.min(1, maxCote / Math.max(l, hh));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(l * ratio));
  c.height = Math.max(1, Math.round(hh * ratio));
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(source, 0, 0, c.width, c.height);
  return c;
}

const versBlob = (canvas, type, q) => new Promise((r) => canvas.toBlob(r, type, q));

/**
 * Prépare une photo pour le stockage. Renvoie l'enregistrement complet, prêt
 * à être écrit, plus les dimensions à mémoriser côté entité (pour réserver la
 * place à l'écran avant même que l'image ne soit chargée).
 */
async function preparerPhoto(fichier) {
  if (!fichier || !fichier.type || !fichier.type.startsWith('image/')) {
    throw new Error('pas-une-image');
  }
  const type = await detecterFormat();
  const source = await decoder(fichier);

  const grand = dessiner(source, PHOTO_MAX_PX);
  const petit = dessiner(source, VIGNETTE_MAX_PX);
  const blob = await versBlob(grand, type, PHOTO_QUALITE);
  const vignette = await versBlob(petit, type, PHOTO_QUALITE);
  if (source.close) source.close();
  if (!blob || !vignette) throw new Error('encodage-impossible');

  const id = uid();
  return {
    enregistrement: {
      id, blob, vignette, type_mime: type,
      largeur: grand.width, hauteur: grand.height,
      poids: blob.size, cree_le: new Date().toISOString(),
      parent_id: null,
    },
    reference: { id, l: grand.width, h: grand.height },
  };
}

/* ---- URLs d'affichage : cache borné, révoquées en FIFO pour la mémoire ---- */

const urlsVignettes = new Map();
const ordreVignettes = [];

async function urlVignette(id) {
  if (urlsVignettes.has(id)) return urlsVignettes.get(id);
  const p = await lire('photos', id).catch(() => null);
  if (!p) return null;
  const url = URL.createObjectURL(p.vignette || p.blob);
  urlsVignettes.set(id, url);
  ordreVignettes.push(id);
  while (ordreVignettes.length > 120) {
    const vieux = ordreVignettes.shift();
    URL.revokeObjectURL(urlsVignettes.get(vieux));
    urlsVignettes.delete(vieux);
  }
  return url;
}

/** Élément <img> qui réserve sa place immédiatement puis se remplit. */
function imgVignette(ref, classe) {
  const id = typeof ref === 'string' ? ref : ref.id;
  const img = h('img', { class: classe || 'photo', alt: '', loading: 'lazy', decoding: 'async' });
  if (ref && ref.l && ref.h) img.style.aspectRatio = ref.l + ' / ' + ref.h;
  else img.classList.add('photo--vide');
  urlVignette(id).then((u) => { if (u) img.src = u; else img.remove(); });
  return img;
}

async function ouvrirVisionneuse(id) {
  const p = await lire('photos', id).catch(() => null);
  if (!p) return toast("Cette photo est introuvable.");
  const url = URL.createObjectURL(p.blob || p.vignette);
  const fermer = () => { vue.remove(); URL.revokeObjectURL(url); };
  const vue = h('div', { id: 'visionneuse', role: 'dialog', 'aria-label': 'Photo' },
    h('img', { src: url, alt: '' }),
    h('button', { class: 'ico', 'aria-label': 'Fermer', onclick: fermer }, svg(ICONES.croix, '2')),
  );
  vue.addEventListener('click', (e) => { if (e.target === vue) fermer(); });
  document.body.append(vue);
}

/* ==========================================================================
   ÉTAT

   Tout tient en mémoire : un carnet personnel, ce sont des milliers de lignes
   au plus. Les photos, elles, restent dans la base et se chargent à la demande.
   ========================================================================== */

const etat = {
  vue: { nom: 'journal' },
  lieux: new Map(),
  evenements: [],
  prefs: {},
  filtres: videsFiltres(),
};

function videsFiltres() {
  return { texte: '', typeEv: '', typeLieu: '', ville: '', pays: '', tag: '', du: '', au: '', beneficiaire: '' };
}
const filtresActifs = () => Object.values(etat.filtres).some((v) => v !== '');

async function chargerEtat() {
  const [lieux, evenements, prefs] = await Promise.all([lireTout('lieux'), lireTout('evenements'), lirePrefs()]);
  // Les éléments en corbeille restent en mémoire : la fiche d'un lieu supprimé
  // doit rester lisible depuis la corbeille.
  etat.lieux = new Map(lieux.map((l) => [l.id, l]));
  etat.evenements = evenements.sort(triChronoDesc);
  etat.prefs = prefs;
}

function triChronoDesc(a, b) {
  if (a.date !== b.date) return a.date < b.date ? 1 : -1;
  const ha = a.heure || '', hb = b.heure || '';
  if (ha !== hb) return ha < hb ? 1 : -1;
  return (b.cree_le || '') < (a.cree_le || '') ? -1 : 1;
}

const evenementsVivants = () => etat.evenements.filter((e) => !e.supprime_le);
const lieuxVivants = () => [...etat.lieux.values()].filter((l) => !l.supprime_le);
const lieuDe = (ev) => etat.lieux.get(ev.lieu_id) || null;
const nomLieu = (l) => (l && l.nom && l.nom.trim()) || '';

function tousLesTags() {
  const s = new Set();
  for (const l of lieuxVivants()) for (const t of l.tags || []) s.add(t);
  return [...s].sort((a, b) => a.localeCompare(b, 'fr'));
}
function tousLesBeneficiaires() {
  const s = new Set();
  for (const e of evenementsVivants()) if (e.beneficiaire) s.add(e.beneficiaire);
  return [...s].sort((a, b) => a.localeCompare(b, 'fr'));
}
function toutesLesVilles() {
  const s = new Set();
  for (const l of lieuxVivants()) if (l.ville) s.add(l.ville);
  return [...s].sort((a, b) => a.localeCompare(b, 'fr'));
}
function tousLesPays() {
  const s = new Set();
  for (const l of lieuxVivants()) if (l.pays) s.add(l.pays);
  return [...s].sort((a, b) => a.localeCompare(b, 'fr'));
}

/* ------------------------------------------------------------- filtres ---- */

function evenementsFiltres() {
  const f = etat.filtres;
  const texte = f.texte.trim().toLowerCase();
  return evenementsVivants().filter((ev) => {
    const lieu = lieuDe(ev);
    if (f.typeEv && ev.type !== f.typeEv) return false;
    if (f.typeLieu && (!lieu || lieu.type !== f.typeLieu)) return false;
    if (f.ville && (!lieu || lieu.ville !== f.ville)) return false;
    if (f.pays && (!lieu || lieu.pays !== f.pays)) return false;
    if (f.tag && (!lieu || !(lieu.tags || []).includes(f.tag))) return false;
    if (f.beneficiaire && ev.beneficiaire !== f.beneficiaire) return false;
    if (f.du && ev.date < f.du) return false;
    if (f.au && ev.date > f.au) return false;
    if (texte) {
      const foin = [
        nomLieu(lieu), lieu && lieu.ville, lieu && lieu.pays, lieu && lieu.adresse,
        lieu && lieu.commentaire, (lieu && lieu.tags || []).join(' '),
        ev.commentaire, ev.beneficiaire, ev.categorie, ev.devise,
      ].filter(Boolean).join(' ').toLowerCase();
      if (!foin.includes(texte)) return false;
    }
    return true;
  });
}

let idNouvelleLigne = null;   // ligne à faire se tracer au prochain rendu

function rendre() {
  const conteneur = $('#vue');
  conteneur.textContent = '';
  $('#entete').hidden = false;
  $('#barre').hidden = !['journal', 'lieu', 'argent'].includes(etat.vue.nom);

  rendreEntete();
  rendreBarre();

  const parVue = {
    journal: vueJournal,
    lieu: vueLieu,
    argent: vueArgent,
    corbeille: vueCorbeille,
    reglages: vueReglages,
  };
  conteneur.append((parVue[etat.vue.nom] || vueJournal)());

  // Les en-têtes de jour se collent juste sous la barre de titre.
  requestAnimationFrame(() => {

function vueJournal() {
  const frag = document.createDocumentFragment();
  const evs = evenementsFiltres();

  if (filtresActifs()) frag.append(rendrePucesFiltres(evs.length));

  if (!evs.length) {
    frag.append(filtresActifs() ? videFiltres() : videJournal());
    return frag;
  }

  // Regroupement par jour, du plus récent au plus ancien.
  const jours = new Map();
  for (const ev of evs) {
    if (!jours.has(ev.date)) jours.set(ev.date, []);
    jours.get(ev.date).push(ev);
  }

  const ajd = isoLocal();
  for (const [date, liste] of jours) {
    frag.append(
      h('div', { class: 'jour__entete' },
        h('div', { class: 'jour__date' + (date === ajd ? ' est-aujourdhui' : '') },
          date === ajd ? "aujourd'hui" : formatJour(date)),
        totauxDuJour(liste, date),
      ),
      h('div', null, liste.map(ligneEvenement)),
    );
  }
  return frag;
}

/**
 * Total du jour. Si toutes les dépenses du jour sont dans une même devise
 * étrangère, on affiche ce total d'origine en premier et l'euro en dessous :
 * c'est dans cette devise-là que la journée a été vécue.
 */
function totauxDuJour(liste, date) {
  // Les idées d'achat portent un montant estimé, jamais dépensé : hors total.
  const depenses = liste.filter(estDepense);
  if (!depenses.length) return h('div', { class: 'jour__totaux' });

  const euros = depenses.reduce((s, e) => s + enEuros(e), 0);
  const devises = new Set(depenses.map((e) => e.devise || 'EUR'));

  let contenu;
  if (devises.size === 1) {
    const dev = [...devises][0];
    const brut = depenses.reduce((s, e) => s + e.montant, 0);
    contenu = dev === 'EUR'
      ? [formatEuros(brut)]
      : [formatMontant(brut, dev), h('div', { class: 'secondaire' }, formatEuros(euros))];
  } else {
    contenu = [formatEuros(euros), h('div', { class: 'secondaire' }, devises.size + ' devises')];
  }

  // Le total du jour est une porte vers l'écran Argent, sur ce jour-là.
  if (!date) return h('div', { class: 'jour__totaux' }, contenu);
  return h('button', {
    class: 'jour__totaux jour__totaux--lien',
    'aria-label': 'Voir le détail de cette journée',
    onclick: () => naviguer({ nom: 'argent', mode: 'jour', ancre: date }),
  }, contenu);
}

function ligneEvenement(ev) {
  const lieu = lieuDe(ev);

  const marge = h('div', { class: 'ligne__marge' },
    h('span', { class: 'ligne__heure' }, ev.heure || ''),

        h('span', { class: 'ligne__montant' + (idee ? ' ligne__prevu' : '') },
          formatMontant(ev.montant, ev.devise)),
        ev.devise !== 'EUR' && enEuros(ev)

      ]
      : h('span', { class: 'ligne__montant ligne__vide' }, '—'),

  const meta = [];
  if (lieu && lieu.type) meta.push(lieu.type);
  if (lieu && lieu.ville) meta.push((meta.length ? 'à ' : '') + lieu.ville);
  if (!lieu) meta.push('lieu supprimé');

  const corps = h('div', { class: 'ligne__corps' },

      'aria-label': 'Agrandir la photo',

      ev.commentaire ? h('div', { class: 'ligne__mot' }, ev.commentaire) : null,
      etiquettes(ev),

  const cls = 'ligne' + (estDepense(ev) ? ' ligne--argent' : '')

  return h('div', { class: cls, dataset: { id: ev.id } }, marge, corps);

function etiquettes(ev) {

/* ==========================================================================
   ARGENT (phase 2)

   Règle intangible, posée par le carnet et rappelée ici : chaque montant est
   converti avec LE TAUX DU JOUR OÙ IL A ÉTÉ NOTÉ, figé dans l'événement. On
   ne recalcule jamais un total passé au taux d'aujourd'hui. « J'ai dépensé
   25,80 € ce jour-là » doit rester vrai pour toujours.

   Deuxième règle : une idée d'achat n'est pas une dépense. Elle est exclue de
   tous les totaux et vit dans sa propre liste.
   ========================================================================== */

const FMT_JOUR_MOIS = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'long' });
const FMT_MOIS_ANNEE = new Intl.DateTimeFormat('fr-FR', { month: 'long', year: 'numeric' });
const FMT_JOUR_COURT = new Intl.DateTimeFormat('fr-FR', { weekday: 'narrow' });

function lundiDe(iso) {
  const d = dateDepuisIso(iso);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   // lundi = premier jour, usage français
  return isoLocal(d);
}

/** Bornes de la période affichée, selon le mode et la date d'ancrage. */
function bornesPeriode(mode, ancre) {
  if (mode === 'jour') return { du: ancre, au: ancre };
  if (mode === 'semaine') {
    const du = lundiDe(ancre);
    return { du, au: decalerJours(du, 6) };
  }
  if (mode === 'mois') {
    const d = dateDepuisIso(ancre);
    const du = isoLocal(new Date(d.getFullYear(), d.getMonth(), 1));
    const au = isoLocal(new Date(d.getFullYear(), d.getMonth() + 1, 0));
    return { du, au };
  }
  // « tout » : du premier jour noté jusqu'à aujourd'hui.
  const dates = evenementsVivants().map((e) => e.date).sort();
  return { du: dates[0] || isoLocal(), au: isoLocal() };
}

function decalerPeriode(mode, ancre, sens) {
  if (mode === 'jour') return decalerJours(ancre, sens);
  if (mode === 'semaine') return decalerJours(lundiDe(ancre), sens * 7);
  if (mode === 'mois') {
    const d = dateDepuisIso(ancre);
    return isoLocal(new Date(d.getFullYear(), d.getMonth() + sens, 1));
  }
  return ancre;
}

function libellePeriode(mode, du, au) {
  if (mode === 'tout') return 'tout le carnet';
  if (mode === 'mois') return FMT_MOIS_ANNEE.format(dateDepuisIso(du));
  if (du === au) return du === isoLocal() ? "aujourd'hui" : formatJour(du);
  const a = dateDepuisIso(du), b = dateDepuisIso(au);
  return a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear()
    ? a.getDate() + ' – ' + FMT_JOUR_MOIS.format(b)
    : FMT_JOUR_MOIS.format(a) + ' – ' + FMT_JOUR_MOIS.format(b);
}

/** Somme par clé, triée du plus gros au plus petit. */
function repartir(evs, cle) {
  const par = new Map();
  for (const ev of evs) {
    const k = cle(ev) || '';
    const c = par.get(k) || { euros: 0, n: 0 };
    c.euros += enEuros(ev);
    c.n += 1;
    par.set(k, c);
  }
  return [...par.entries()]
    .map(([k, v]) => ({ cle: k, ...v }))
    .sort((a, b) => b.euros - a.euros);
}

/**
 * Regroupement du rythme en 5 à 12 colonnes selon l'étendue : c'est ce qui
 * garde des barres tapables au doigt, quelle que soit la période choisie.
 */
function bucketsRythme(du, au, evs) {
  const span = nbJours(du, au);
  if (span < 2) return null;                       // un seul jour : pas de graphique

  let pas, mode;
  if (span <= 12) { pas = 'jour'; mode = 'jour'; }
  else if (span <= 84) { pas = 'semaine'; mode = 'semaine'; }
  else { pas = 'mois'; mode = 'mois'; }

  const seaux = [];
  let curseur = pas === 'jour' ? du : pas === 'semaine' ? lundiDe(du)
    : isoLocal(new Date(dateDepuisIso(du).getFullYear(), dateDepuisIso(du).getMonth(), 1));

  while (curseur <= au && seaux.length < 40) {
    const bornes = bornesPeriode(pas, curseur);
    seaux.push({
      ancre: curseur, mode,
      du: bornes.du, au: bornes.au,
      euros: 0,
      etiquette: pas === 'jour' ? FMT_JOUR_COURT.format(dateDepuisIso(curseur))
        : pas === 'semaine' ? String(dateDepuisIso(bornes.du).getDate())
          : FMT_MOIS_ANNEE.format(dateDepuisIso(curseur)).slice(0, 3),
    });
    curseur = decalerPeriode(pas, curseur, 1);
  }
  for (const ev of evs) {
    const s = seaux.find((x) => ev.date >= x.du && ev.date <= x.au);
    if (s) s.euros += enEuros(ev);
  }
  return seaux.length >= 2 ? seaux : null;
}

/** `append` ignore les sections vides — sans quoi le DOM afficherait « null ». */
function ajouter(frag, ...sections) {
  for (const s of sections) if (s) frag.append(s);
}

function vueArgent() {
  const mode = etat.vue.mode || 'semaine';
  const ancre = etat.vue.ancre || isoLocal();
  const { du, au } = bornesPeriode(mode, ancre);

  const evs = evenementsVivants().filter((e) => e.date >= du && e.date <= au && estDepense(e));
  const total = evs.reduce((s, e) => s + enEuros(e), 0);

  // Moyenne sur les jours écoulés seulement : une période à venir ne dilue pas.
  const auEcoule = au > isoLocal() ? isoLocal() : au;
  const joursEcoules = Math.max(1, nbJours(du, auEcoule < du ? du : auEcoule));
  const moyenne = total / joursEcoules;

  const frag = document.createDocumentFragment();

  /* --- sélecteur de période --------------------------------------------- */
  frag.append(h('div', { class: 'periode' },
    h('div', { class: 'segments', role: 'group', 'aria-label': 'Période' },
      [['jour', 'Jour'], ['semaine', 'Semaine'], ['mois', 'Mois'], ['tout', 'Tout']].map(([m, label]) =>
        h('button', {
          type: 'button', 'aria-pressed': mode === m ? 'true' : 'false',
          onclick: () => majVue({ nom: 'argent', mode: m, ancre }),
        }, label))),
    h('div', { class: 'periode__nav' },
      h('button', {
        class: 'ico', 'aria-label': 'Période précédente', disabled: mode === 'tout',
        onclick: () => majVue({ nom: 'argent', mode, ancre: decalerPeriode(mode, ancre, -1) }),
      }, svg(ICONES.fleche)),
      h('div', { class: 'periode__libelle' }, libellePeriode(mode, du, au)),
      h('button', {
        class: 'ico', 'aria-label': 'Période suivante',
        disabled: mode === 'tout' || au >= isoLocal(),
        onclick: () => majVue({ nom: 'argent', mode, ancre: decalerPeriode(mode, ancre, 1) }),
      }, svg(ICONES.chevron)),
    ),
  ));

  if (!evs.length) {
    frag.append(h('div', { class: 'vide' },
      h('div', { class: 'vide__trait', style: { background: 'var(--reglure)' } }),
      h('h2', null, 'Rien dépensé sur cette période.'),
      h('p', null, 'Changez de période, ou allez vivre quelque chose.')));
    ajouter(frag, sectionResteAAcheter());
    return frag;
  }

  /* --- le chiffre : une seule fois, en sans, chiffres proportionnels ----- */
  const devises = repartir(evs, (e) => e.devise || 'EUR');
  frag.append(h('div', { class: 'argent__hero' },
    h('div', { class: 'hero' }, formatEuros(total)),
    h('div', { class: 'hero__sous' },
      evs.length + (evs.length > 1 ? ' entrées' : ' entrée'),
      joursEcoules > 1 ? ', soit ' + formatEuros(moyenne) + ' par jour' : ''),
  ));

  /* --- rythme : une série, une teinte, pas de légende -------------------- */
  const seaux = bucketsRythme(du, au, evs);
  if (seaux) {
    const max = Math.max(...seaux.map((s) => s.euros), 1);
    const pointe = seaux.reduce((a, b) => (b.euros > a.euros ? b : a));
    frag.append(h('section', { class: 'bloc' },
      h('h3', { class: 'bloc__titre' }, 'Rythme'),
      h('div', { class: 'rythme', role: 'group', 'aria-label': 'Dépenses par période' },
        seaux.map((s) => h('button', {
          class: 'rythme__col',
          'aria-label': libellePeriode(s.mode, s.du, s.au) + ' : ' + formatEuros(s.euros),
          onclick: () => majVue({ nom: 'argent', mode: s.mode, ancre: s.ancre }),
        },
          h('div', {
            class: 'rythme__barre' + (s.euros ? '' : ' rythme__barre--zero'),
            style: { height: Math.max(s.euros ? 3 : 1, Math.round((s.euros / max) * 100)) + '%' },
          }))),
      ),
      h('div', { class: 'rythme__axe', 'aria-hidden': 'true' },
        seaux.map((s) => h('span', null, s.etiquette))),
      // Étiquetage sélectif : la pointe, pas un chiffre sur chaque barre.
      h('div', { class: 'bloc__note' },
        'Plus forte période : ' + formatEuros(pointe.euros) + ' — '
        + libellePeriode(pointe.mode, pointe.du, pointe.au)
        + '. Touchez une barre pour l’ouvrir.'),
    ));
  }

  /* --- répartitions : le libellé porte l'identité, la teinte est unique -- */
  ajouter(frag, blocRepartition('Par catégorie', repartir(evs, (e) => e.categorie), total, 'sans catégorie'));

  const parPays = repartir(evs, (e) => (lieuDe(e) || {}).pays);
  if (parPays.length > 1) ajouter(frag, blocRepartition('Par pays', parPays, total, 'pays non renseigné'));

  const parVille = repartir(evs, (e) => (lieuDe(e) || {}).ville);
  if (parVille.length > 1) ajouter(frag, blocRepartition('Par ville', parVille, total, 'ville non renseignée'));

  /* --- devises : le montant d'origine d'abord --------------------------- */
  if (devises.length > 1 || (devises[0] && devises[0].cle !== 'EUR')) {
    frag.append(h('section', { class: 'bloc' },
      h('h3', { class: 'bloc__titre' }, 'Par devise'),
      devises.map((d) => {
        const brut = evs.filter((e) => (e.devise || 'EUR') === d.cle)
          .reduce((s, e) => s + e.montant, 0);
        return h('div', { class: 'part' },
          h('div', { class: 'part__haut' },
            h('span', { class: 'part__nom' }, formatMontant(brut, d.cle)),
            h('span', { class: 'part__valeur' }, d.cle === 'EUR' ? '' : formatEuros(d.euros))),
          h('div', { class: 'part__note' }, d.n + (d.n > 1 ? ' entrées' : ' entrée')));
      }),
      h('div', { class: 'bloc__note' },
        'Chaque montant est converti au taux du jour où vous l’avez noté. Les totaux passés ne bougent jamais.'),
    ));
  }

  /* --- par personne ------------------------------------------------------ */
  const parPersonne = repartir(evs.filter((e) => e.beneficiaire), (e) => e.beneficiaire);
  if (parPersonne.length) {
    frag.append(h('section', { class: 'bloc' },
      h('h3', { class: 'bloc__titre' }, 'Pour qui'),
      parPersonne.map((p) => h('button', {
        class: 'part part--lien',
        onclick: () => {
          etat.filtres = videsFiltres();
          etat.filtres.beneficiaire = p.cle;
          naviguer({ nom: 'journal' });
        },
      },
        h('div', { class: 'part__haut' },
          h('span', { class: 'part__nom' }, p.cle),
          h('span', { class: 'part__valeur' }, formatEuros(p.euros))),
        h('div', { class: 'part__note' }, p.n + (p.n > 1 ? ' cadeaux' : ' cadeau') + ' — voir dans le journal'))),
      h('div', { class: 'bloc__note' },
        'Ces montants sont bien comptés dans le total ci-dessus : un cadeau reste une dépense.'),
    ));
  }

  ajouter(frag, sectionResteAAcheter());
  ajouter(frag, sectionBudget());

  if (mode === 'jour') {
    frag.append(h('div', { style: { padding: '1.2rem 1rem 0' } },
      h('button', {
        class: 'bouton bouton--calme',
        onclick: () => {
          etat.filtres = videsFiltres();
          etat.filtres.du = du;
          etat.filtres.au = au;
          naviguer({ nom: 'journal' });
        },
      }, 'Voir cette journée dans le journal')));
  }
  return frag;
}

/** Une répartition = des lignes de carnet, une barre fine, une seule teinte. */
function blocRepartition(titre, lignes, total, libelleVide) {
  if (!lignes.length) return null;
  return h('section', { class: 'bloc' },
    h('h3', { class: 'bloc__titre' }, titre),
    lignes.map((l) => h('div', { class: 'part' },
      h('div', { class: 'part__haut' },
        h('span', { class: 'part__nom' + (l.cle ? '' : ' part__nom--vide') }, l.cle || libelleVide),
        h('span', { class: 'part__valeur' }, formatEuros(l.euros))),
      h('div', { class: 'part__piste' },
        h('div', {
          class: 'part__fill',
          style: { width: (total ? Math.max(1, (l.euros / total) * 100) : 0) + '%' },
        })),
    )),
  );
}

/** Les idées d'achat : jamais dans les totaux, toujours visibles. */
function sectionResteAAcheter() {
  const idees = evenementsVivants().filter(estIdee);
  if (!idees.length) return null;

  const parPersonne = new Map();
  for (const ev of idees) {
    const k = ev.beneficiaire || '';
    if (!parPersonne.has(k)) parPersonne.set(k, []);
    parPersonne.get(k).push(ev);
  }
  const totalEstime = idees.reduce((s, e) => s + enEuros(e), 0);

  return h('section', { class: 'bloc' },
    h('h3', { class: 'bloc__titre' }, 'Reste à acheter'),
    [...parPersonne.entries()].map(([qui, liste]) => h('div', { class: 'part' },
      h('div', { class: 'part__haut' },
        h('span', { class: 'part__nom' + (qui ? '' : ' part__nom--vide') }, qui || 'pour moi'),
        h('span', { class: 'part__valeur part__valeur--prevu' },
          formatEuros(liste.reduce((s, e) => s + enEuros(e), 0)))),
      h('div', { class: 'part__idees' }, liste.map((ev) => h('button', {
        class: 'idee', onclick: () => feuilleEvenement(ev),
      },
        h('span', null, (lieuDe(ev) && nomLieu(lieuDe(ev))) || 'Lieu sans nom'),
        h('span', { class: 'idee__prix' }, formatMontant(ev.montant, ev.devise)),
      ))),
    )),
    h('div', { class: 'bloc__note' },
      'Estimé à ' + formatEuros(totalEstime)
      + '. Ces montants ne sont comptés nulle part tant que l’achat n’est pas fait —'
      + ' passez l’entrée en « acheté » pour qu’elle rejoigne vos dépenses.'),
  );
}

/* -------------------------------------------------------------- budget ---- */

function sectionBudget() {
  const b = etat.prefs.budget;
  if (!b || !(b.montant > 0)) {
    return h('section', { class: 'bloc' },
      h('h3', { class: 'bloc__titre' }, 'Budget'),
      h('div', { class: 'bloc__note', style: { marginTop: 0 } },
        'Optionnel. Si vous en posez un, le carnet vous dira où vous en êtes — sans jamais vous faire la morale.'),
      h('div', { style: { padding: '0.7rem 1rem 0' } },
        h('button', { class: 'bouton bouton--calme', onclick: feuilleBudget }, 'Poser un budget')));
  }

  const ajd = isoLocal();
  const finEcoulee = b.fin && b.fin < ajd ? b.fin : ajd;
  const depense = evenementsVivants()
    .filter((e) => estDepense(e) && e.date >= b.debut && e.date <= finEcoulee)
    .reduce((s, e) => s + enEuros(e), 0);

  const reste = b.montant - depense;
  const joursEcoules = Math.max(1, nbJours(b.debut, finEcoulee < b.debut ? b.debut : finEcoulee));
  const rythme = depense / joursEcoules;
  const part = Math.min(100, (depense / b.montant) * 100);

  // Ton informatif : on décrit, on ne réprimande pas.
  let projection;
  if (b.fin && b.fin >= ajd) {
    const joursRestants = Math.max(1, nbJours(ajd, b.fin));
    projection = reste >= 0
      ? 'Il reste ' + formatEuros(reste) + ' pour ' + joursRestants
        + (joursRestants > 1 ? ' jours' : ' jour') + ', soit ' + formatEuros(reste / joursRestants) + ' par jour.'
      : 'Le budget est dépassé de ' + formatEuros(-reste) + ', à ' + joursRestants
        + (joursRestants > 1 ? ' jours' : ' jour') + ' de la fin.';
  } else if (reste >= 0 && rythme > 0) {
    projection = 'À ce rythme, le budget tient jusqu’au '
      + formatDateCourte(decalerJours(ajd, Math.floor(reste / rythme))) + '.';
  } else if (reste >= 0) {
    projection = 'Il reste ' + formatEuros(reste) + '.';
  } else {
    projection = 'Le budget est dépassé de ' + formatEuros(-reste) + '.';
  }

  return h('section', { class: 'bloc' },
    h('h3', { class: 'bloc__titre' }, 'Budget'),
    h('div', { class: 'part' },
      h('div', { class: 'part__haut' },
        h('span', { class: 'part__nom' }, formatEuros(depense) + ' sur ' + formatEuros(b.montant)),
        h('span', { class: 'part__valeur' }, Math.round(part) + ' %')),
      h('div', { class: 'jauge' },
        h('div', { class: 'jauge__fill', style: { width: part + '%' } })),
      h('div', { class: 'part__note' },
        'Depuis le ' + formatDateCourte(b.debut)
        + ' — ' + formatEuros(rythme) + ' par jour en moyenne'),
    ),
    h('div', { class: 'bloc__note' }, projection),
    h('div', { style: { padding: '0.7rem 1rem 0' } },
      h('button', { class: 'bouton bouton--calme', onclick: feuilleBudget }, 'Modifier le budget')),
  );
}

function feuilleBudget() {
  const b = etat.prefs.budget || {};
  let champMontant, champDebut, champFin;

  // Par défaut, le budget démarre au premier jour noté dans le carnet.
  const dates = evenementsVivants().map((e) => e.date).sort();
  const debutParDefaut = b.debut || dates[0] || isoLocal();

  ouvrirFeuille({
    titre: 'Budget',
    labelValider: 'Enregistrer',
    corps: (f) => {
      champMontant = h('input', {
        type: 'text', inputmode: 'decimal',
        value: b.montant ? String(b.montant) : '',
        style: { fontFamily: 'var(--police-chiffres)', textAlign: 'right' },
      });
      champDebut = h('input', { type: 'date', value: debutParDefaut });
      champFin = h('input', { type: 'date', value: b.fin || '' });
      return h('div', null,
        h('div', { class: 'champ' },
          h('label', null, 'Montant prévu, en euros'), champMontant),
        h('div', { class: 'champ' },
          h('label', null, 'Depuis le'), champDebut),
        h('div', { class: 'champ' },
          h('label', null, 'Jusqu’au (facultatif)'), champFin,
          h('div', { class: 'aide' },
            'Avec une date de fin, le carnet vous dit combien vous pouvez dépenser par jour. Sans elle, il vous dit jusqu’à quand le budget tient au rythme actuel.')),
        b.montant ? h('button', {
          class: 'bouton bouton--danger', type: 'button',
          onclick: async () => {
            await ecrirePref('budget', null);
            f.fermer(false, rendre);
          },
        }, 'Retirer le budget') : null,
        h('p', { class: 'note-info' },
          'Le budget n’est qu’un repère. Il ne bloque rien et ne change aucune de vos entrées.'),
      );
    },
    valider: async () => {
      const m = nombre(champMontant.value);
      if (!isFinite(m) || m <= 0) { toast('Indiquez un montant supérieur à zéro.'); return false; }
      if (champFin.value && champFin.value < champDebut.value) {
        toast('La date de fin tombe avant le début.');
        return false;
      }
      await ecrirePref('budget', {
        montant: m,
        debut: champDebut.value || debutParDefaut,
        fin: champFin.value || '',
      });
      return rendre;
    },
  });
}

      h('h2', null, 'La corbeille est vide.'),
      h('p', null, "Ce que vous supprimez reste ici " + JOURS_CORBEILLE + " jours avant de disparaître pour de bon."));
  }

  const frag = document.createDocumentFragment();
  frag.append(h('div', { class: 'sous-titre' },
    'Effacés définitivement ' + JOURS_CORBEILLE + ' jours après leur suppression'));

  const rangeeCorbeille = (titre, sous, restaurer, detruire) =>
    h('div', { class: 'rangee' },
      h('div', { class: 'rangee__texte' },
        h('div', { class: 'rangee__titre' }, titre),
        h('div', { class: 'rangee__sous' }, sous)),
      h('button', {
        class: 'ico', 'aria-label': 'Restaurer', style: { width: '3rem' },
        onclick: restaurer,
      }, h('span', { style: { color: 'var(--bille)', fontSize: '0.85rem', fontWeight: '600' } }, 'Rendre')),
      h('button', {
        class: 'ico', 'aria-label': 'Supprimer définitivement', style: { width: '2.2rem', color: 'var(--rature)' },
        onclick: detruire,
      }, svg(ICONES.croix, '2')),

  for (const l of lieuxSupprimes) {
    const n = etat.evenements.filter((e) => e.lieu_id === l.id).length;
    frag.append(rangeeCorbeille(
      nomLieu(l) || 'Lieu sans nom',
      'Lieu' + (n ? ' et ses ' + n + ' entrées' : '') + ' · supprimé le ' + formatDateCourte(l.supprime_le.slice(0, 10)),
      () => restaurerLieu(l),

    frag.append(rangeeCorbeille(
      LIBELLE_EVENEMENT[ev.type] + (nomLieu(lieu) ? ' — ' + nomLieu(lieu) : ''),
      formatDateCourte(ev.date) + ' · supprimée le ' + formatDateCourte(ev.supprime_le.slice(0, 10)),
      () => restaurerEvenement(ev),
      () => detruireEvenement(ev),

  return frag;

    h('div', { style: { padding: '0.9rem 1rem' } },

function arrondiLisible(v) {
  if (!isFinite(v)) return '?';
  if (v >= 100) return v.toFixed(0);
  if (v >= 1) return v.toFixed(2);
  return v.toPrecision(3);
}

async function decrireStockage() {
  const zone = $('#zone-stockage');
  if (!zone) return;
  const nbPhotos = (await lireTout('photos').catch(() => [])).length;
  let texte = nbPhotos + (nbPhotos > 1 ? ' photos' : ' photo') + ' · '
    + lieuxVivants().length + ' lieux · ' + evenementsVivants().length + ' entrées';
  if (navigator.storage && navigator.storage.estimate) {
    try {
      const { usage, quota } = await navigator.storage.estimate();
      if (usage && quota) {
        texte += ' — ' + (usage / 1048576).toFixed(1) + ' Mo utilisés sur '
          + (quota / 1048576).toFixed(0) + ' Mo disponibles';
      }
    } catch (_) {}
  }
  let persiste = null;
  if (navigator.storage && navigator.storage.persisted) {
    try { persiste = await navigator.storage.persisted(); } catch (_) {}
  }
  zone.textContent = '';
  zone.append(h('p', { class: 'note-info', style: { margin: 0 } }, texte,
    persiste === false
      ? " Le navigateur peut effacer ces données s'il manque de place : installez l'app sur l'écran d'accueil pour l'en empêcher."
      : persiste === true ? ' Stockage protégé contre l’effacement automatique.' : ''));
}

/* ==========================================================================
   FEUILLES (panneaux modaux)
   ========================================================================== */

const feuillesOuvertes = [];
/*
  Fermer une feuille consomme une entrée d'historique (pour que le bouton
  « retour » du téléphone ferme la feuille plutôt que de quitter l'app).
  `history.back()` est asynchrone : enchaîner une fermeture et une navigation
  ferait s'écraser les deux. Toute suite d'action est donc mise en attente ici
  et exécutée une fois l'historique réellement revenu en arrière.
*/
let popsAIgnorer = 0;
let apresPops = [];

function viderApresPops() {
  const liste = apresPops;
  apresPops = [];
  for (const fn of liste) setTimeout(fn, 0);
}

function ouvrirFeuille({ titre, corps, valider, labelValider }) {
  const f = { ferme: false };

  /** `puis` : ce qu'il faut faire une fois la feuille vraiment refermée. */
  const fermer = (viaPop, puis) => {
    if (f.ferme) { if (puis) setTimeout(puis, 0); return; }
    f.ferme = true;
    f.voile.remove();
    const i = feuillesOuvertes.indexOf(f);
    if (i >= 0) feuillesOuvertes.splice(i, 1);
    if (puis) apresPops.push(puis);
    if (!viaPop) { popsAIgnorer++; history.back(); }
    else if (popsAIgnorer === 0) viderApresPops();
  };
  f.fermer = fermer;

  const boiteCorps = h('div', { class: 'feuille__corps' });

  const feuille = h('div', { class: 'feuille', role: 'dialog', 'aria-modal': 'true', 'aria-label': titre },
    h('div', { class: 'feuille__entete' },
      h('button', { onclick: () => fermer() }, valider ? 'Annuler' : 'Fermer'),
      h('div', { class: 'feuille__titre' }, titre),
      valider
        ? h('button', {
          class: 'principal',
          onclick: async () => {
            // `valider` peut renvoyer une fonction : elle sera exécutée après
            // la fermeture, jamais pendant (voir la note sur l'historique).
            const r = await valider(boiteCorps);
            if (r === false) return;
            fermer(false, typeof r === 'function' ? r : null);
          },
        }, labelValider || 'Enregistrer')
        : h('span'),
    ),
    boiteCorps,
  );

  const voile = h('div', { class: 'voile', onclick: (e) => { if (e.target === voile) fermer(); } }, feuille);
  f.voile = voile;
  boiteCorps.append(corps(f));

  $('#feuilles').append(voile);
  feuillesOuvertes.push(f);
  history.pushState({ feuille: true }, '');
  return f;
}

/** Confirmation explicite. Toute suppression passe par là, sans exception. */
function confirmer({ titre, message, labelOk, danger }) {
  return new Promise((resoudre) => {
    let decide = false;
    const f = ouvrirFeuille({
      titre,
      corps: () => h('div', null,
        h('p', { style: { marginTop: 0, fontFamily: 'var(--police-texte)', fontSize: '1.02rem' } }, message),
        h('button', {
          class: 'bouton ' + (danger ? 'bouton--danger' : ''),
          onclick: () => { decide = true; f.fermer(); resoudre(true); },
        }, labelOk),
        h('button', { class: 'bouton bouton--calme', onclick: () => f.fermer() }, 'Annuler'),
      ),
    });
    // Fermeture par le voile ou par le bouton retour = refus.
    const observer = setInterval(() => {
      if (f.ferme) { clearInterval(observer); if (!decide) resoudre(false); }
    }, 120);
  });
}

}

function feuilleTaux(deviseExistante) {
  const taux = etat.prefs.taux || {};

  const synchro = (source) => {
    if (source === 'vers') {
      const v = nombre(champVersEur.value);

    } else {
      const v = nombre(champDepuisEur.value);

    }

  ouvrirFeuille({
    titre: deviseExistante ? 'Taux ' + deviseExistante : 'Nouveau taux',
    corps: (f) => {
      champDevise = h('input', {
        type: 'text', value: deviseExistante || '', placeholder: 'JPY',
        list: 'l-devises', maxlength: '6', autocapitalize: 'characters', autocomplete: 'off',
        disabled: !!deviseExistante,
      });
      champVersEur = h('input', {
        type: 'text', inputmode: 'decimal',
        value: deviseExistante ? String(taux[deviseExistante]) : '',
        oninput: () => synchro('vers'),
      });
      champDepuisEur = h('input', {
        type: 'text', inputmode: 'decimal',
        value: deviseExistante ? arrondiLisible(1 / taux[deviseExistante]) : '',

      });
      return h('div', null,
        h('div', { class: 'champ' }, h('label', null, 'Devise'), champDevise,
          h('datalist', { id: 'l-devises' }, DEVISES_COURANTES.map((d) => h('option', { value: d })))),
        h('div', { class: 'champ' },
          h('label', null, '1 unité de cette devise vaut, en euros'), champVersEur),
        h('div', { class: 'champ' },
          h('label', null, 'Ou, dans l’autre sens : 1 € vaut'), champDepuisEur,
          h('div', { class: 'aide' }, 'Les deux champs se répondent. Saisissez celui que vous avez sous les yeux.')),
        deviseExistante ? h('button', {
          class: 'bouton bouton--danger',
          onclick: async () => {
            const t = { ...(etat.prefs.taux || {}) };
            delete t[deviseExistante];
            await ecrirePref('taux', t);
            f.fermer();
            rendre();
          },

        h('p', { class: 'note-info' },

      if (!isFinite(v) || v <= 0) { toast('Le taux doit être un nombre supérieur à zéro.'); return false; }
      await ecrirePref('taux', { ...(etat.prefs.taux || {}), [d]: v });
      rendre();
      return true;
    },
  });
}
