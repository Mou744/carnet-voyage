  <!-- Deux entrées fichier distinctes : l'appareil photo (chemin rapide) et la
       photothèque (le soir, au calme). iOS distingue les deux par `capture`. -->
  <input type="file" id="entree-camera" accept="image/*" capture="environment" hidden>
  <input type="file" id="entree-galerie" accept="image/*" multiple hidden>

<script>
"use strict";

/* ==========================================================================
   CARNET DE VOYAGE — phase 1 : saisie et consultation.

   Modèle : deux entités seulement.
     lieu       — un endroit, géolocalisé, noté, photographié
     evenement  — rattaché à un lieu, de type 'visite' | 'depense' | 'achat'

   Une visite, une dépense et un achat sont le MÊME objet avec un type
   différent. Les écrans « mes visites », « mes dépenses », « mes achats » ne
   sont que des filtres sur cette liste unique — il n'y a jamais trois tables.

   Devises : on stocke toujours le montant d'origine ET le taux du jour.
   L'euro est calculé à l'affichage, jamais écrit en base.
   ========================================================================== */

/* ------------------------------------------------------------ constantes -- */

const TYPES_LIEU = ['activité', 'boutique', 'restaurant', 'hébergement', 'transport', 'autre'];
const TYPES_EVENEMENT = ['visite', 'depense', 'achat'];
const LIBELLE_EVENEMENT = { visite: 'Visite', depense: 'Dépense', achat: 'Achat' };
const STATUTS_ACHAT = ['idée', 'acheté', 'offert'];
const CATEGORIES = ['nourriture', 'transport', 'hébergement', 'activité', 'souvenir', 'cadeau', 'santé', 'divers'];
const DEVISES_COURANTES = ['EUR', 'USD', 'GBP', 'CHF', 'JPY', 'THB', 'VND', 'IDR', 'INR', 'KRW',
  'CNY', 'MAD', 'TRY', 'CAD', 'AUD', 'MXN', 'BRL', 'ZAR', 'SEK', 'NOK', 'DKK', 'PLN', 'CZK', 'HUF'];

const RAYON_LIEU_M = 100;      // au-delà, c'est un autre lieu
const JOURS_CORBEILLE = 30;
const PHOTO_MAX_PX = 1600;
const VIGNETTE_MAX_PX = 400;
const PHOTO_QUALITE = 0.8;

/* ------------------------------------------------------------ utilitaires -- */

const $ = (sel, racine = document) => racine.querySelector(sel);

/** Construction de DOM sans innerHTML : rien de ce que je saisis n'est interprété. */
const PROPRIETES = new Set(['value', 'checked', 'disabled', 'textContent', 'selected', 'src', 'hidden']);
function h(balise, attrs, ...enfants) {
  const e = document.createElement(balise);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') Object.assign(e.style, v);
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (PROPRIETES.has(k)) e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const enfant of enfants.flat(4)) {
    if (enfant === null || enfant === undefined || enfant === false) continue;
    e.append(enfant instanceof Node ? enfant : document.createTextNode(String(enfant)));
  }
  return e;
}

function svg(chemin, extra) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('fill', 'none');
  s.setAttribute('stroke', 'currentColor');
  s.setAttribute('stroke-width', extra || '1.7');
  s.setAttribute('stroke-linecap', 'round');
  s.setAttribute('stroke-linejoin', 'round');
  s.setAttribute('aria-hidden', 'true');
  // Taille par défaut : sans elle, un SVG hors d'un contexte dimensionné
  // retomberait sur les 300 × 150 px du navigateur.
  s.setAttribute('width', '20');
  s.setAttribute('height', '20');
  for (const d of [].concat(chemin)) {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    s.append(p);
  }
  return s;
}

const ICONES = {
  recherche: ['M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14Z', 'M16.2 16.2 21 21'],
  points: ['M12 6h.01', 'M12 12h.01', 'M12 18h.01'],
  appareil: ['M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2l1.2-2h8.2l1.2 2h2.2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-9Z', 'M12 15.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z'],
  plume: ['M4 20s5.5-.5 9-4 5-9 5-9-5.5 1.5-9 5-5 8-5 8Z', 'M4 20l5-5'],
  fleche: ['M15 6l-6 6 6 6'],
  croix: ['M6 6l12 12', 'M18 6 6 18'],
  chevron: ['M9 6l6 6-6 6'],
};

const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10));

const delai = (ms) => new Promise((r) => setTimeout(r, ms));

/* -------------------------------------------------------------- dates ---- */

function isoLocal(d = new Date()) {
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function heureLocale(d = new Date()) {
  const p = (n) => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}
function dateDepuisIso(iso) {
  const [a, m, j] = String(iso).split('-').map(Number);
  return new Date(a, (m || 1) - 1, j || 1);
}
const FMT_JOUR = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const FMT_JOUR_ANNEE = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const FMT_COURT = new Intl.DateTimeFormat('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });

function formatJour(iso) {
  const d = dateDepuisIso(iso);
  const fmt = d.getFullYear() === new Date().getFullYear() ? FMT_JOUR : FMT_JOUR_ANNEE;
  return fmt.format(d);
}
const formatDateCourte = (iso) => FMT_COURT.format(dateDepuisIso(iso));

/* ------------------------------------------------------------- monnaie ---- */

function nombre(v) {
  if (typeof v === 'number') return v;
  if (!v) return NaN;
  // On accepte la virgule décimale française et les espaces de milliers.
  return parseFloat(String(v).replace(/\s| | /g, '').replace(',', '.'));
}

function formatMontant(valeur, devise) {
  if (!Number.isFinite(valeur)) return '';
  try {
    return new Intl.NumberFormat('fr-FR', {
      style: 'currency', currency: devise || 'EUR',
      maximumFractionDigits: (devise === 'JPY' || devise === 'KRW' || devise === 'VND' || devise === 'IDR') ? 0 : 2,
    }).format(valeur);
  } catch (_) {
    // Code de devise inconnu d'Intl : on affiche quand même quelque chose de juste.
    return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 }).format(valeur) + ' ' + (devise || '');
  }
}
const formatEuros = (v) => formatMontant(v, 'EUR');

/** Conversion à l'affichage uniquement. Le montant en base n'est jamais réécrit. */
function enEuros(ev) {
  if (!ev || !Number.isFinite(ev.montant)) return 0;
  if (ev.devise === 'EUR') return ev.montant;
  const taux = Number(ev.taux_vers_eur);
  return Number.isFinite(taux) && taux > 0 ? ev.montant * taux : 0;
}
const aUnMontant = (ev) => Number.isFinite(ev.montant) && ev.montant !== null && ev.montant !== 0;

/**
 * Une idée d'achat porte un montant estimé, mais cet argent n'est pas sorti.
 * Elle est donc exclue de TOUS les totaux et vit dans « reste à acheter ».
 */
const estIdee = (ev) => ev.type === 'achat' && ev.statut_achat === 'idée';
const estDepense = (ev) => aUnMontant(ev) && !estIdee(ev);

/* Nombre de jours couverts par un intervalle, bornes incluses. */
function nbJours(du, au) {
  return Math.round((dateDepuisIso(au) - dateDepuisIso(du)) / 86400000) + 1;
}
function decalerJours(iso, n) {
  const d = dateDepuisIso(iso);
  d.setDate(d.getDate() + n);
  return isoLocal(d);
}

/* ----------------------------------------------------------- géographie ---- */

/** Distance en mètres entre deux points (formule de haversine). */
function distance(lat1, lon1, lat2, lon2) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2
    + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

/* ==========================================================================
   BASE DE DONNÉES (IndexedDB)

   Règle absolue du projet : aucune perte de données. Toute écriture passe par
   `ecrire()`, dont la promesse ne se résout qu'à l'événement `complete` de la
   transaction. L'interface n'affiche jamais quelque chose comme enregistré
   avant ce moment-là.
   ========================================================================== */

const DB = { nom: 'carnet-voyage', version: 1, db: null };

function ouvrirBase() {
  return new Promise((ok, ko) => {
    if (!self.indexedDB) return ko(new Error('indexeddb-absent'));
    let req;
    try { req = indexedDB.open(DB.nom, DB.version); }
    catch (e) { return ko(e); }

    req.onupgradeneeded = () => {
      const db = req.result;

      if (!db.objectStoreNames.contains('lieux')) {
        const s = db.createObjectStore('lieux', { keyPath: 'id' });
        s.createIndex('ville', 'ville');
        s.createIndex('pays', 'pays');
        s.createIndex('type', 'type');
      }
      if (!db.objectStoreNames.contains('evenements')) {
        const s = db.createObjectStore('evenements', { keyPath: 'id' });
        s.createIndex('lieu_id', 'lieu_id');
        s.createIndex('date', 'date');
        s.createIndex('type', 'type');
        s.createIndex('beneficiaire', 'beneficiaire');
      }
      // Les photos vivent dans leur propre magasin : une ligne de journal se
      // lit sans jamais charger un seul octet d'image.
      if (!db.objectStoreNames.contains('photos')) {
        const s = db.createObjectStore('photos', { keyPath: 'id' });
        s.createIndex('parent', 'parent_id');
      }
      if (!db.objectStoreNames.contains('prefs')) {
        db.createObjectStore('prefs', { keyPath: 'cle' });
      }
    };

    req.onsuccess = () => {
      DB.db = req.result;
      // iOS peut fermer la connexion après une longue mise en veille : on la
      // rouvre à la demande plutôt que de laisser l'app dans un état mort.
      DB.db.onclose = () => { DB.db = null; };
      DB.db.onversionchange = () => { DB.db.close(); DB.db = null; };
      ok(DB.db);
    };
    req.onerror = () => ko(req.error || new Error('ouverture-refusee'));
    req.onblocked = () => ko(new Error('base-bloquee'));
  });
}

async function base() {
  if (!DB.db) await ouvrirBase();
  return DB.db;
}

const attendreReq = (req) => new Promise((ok, ko) => {
  req.onsuccess = () => ok(req.result);
  req.onerror = () => ko(req.error);
});

async function lire(magasin, cle) {
  const db = await base();
  return attendreReq(db.transaction(magasin, 'readonly').objectStore(magasin).get(cle));
}

async function lireTout(magasin) {
  const db = await base();
  return attendreReq(db.transaction(magasin, 'readonly').objectStore(magasin).getAll());
}

/**
 * Écriture confirmée. `fn` reçoit un objet { magasin: objectStore } et empile
 * ses opérations ; la promesse ne se résout qu'une fois la transaction
 * réellement validée par le navigateur.
 */
async function ecrire(magasins, fn) {
  const db = await base();
  const liste = [].concat(magasins);
  const tx = db.transaction(liste, 'readwrite');
  const stores = {};
  for (const m of liste) stores[m] = tx.objectStore(m);
  let resultat;
  try { resultat = fn(stores); } catch (e) { try { tx.abort(); } catch (_) {} throw e; }
  await new Promise((ok, ko) => {
    tx.oncomplete = () => ok();
    tx.onerror = () => ko(tx.error);
    tx.onabort = () => ko(tx.error || new Error('transaction-annulee'));
  });
  return resultat;
}

/** Traduit les échecs d'écriture en phrases utiles, jamais en excuses. */
function messageErreurEcriture(err) {
  const nom = err && err.name;
  if (nom === 'QuotaExceededError') {
    return "Le stockage du téléphone est plein. Videz la corbeille ou supprimez quelques photos, puis réessayez.";
  }
  if (nom === 'InvalidStateError' || nom === 'TransactionInactiveError') {
    return "La base s'est fermée pendant la mise en veille. Réessayez, elle se rouvre toute seule.";
  }
  return "L'enregistrement n'a pas abouti. Rien n'a été modifié — réessayez.";
}

/* ------------------------------------------------------------- préférences -- */

async function lirePrefs() {
  const tout = await lireTout('prefs');
  const p = {};
  for (const e of tout) p[e.cle] = e.valeur;
  return p;
}
async function ecrirePref(cle, valeur) {
  await ecrire('prefs', (s) => s.prefs.put({ cle, valeur }));
  etat.prefs[cle] = valeur;
}

/* ==========================================================================
   PHOTOS

   Redimensionnées côté client avant stockage : ~1600 px max en WebP qualité
   0.8, plus une vignette ~400 px conservée séparément pour les listes.
   Les deux sont des Blobs dans IndexedDB — jamais de base64, jamais de fichier
   externe.
   ========================================================================== */

let formatPhoto = null;   // 'image/webp' ou repli 'image/jpeg' (vieux Safari)

async function detecterFormat() {
  if (formatPhoto) return formatPhoto;
  const c = document.createElement('canvas');
  c.width = c.height = 1;
  const b = await new Promise((r) => c.toBlob(r, 'image/webp', 0.8));
  formatPhoto = (b && b.type === 'image/webp') ? 'image/webp' : 'image/jpeg';
  return formatPhoto;
}

/** Décodage tolérant : createImageBitmap gère l'orientation EXIF ; sinon, <img>. */
async function decoder(fichier) {
  if (self.createImageBitmap) {
    try { return await createImageBitmap(fichier, { imageOrientation: 'from-image' }); }
    catch (_) { /* certains Safari refusent les options : on retente sans */ }
    try { return await createImageBitmap(fichier); } catch (_) {}
  }
  const url = URL.createObjectURL(fichier);
  try {
    const img = new Image();
    img.decoding = 'sync';
    await new Promise((ok, ko) => {
      img.onload = ok;
      img.onerror = () => ko(new Error('image-illisible'));
      img.src = url;
    });
    return img;
  } finally {
    // L'URL reste valide jusqu'au dessin sur le canvas : on libère après coup.
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }
}

function dessiner(source, maxCote) {
  const l = source.width || source.naturalWidth;
  const hh = source.height || source.naturalHeight;
  const ratio = Math.min(1, maxCote / Math.max(l, hh));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(l * ratio));
  c.height = Math.max(1, Math.round(hh * ratio));
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(source, 0, 0, c.width, c.height);
  return c;
}

const versBlob = (canvas, type, q) => new Promise((r) => canvas.toBlob(r, type, q));

/**
 * Prépare une photo pour le stockage. Renvoie l'enregistrement complet, prêt
 * à être écrit, plus les dimensions à mémoriser côté entité (pour réserver la
 * place à l'écran avant même que l'image ne soit chargée).
 */
async function preparerPhoto(fichier) {
  if (!fichier || !fichier.type || !fichier.type.startsWith('image/')) {
    throw new Error('pas-une-image');
  }
  const type = await detecterFormat();
  const source = await decoder(fichier);

  const grand = dessiner(source, PHOTO_MAX_PX);
  const petit = dessiner(source, VIGNETTE_MAX_PX);
  const blob = await versBlob(grand, type, PHOTO_QUALITE);
  const vignette = await versBlob(petit, type, PHOTO_QUALITE);
  if (source.close) source.close();
  if (!blob || !vignette) throw new Error('encodage-impossible');

  const id = uid();
  return {
    enregistrement: {
      id, blob, vignette, type_mime: type,
      largeur: grand.width, hauteur: grand.height,
      poids: blob.size, cree_le: new Date().toISOString(),
      parent_id: null,
    },
    reference: { id, l: grand.width, h: grand.height },
  };
}

/* ---- URLs d'affichage : cache borné, révoquées en FIFO pour la mémoire ---- */

const urlsVignettes = new Map();
const ordreVignettes = [];

async function urlVignette(id) {
  if (urlsVignettes.has(id)) return urlsVignettes.get(id);
  const p = await lire('photos', id).catch(() => null);
  if (!p) return null;
  const url = URL.createObjectURL(p.vignette || p.blob);
  urlsVignettes.set(id, url);
  ordreVignettes.push(id);
  while (ordreVignettes.length > 120) {
    const vieux = ordreVignettes.shift();
    URL.revokeObjectURL(urlsVignettes.get(vieux));
    urlsVignettes.delete(vieux);
  }
  return url;
}

/** Élément <img> qui réserve sa place immédiatement puis se remplit. */
function imgVignette(ref, classe) {
  const id = typeof ref === 'string' ? ref : ref.id;
  const img = h('img', { class: classe || 'photo', alt: '', loading: 'lazy', decoding: 'async' });
  if (ref && ref.l && ref.h) img.style.aspectRatio = ref.l + ' / ' + ref.h;
  else img.classList.add('photo--vide');
  urlVignette(id).then((u) => { if (u) img.src = u; else img.remove(); });
  return img;
}

async function ouvrirVisionneuse(id) {
  const p = await lire('photos', id).catch(() => null);
  if (!p) return toast("Cette photo est introuvable.");
  const url = URL.createObjectURL(p.blob || p.vignette);
  const fermer = () => { vue.remove(); URL.revokeObjectURL(url); };
  const vue = h('div', { id: 'visionneuse', role: 'dialog', 'aria-label': 'Photo' },
    h('img', { src: url, alt: '' }),
    h('button', { class: 'ico', 'aria-label': 'Fermer', onclick: fermer }, svg(ICONES.croix, '2')),
  );
  vue.addEventListener('click', (e) => { if (e.target === vue) fermer(); });
  document.body.append(vue);
}

/* ==========================================================================
   ÉTAT

   Tout tient en mémoire : un carnet personnel, ce sont des milliers de lignes
   au plus. Les photos, elles, restent dans la base et se chargent à la demande.
   ========================================================================== */

const etat = {
  vue: { nom: 'journal' },
  lieux: new Map(),
  evenements: [],
  prefs: {},
  filtres: videsFiltres(),
};

function videsFiltres() {
  return { texte: '', typeEv: '', typeLieu: '', ville: '', pays: '', tag: '', du: '', au: '', beneficiaire: '' };
}
const filtresActifs = () => Object.values(etat.filtres).some((v) => v !== '');

async function chargerEtat() {
  const [lieux, evenements, prefs] = await Promise.all([lireTout('lieux'), lireTout('evenements'), lirePrefs()]);
  // Les éléments en corbeille restent en mémoire : la fiche d'un lieu supprimé
  // doit rester lisible depuis la corbeille.
  etat.lieux = new Map(lieux.map((l) => [l.id, l]));
  etat.evenements = evenements.sort(triChronoDesc);
  etat.prefs = prefs;
}

function triChronoDesc(a, b) {
  if (a.date !== b.date) return a.date < b.date ? 1 : -1;
  const ha = a.heure || '', hb = b.heure || '';
  if (ha !== hb) return ha < hb ? 1 : -1;
  return (b.cree_le || '') < (a.cree_le || '') ? -1 : 1;
}

const evenementsVivants = () => etat.evenements.filter((e) => !e.supprime_le);
const lieuxVivants = () => [...etat.lieux.values()].filter((l) => !l.supprime_le);
const lieuDe = (ev) => etat.lieux.get(ev.lieu_id) || null;
const nomLieu = (l) => (l && l.nom && l.nom.trim()) || '';

function tousLesTags() {
  const s = new Set();
  for (const l of lieuxVivants()) for (const t of l.tags || []) s.add(t);
  return [...s].sort((a, b) => a.localeCompare(b, 'fr'));
}
function tousLesBeneficiaires() {
  const s = new Set();
  for (const e of evenementsVivants()) if (e.beneficiaire) s.add(e.beneficiaire);
  return [...s].sort((a, b) => a.localeCompare(b, 'fr'));
}
function toutesLesVilles() {
  const s = new Set();
  for (const l of lieuxVivants()) if (l.ville) s.add(l.ville);
  return [...s].sort((a, b) => a.localeCompare(b, 'fr'));
}
function tousLesPays() {
  const s = new Set();
  for (const l of lieuxVivants()) if (l.pays) s.add(l.pays);
  return [...s].sort((a, b) => a.localeCompare(b, 'fr'));
}

/* ------------------------------------------------------------- filtres ---- */

function evenementsFiltres() {
  const f = etat.filtres;
  const texte = f.texte.trim().toLowerCase();
  return evenementsVivants().filter((ev) => {
    const lieu = lieuDe(ev);
    if (f.typeEv && ev.type !== f.typeEv) return false;
    if (f.typeLieu && (!lieu || lieu.type !== f.typeLieu)) return false;
    if (f.ville && (!lieu || lieu.ville !== f.ville)) return false;
    if (f.pays && (!lieu || lieu.pays !== f.pays)) return false;
    if (f.tag && (!lieu || !(lieu.tags || []).includes(f.tag))) return false;
    if (f.beneficiaire && ev.beneficiaire !== f.beneficiaire) return false;
    if (f.du && ev.date < f.du) return false;
    if (f.au && ev.date > f.au) return false;
    if (texte) {
      const foin = [
        nomLieu(lieu), lieu && lieu.ville, lieu && lieu.pays, lieu && lieu.adresse,
        lieu && lieu.commentaire, (lieu && lieu.tags || []).join(' '),
        ev.commentaire, ev.beneficiaire, ev.categorie, ev.devise,
      ].filter(Boolean).join(' ').toLowerCase();
      if (!foin.includes(texte)) return false;
    }
    return true;
  });
}

/* ==========================================================================
   RENDU
   ========================================================================== */

let dernierRendu = 0;
let idNouvelleLigne = null;   // ligne à faire se tracer au prochain rendu

function rendre() {
  const conteneur = $('#vue');
  conteneur.textContent = '';
  $('#entete').hidden = false;
  $('#barre').hidden = !['journal', 'lieu', 'argent', 'carte'].includes(etat.vue.nom);

  rendreEntete();
  rendreBarre();

  const parVue = {
    journal: vueJournal,
    lieu: vueLieu,
    argent: vueArgent,
    partage: vuePartage,
    carte: vueCarte,
    corbeille: vueCorbeille,
    reglages: vueReglages,
  };
  conteneur.append((parVue[etat.vue.nom] || vueJournal)());

  // Les en-têtes de jour se collent juste sous la barre de titre.
  requestAnimationFrame(() => {
    document.documentElement.style.setProperty('--h-entete', $('#entete').offsetHeight + 'px');
  });
  dernierRendu = Date.now();
  idNouvelleLigne = null;
}

/* ------------------------------------------------------------- en-tête ---- */

/*
  Les quatre écrans que l'on consulte sont en ligne, sous le titre : un seul
  appui pour passer de l'un à l'autre. Ce que l'on gère plutôt qu'on ne
  consulte — corbeille, réglages, index des lieux — reste derrière le « ⋯ ».
*/
const ONGLETS = [
  ['journal', 'Journal'],
  ['argent', 'Argent'],
  ['carte', 'Carte'],
  ['partage', 'Partage'],
];
const estVuePrincipale = (nom) => ONGLETS.some(([n]) => n === nom);

function rendreEntete() {
  const e = $('#entete');
  e.textContent = '';

  if (!estVuePrincipale(etat.vue.nom)) {
    const titres = { lieu: 'Lieu', corbeille: 'Corbeille', reglages: 'Réglages' };
    e.append(h('div', { class: 'entete__ligne' },
      h('button', { class: 'retour', onclick: () => history.back() },
        svg(ICONES.fleche), 'Carnet'),
      h('h1', { style: { marginLeft: 'auto', fontSize: '0.9rem', color: 'var(--graphite)' } },
        titres[etat.vue.nom] || '')));
    return;
  }

  const ville = etat.prefs.ville_courante;
  e.append(
    h('div', { class: 'entete__ligne' },
      h('h1', null, 'Carnet'),
      h('button', {
        class: 'entete__ville', onclick: feuilleVille,
        'aria-label': 'Changer la ville courante',
      },
        ville && ville.ville
          ? [h('b', null, ville.ville), ville.pays ? ', ' + ville.pays : '']
          : 'Où êtes-vous ?'),
      h('div', { class: 'entete__actions' },
        // La recherche filtre le journal : elle n'a de sens que là.
        etat.vue.nom === 'journal' ? h('button', {
          class: 'ico', 'aria-label': 'Rechercher et filtrer',
          'aria-pressed': filtresActifs() ? 'true' : 'false',
          onclick: feuilleFiltres,
        }, svg(ICONES.recherche)) : null,
        h('button', { class: 'ico', 'aria-label': 'Menu', onclick: feuilleMenu },
          svg(ICONES.points, '2.4')),
      ),
    ),
    h('nav', { class: 'onglets', 'aria-label': 'Sections du carnet' },
      ONGLETS.map(([nom, libelle]) => h('button', {
        type: 'button',
        'aria-current': etat.vue.nom === nom ? 'page' : null,
        onclick: () => { if (etat.vue.nom !== nom) naviguer({ nom }); },
      }, libelle))),
  );
}

/* -------------------------------------------------- barre de saisie ------- */

function rendreBarre() {
  const b = $('#barre');
  b.textContent = '';
  b.append(
    // Chemin rapide : un appui, l'appareil photo s'ouvre, tout le reste est
    // déduit. C'est le critère de réussite numéro un du projet.
    h('button', { class: 'barre__photo', onclick: saisirParPhoto },
      svg(ICONES.appareil, '1.9'), 'Photo'),
    h('button', {
      class: 'barre__second', 'aria-label': 'Noter un montant',
      onclick: () => saisirMontant(),
    }, '€'),
    h('button', {
      class: 'barre__second', 'aria-label': 'Écrire une note',
      onclick: () => saisirNote(),
    }, svg(ICONES.plume, '1.9')),
  );
}

/* ------------------------------------------------------------- journal ---- */

function vueJournal() {
  const frag = document.createDocumentFragment();
  const evs = evenementsFiltres();

  if (filtresActifs()) frag.append(rendrePucesFiltres(evs.length));

  if (!evs.length) {
    frag.append(filtresActifs() ? videFiltres() : videJournal());
    return frag;
  }

  // Regroupement par jour, du plus récent au plus ancien.
  const jours = new Map();
  for (const ev of evs) {
    if (!jours.has(ev.date)) jours.set(ev.date, []);
    jours.get(ev.date).push(ev);
  }

  const ajd = isoLocal();
  for (const [date, liste] of jours) {
    frag.append(
      h('div', { class: 'jour__entete' },
        h('div', { class: 'jour__date' + (date === ajd ? ' est-aujourdhui' : '') },
          date === ajd ? "aujourd'hui" : formatJour(date)),
        totauxDuJour(liste, date),
      ),
      h('div', null, liste.map(ligneEvenement)),
    );
  }
  return frag;
}

/**
 * Total du jour. Si toutes les dépenses du jour sont dans une même devise
 * étrangère, on affiche ce total d'origine en premier et l'euro en dessous :
 * c'est dans cette devise-là que la journée a été vécue.
 */
function totauxDuJour(liste, date) {
  // Les idées d'achat portent un montant estimé, jamais dépensé : hors total.
  const depenses = liste.filter(estDepense);
  if (!depenses.length) return h('div', { class: 'jour__totaux' });

  const euros = depenses.reduce((s, e) => s + enEuros(e), 0);
  const devises = new Set(depenses.map((e) => e.devise || 'EUR'));

  let contenu;
  if (devises.size === 1) {
    const dev = [...devises][0];
    const brut = depenses.reduce((s, e) => s + e.montant, 0);
    contenu = dev === 'EUR'
      ? [formatEuros(brut)]
      : [formatMontant(brut, dev), h('div', { class: 'secondaire' }, formatEuros(euros))];
  } else {
    contenu = [formatEuros(euros), h('div', { class: 'secondaire' }, devises.size + ' devises')];
  }

  // Le total du jour est une porte vers l'écran Argent, sur ce jour-là.
  if (!date) return h('div', { class: 'jour__totaux' }, contenu);
  return h('button', {
    class: 'jour__totaux jour__totaux--lien',
    'aria-label': 'Voir le détail de cette journée',
    onclick: () => naviguer({ nom: 'argent', mode: 'jour', ancre: date }),
  }, contenu);
}

function ligneEvenement(ev) {
  const lieu = lieuDe(ev);
  const argent = aUnMontant(ev);
  const idee = estIdee(ev);
  const photos = ev.photos || [];

  const marge = h('div', { class: 'ligne__marge' },
    h('span', { class: 'ligne__heure' }, ev.heure || ''),
    argent
      ? [
        // Une idée s'affiche en gris : c'est un prix, pas une dépense.
        h('span', { class: 'ligne__montant' + (idee ? ' ligne__prevu' : '') },
          formatMontant(ev.montant, ev.devise)),
        ev.devise !== 'EUR' && enEuros(ev)
          ? h('span', { class: 'ligne__euros' }, formatEuros(enEuros(ev)))
          : null,
      ]
      : h('span', { class: 'ligne__montant ligne__vide' }, '—'),
  );

  const meta = [];
  if (lieu && lieu.type) meta.push(lieu.type);
  if (lieu && lieu.ville) meta.push((meta.length ? 'à ' : '') + lieu.ville);
  if (!lieu) meta.push('lieu supprimé');

  const corps = h('div', { class: 'ligne__corps' },
    photos.map((p) => h('button', {
      style: { display: 'block', width: '100%', padding: 0, border: 0, background: 'none', cursor: 'pointer' },
      'aria-label': 'Agrandir la photo',
      onclick: () => ouvrirVisionneuse(typeof p === 'string' ? p : p.id),
    }, imgVignette(p))),
    h('button', { class: 'ligne__ouvrir', onclick: () => feuilleEvenement(ev) },
      h('div', { class: 'ligne__nom' + (nomLieu(lieu) ? '' : ' sans-nom') },
        nomLieu(lieu) || 'Lieu sans nom'),
      meta.length ? h('div', { class: 'ligne__meta' }, meta.join(' ')) : null,
      ev.commentaire ? h('div', { class: 'ligne__mot' }, ev.commentaire) : null,
      etiquettes(ev),
    ),
  );

  const cls = 'ligne' + (estDepense(ev) ? ' ligne--argent' : '')
    + (ev.id === idNouvelleLigne ? ' ligne--nouvelle' : '');
  return h('div', { class: cls, dataset: { id: ev.id } }, marge, corps);
}

function etiquettes(ev) {
  const items = [];
  if (ev.type === 'achat') {
    items.push(h('span', { class: 'etiquette etiquette--achat' },
      ev.statut_achat === 'idée' ? 'à acheter'
        : ev.statut_achat === 'offert' ? 'offert' : 'acheté'));
  }
  if (ev.beneficiaire) items.push(h('span', { class: 'etiquette' }, 'pour ' + ev.beneficiaire));
  if (ev.categorie && ev.type !== 'visite') items.push(h('span', { class: 'etiquette' }, ev.categorie));
  return items.length ? h('div', { class: 'etiquettes' }, items) : null;
}

function rendrePucesFiltres(n) {
  const f = etat.filtres;
  const etiq = {
    texte: (v) => '« ' + v + ' »',
    typeEv: (v) => LIBELLE_EVENEMENT[v],
    typeLieu: (v) => v,
    ville: (v) => v,
    pays: (v) => v,
    tag: (v) => '#' + v,
    beneficiaire: (v) => 'pour ' + v,
    du: (v) => 'depuis le ' + formatDateCourte(v),
    au: (v) => "jusqu'au " + formatDateCourte(v),
  };
  const puces = Object.entries(f).filter(([, v]) => v !== '').map(([k, v]) =>
    h('button', {
      class: 'puce', onclick: () => { etat.filtres[k] = ''; rendre(); },
      'aria-label': 'Retirer ce filtre',
    }, etiq[k](v), ' ✕'));

  return h('div', { class: 'filtres-actifs' },
    puces,
    h('button', {
      class: 'puce', style: { background: 'transparent', color: 'var(--graphite)' },
      onclick: () => { etat.filtres = videsFiltres(); rendre(); },
    }, n + (n > 1 ? ' entrées' : ' entrée') + ' · tout effacer'),
  );
}

function videJournal() {
  return h('div', { class: 'vide' },
    h('div', { class: 'vide__trait' }),
    h('h2', null, 'La première page est blanche.'),
    h('p', null, "Prenez une photo : le lieu, l'heure et la position sont déduits tout seuls. Le reste s'écrit le soir."),
    h('button', { class: 'bouton', onclick: saisirParPhoto }, 'Ouvrir l’appareil photo'),
  );
}

function videFiltres() {
  return h('div', { class: 'vide' },
    h('div', { class: 'vide__trait', style: { background: 'var(--reglure)' } }),
    h('h2', null, 'Rien sous ces filtres.'),
    h('p', null, 'Le carnet contient autre chose — élargissez la recherche.'),
    h('button', {
      class: 'bouton bouton--calme',
      onclick: () => { etat.filtres = videsFiltres(); rendre(); },
    }, 'Effacer les filtres'),
  );
}

/* ---------------------------------------------------------- fiche lieu ---- */

function vueLieu() {
  const lieu = etat.lieux.get(etat.vue.lieu_id);
  if (!lieu) return h('div', { class: 'vide' }, h('h2', null, 'Ce lieu n’existe plus.'));
  if (lieu.supprime_le) {
    return h('div', { class: 'vide' },
      h('div', { class: 'vide__trait', style: { background: 'var(--reglure)' } }),
      h('h2', null, 'Ce lieu est à la corbeille.'),
      h('p', null, 'Il y reste ' + JOURS_CORBEILLE + ' jours à partir de sa suppression.'),
      h('button', { class: 'bouton bouton--calme', onclick: () => naviguer({ nom: 'corbeille' }) },
        'Ouvrir la corbeille'));
  }

  const evs = etat.evenements.filter((e) => e.lieu_id === lieu.id && !e.supprime_le);
  const depenses = evs.filter(aUnMontant);
  const totalEuros = depenses.reduce((s, e) => s + enEuros(e), 0);

  const meta = [lieu.type, lieu.ville, lieu.pays].filter(Boolean).join(', ');

  const frag = document.createDocumentFragment();
  frag.append(
    h('div', { class: 'fiche' },
      h('h2', { class: 'fiche__nom' + (nomLieu(lieu) ? '' : ' sans-nom') },
        nomLieu(lieu) || 'Lieu sans nom'),
      meta ? h('div', { class: 'fiche__meta' }, meta) : null,
      lieu.adresse ? h('div', { class: 'fiche__meta' }, lieu.adresse) : null,
      lieu.note ? h('div', { class: 'etoiles', 'aria-label': lieu.note + ' sur 5' },
        '★'.repeat(lieu.note), h('span', { class: 'off' }, '★'.repeat(5 - lieu.note))) : null,
      lieu.tags && lieu.tags.length
        ? h('div', { class: 'etiquettes' }, lieu.tags.map((t) =>
          h('button', {
            class: 'etiquette', style: { cursor: 'pointer' },
            onclick: () => { etat.filtres = videsFiltres(); etat.filtres.tag = t; naviguer({ nom: 'journal' }); },
          }, '#' + t)))
        : null,
      lieu.commentaire ? h('p', { class: 'fiche__mot' }, lieu.commentaire) : null,

      h('div', { class: 'fiche__total' },
        evs.length + (evs.length > 1 ? ' entrées' : ' entrée'),
        totalEuros ? [' · ', h('b', null, formatEuros(totalEuros)), ' dépensés ici'] : null),

      h('div', { class: 'galerie' },
        (lieu.photos || []).map((p) => h('button', {
          'aria-label': 'Agrandir la photo',
          onclick: () => ouvrirVisionneuse(typeof p === 'string' ? p : p.id),
        }, imgVignette(p, ''))),
        h('button', {
          class: 'ajouter', onclick: () => ajouterPhotosA('lieu', lieu.id),
        }, '+ photo'),
      ),

      h('div', { style: { marginTop: '1.2rem' } },
        h('button', { class: 'bouton bouton--calme', onclick: () => feuilleLieu(lieu) }, 'Modifier ce lieu')),
    ),
  );

  if (evs.length) {
    frag.append(h('div', { class: 'sous-titre' }, 'Sur place'));
    // Même liste, même composant que le journal : ce sont les mêmes objets.
    const jours = new Map();
    for (const ev of evs) {
      if (!jours.has(ev.date)) jours.set(ev.date, []);
      jours.get(ev.date).push(ev);
    }
    for (const [date, liste] of jours) {
      frag.append(
        h('div', { class: 'jour__entete' },
          h('div', { class: 'jour__date' }, formatJour(date)),
          totauxDuJour(liste, date)),
        h('div', null, liste.map(ligneEvenement)),
      );
    }
  }
  return frag;
}

/* ==========================================================================
   ARGENT (phase 2)

   Règle intangible, posée par le carnet et rappelée ici : chaque montant est
   converti avec LE TAUX DU JOUR OÙ IL A ÉTÉ NOTÉ, figé dans l'événement. On
   ne recalcule jamais un total passé au taux d'aujourd'hui. « J'ai dépensé
   25,80 € ce jour-là » doit rester vrai pour toujours.

   Deuxième règle : une idée d'achat n'est pas une dépense. Elle est exclue de
   tous les totaux et vit dans sa propre liste.
   ========================================================================== */

const FMT_JOUR_MOIS = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'long' });
const FMT_MOIS_ANNEE = new Intl.DateTimeFormat('fr-FR', { month: 'long', year: 'numeric' });
const FMT_JOUR_COURT = new Intl.DateTimeFormat('fr-FR', { weekday: 'narrow' });

function lundiDe(iso) {
  const d = dateDepuisIso(iso);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   // lundi = premier jour, usage français
  return isoLocal(d);
}

/** Bornes de la période affichée, selon le mode et la date d'ancrage. */
function bornesPeriode(mode, ancre) {
  if (mode === 'jour') return { du: ancre, au: ancre };
  if (mode === 'semaine') {
    const du = lundiDe(ancre);
    return { du, au: decalerJours(du, 6) };
  }
  if (mode === 'mois') {
    const d = dateDepuisIso(ancre);
    const du = isoLocal(new Date(d.getFullYear(), d.getMonth(), 1));
    const au = isoLocal(new Date(d.getFullYear(), d.getMonth() + 1, 0));
    return { du, au };
  }
  // « tout » : du premier jour noté jusqu'à aujourd'hui.
  const dates = evenementsVivants().map((e) => e.date).sort();
  return { du: dates[0] || isoLocal(), au: isoLocal() };
}

function decalerPeriode(mode, ancre, sens) {
  if (mode === 'jour') return decalerJours(ancre, sens);
  if (mode === 'semaine') return decalerJours(lundiDe(ancre), sens * 7);
  if (mode === 'mois') {
    const d = dateDepuisIso(ancre);
    return isoLocal(new Date(d.getFullYear(), d.getMonth() + sens, 1));
  }
  return ancre;
}

function libellePeriode(mode, du, au) {
  if (mode === 'tout') return 'tout le carnet';
  if (mode === 'mois') return FMT_MOIS_ANNEE.format(dateDepuisIso(du));
  if (du === au) return du === isoLocal() ? "aujourd'hui" : formatJour(du);
  const a = dateDepuisIso(du), b = dateDepuisIso(au);
  return a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear()
    ? a.getDate() + ' – ' + FMT_JOUR_MOIS.format(b)
    : FMT_JOUR_MOIS.format(a) + ' – ' + FMT_JOUR_MOIS.format(b);
}

/** Somme par clé, triée du plus gros au plus petit. */
function repartir(evs, cle) {
  const par = new Map();
  for (const ev of evs) {
    const k = cle(ev) || '';
    const c = par.get(k) || { euros: 0, n: 0 };
    c.euros += enEuros(ev);
    c.n += 1;
    par.set(k, c);
  }
  return [...par.entries()]
    .map(([k, v]) => ({ cle: k, ...v }))
    .sort((a, b) => b.euros - a.euros);
}

/**
 * Regroupement du rythme en 5 à 12 colonnes selon l'étendue : c'est ce qui
 * garde des barres tapables au doigt, quelle que soit la période choisie.
 */
function bucketsRythme(du, au, evs) {
  const span = nbJours(du, au);
  if (span < 2) return null;                       // un seul jour : pas de graphique

  let pas, mode;
  if (span <= 12) { pas = 'jour'; mode = 'jour'; }
  else if (span <= 84) { pas = 'semaine'; mode = 'semaine'; }
  else { pas = 'mois'; mode = 'mois'; }

  const seaux = [];
  let curseur = pas === 'jour' ? du : pas === 'semaine' ? lundiDe(du)
    : isoLocal(new Date(dateDepuisIso(du).getFullYear(), dateDepuisIso(du).getMonth(), 1));

  while (curseur <= au && seaux.length < 40) {
    const bornes = bornesPeriode(pas, curseur);
    seaux.push({
      ancre: curseur, mode,
      du: bornes.du, au: bornes.au,
      euros: 0,
      etiquette: pas === 'jour' ? FMT_JOUR_COURT.format(dateDepuisIso(curseur))
        : pas === 'semaine' ? String(dateDepuisIso(bornes.du).getDate())
          : FMT_MOIS_ANNEE.format(dateDepuisIso(curseur)).slice(0, 3),
    });
    curseur = decalerPeriode(pas, curseur, 1);
  }
  for (const ev of evs) {
    const s = seaux.find((x) => ev.date >= x.du && ev.date <= x.au);
    if (s) s.euros += enEuros(ev);
  }
  return seaux.length >= 2 ? seaux : null;
}

/** `append` ignore les sections vides — sans quoi le DOM afficherait « null ». */
function ajouter(frag, ...sections) {
  for (const s of sections) if (s) frag.append(s);
}

function vueArgent() {
  const mode = etat.vue.mode || 'semaine';
  const ancre = etat.vue.ancre || isoLocal();
  const { du, au } = bornesPeriode(mode, ancre);

  const evs = evenementsVivants().filter((e) => e.date >= du && e.date <= au && estDepense(e));
  const total = evs.reduce((s, e) => s + enEuros(e), 0);

  // Moyenne sur les jours écoulés seulement : une période à venir ne dilue pas.
  const auEcoule = au > isoLocal() ? isoLocal() : au;
  const joursEcoules = Math.max(1, nbJours(du, auEcoule < du ? du : auEcoule));
  const moyenne = total / joursEcoules;

  const frag = document.createDocumentFragment();

  /* --- sélecteur de période --------------------------------------------- */
  frag.append(h('div', { class: 'periode' },
    h('div', { class: 'segments', role: 'group', 'aria-label': 'Période' },
      [['jour', 'Jour'], ['semaine', 'Semaine'], ['mois', 'Mois'], ['tout', 'Tout']].map(([m, label]) =>
        h('button', {
          type: 'button', 'aria-pressed': mode === m ? 'true' : 'false',
          onclick: () => majVue({ nom: 'argent', mode: m, ancre }),
        }, label))),
    h('div', { class: 'periode__nav' },
      h('button', {
        class: 'ico', 'aria-label': 'Période précédente', disabled: mode === 'tout',
        onclick: () => majVue({ nom: 'argent', mode, ancre: decalerPeriode(mode, ancre, -1) }),
      }, svg(ICONES.fleche)),
      h('div', { class: 'periode__libelle' }, libellePeriode(mode, du, au)),
      h('button', {
        class: 'ico', 'aria-label': 'Période suivante',
        disabled: mode === 'tout' || au >= isoLocal(),
        onclick: () => majVue({ nom: 'argent', mode, ancre: decalerPeriode(mode, ancre, 1) }),
      }, svg(ICONES.chevron)),
    ),
  ));

  if (!evs.length) {
    frag.append(h('div', { class: 'vide' },
      h('div', { class: 'vide__trait', style: { background: 'var(--reglure)' } }),
      h('h2', null, 'Rien dépensé sur cette période.'),
      h('p', null, 'Changez de période, ou allez vivre quelque chose.')));
    // Le budget et les idées d'achat ne dépendent pas de la période affichée :
    // sans ça, une semaine sans dépense rendrait le budget introuvable.
    ajouter(frag, sectionResteAAcheter());
    ajouter(frag, sectionBudget());
    return frag;
  }

  /* --- le chiffre : une seule fois, en sans, chiffres proportionnels ----- */
  const devises = repartir(evs, (e) => e.devise || 'EUR');
  frag.append(h('div', { class: 'argent__hero' },
    h('div', { class: 'hero' }, formatEuros(total)),
    h('div', { class: 'hero__sous' },
      evs.length + (evs.length > 1 ? ' entrées' : ' entrée'),
      joursEcoules > 1 ? ', soit ' + formatEuros(moyenne) + ' par jour' : ''),
  ));

  /* --- rythme : une série, une teinte, pas de légende -------------------- */
  const seaux = bucketsRythme(du, au, evs);
  if (seaux) {
    const max = Math.max(...seaux.map((s) => s.euros), 1);
    const pointe = seaux.reduce((a, b) => (b.euros > a.euros ? b : a));
    frag.append(h('section', { class: 'bloc' },
      h('h3', { class: 'bloc__titre' }, 'Rythme'),
      h('div', { class: 'rythme', role: 'group', 'aria-label': 'Dépenses par période' },
        seaux.map((s) => h('button', {
          class: 'rythme__col',
          'aria-label': libellePeriode(s.mode, s.du, s.au) + ' : ' + formatEuros(s.euros),
          onclick: () => majVue({ nom: 'argent', mode: s.mode, ancre: s.ancre }),
        },
          h('div', {
            class: 'rythme__barre' + (s.euros ? '' : ' rythme__barre--zero'),
            style: { height: Math.max(s.euros ? 3 : 1, Math.round((s.euros / max) * 100)) + '%' },
          }))),
      ),
      h('div', { class: 'rythme__axe', 'aria-hidden': 'true' },
        seaux.map((s) => h('span', null, s.etiquette))),
      // Étiquetage sélectif : la pointe, pas un chiffre sur chaque barre.
      h('div', { class: 'bloc__note' },
        'Plus forte période : ' + formatEuros(pointe.euros) + ' — '
        + libellePeriode(pointe.mode, pointe.du, pointe.au)
        + '. Touchez une barre pour l’ouvrir.'),
    ));
  }

  /* --- répartitions : le libellé porte l'identité, la teinte est unique -- */
  ajouter(frag, blocRepartition('Par catégorie', repartir(evs, (e) => e.categorie), total, 'sans catégorie'));

  const parPays = repartir(evs, (e) => (lieuDe(e) || {}).pays);
  if (parPays.length > 1) ajouter(frag, blocRepartition('Par pays', parPays, total, 'pays non renseigné'));

  const parVille = repartir(evs, (e) => (lieuDe(e) || {}).ville);
  if (parVille.length > 1) ajouter(frag, blocRepartition('Par ville', parVille, total, 'ville non renseignée'));

  /* --- devises : le montant d'origine d'abord --------------------------- */
  if (devises.length > 1 || (devises[0] && devises[0].cle !== 'EUR')) {
    frag.append(h('section', { class: 'bloc' },
      h('h3', { class: 'bloc__titre' }, 'Par devise'),
      devises.map((d) => {
        const brut = evs.filter((e) => (e.devise || 'EUR') === d.cle)
          .reduce((s, e) => s + e.montant, 0);
        return h('div', { class: 'part' },
          h('div', { class: 'part__haut' },
            h('span', { class: 'part__nom' }, formatMontant(brut, d.cle)),
            h('span', { class: 'part__valeur' }, d.cle === 'EUR' ? '' : formatEuros(d.euros))),
          h('div', { class: 'part__note' }, d.n + (d.n > 1 ? ' entrées' : ' entrée')));
      }),
      h('div', { class: 'bloc__note' },
        'Chaque montant est converti au taux du jour où vous l’avez noté. Les totaux passés ne bougent jamais.'),
    ));
  }

  /* --- par personne ------------------------------------------------------ */
  const parPersonne = repartir(evs.filter((e) => e.beneficiaire), (e) => e.beneficiaire);
  if (parPersonne.length) {
    frag.append(h('section', { class: 'bloc' },
      h('h3', { class: 'bloc__titre' }, 'Pour qui'),
      parPersonne.map((p) => h('button', {
        class: 'part part--lien',
        onclick: () => {
          etat.filtres = videsFiltres();
          etat.filtres.beneficiaire = p.cle;
          naviguer({ nom: 'journal' });
        },
      },
        h('div', { class: 'part__haut' },
          h('span', { class: 'part__nom' }, p.cle),
          h('span', { class: 'part__valeur' }, formatEuros(p.euros))),
        h('div', { class: 'part__note' }, p.n + (p.n > 1 ? ' cadeaux' : ' cadeau') + ' — voir dans le journal'))),
      h('div', { class: 'bloc__note' },
        'Ces montants sont bien comptés dans le total ci-dessus : un cadeau reste une dépense.'),
    ));
  }

  ajouter(frag, sectionResteAAcheter());
  ajouter(frag, sectionBudget());

  if (mode === 'jour') {
    frag.append(h('div', { style: { padding: '1.2rem 1rem 0' } },
      h('button', {
        class: 'bouton bouton--calme',
        onclick: () => {
          etat.filtres = videsFiltres();
          etat.filtres.du = du;
          etat.filtres.au = au;
          naviguer({ nom: 'journal' });
        },
      }, 'Voir cette journée dans le journal')));
  }
  return frag;
}

/** Une répartition = des lignes de carnet, une barre fine, une seule teinte. */
function blocRepartition(titre, lignes, total, libelleVide) {
  if (!lignes.length) return null;
  return h('section', { class: 'bloc' },
    h('h3', { class: 'bloc__titre' }, titre),
    lignes.map((l) => h('div', { class: 'part' },
      h('div', { class: 'part__haut' },
        h('span', { class: 'part__nom' + (l.cle ? '' : ' part__nom--vide') }, l.cle || libelleVide),
        h('span', { class: 'part__valeur' }, formatEuros(l.euros))),
      h('div', { class: 'part__piste' },
        h('div', {
          class: 'part__fill',
          style: { width: (total ? Math.max(1, (l.euros / total) * 100) : 0) + '%' },
        })),
    )),
  );
}

/** Les idées d'achat : jamais dans les totaux, toujours visibles. */
function sectionResteAAcheter() {
  const idees = evenementsVivants().filter(estIdee);
  if (!idees.length) return null;

  const parPersonne = new Map();
  for (const ev of idees) {
    const k = ev.beneficiaire || '';
    if (!parPersonne.has(k)) parPersonne.set(k, []);
    parPersonne.get(k).push(ev);
  }
  const totalEstime = idees.reduce((s, e) => s + enEuros(e), 0);

  return h('section', { class: 'bloc' },
    h('h3', { class: 'bloc__titre' }, 'Reste à acheter'),
    [...parPersonne.entries()].map(([qui, liste]) => h('div', { class: 'part' },
      h('div', { class: 'part__haut' },
        h('span', { class: 'part__nom' + (qui ? '' : ' part__nom--vide') }, qui || 'pour moi'),
        h('span', { class: 'part__valeur part__valeur--prevu' },
          formatEuros(liste.reduce((s, e) => s + enEuros(e), 0)))),
      h('div', { class: 'part__idees' }, liste.map((ev) => h('button', {
        class: 'idee', onclick: () => feuilleEvenement(ev),
      },
        h('span', null, (lieuDe(ev) && nomLieu(lieuDe(ev))) || 'Lieu sans nom'),
        h('span', { class: 'idee__prix' }, formatMontant(ev.montant, ev.devise)),
      ))),
    )),
    h('div', { class: 'bloc__note' },
      'Estimé à ' + formatEuros(totalEstime)
      + '. Ces montants ne sont comptés nulle part tant que l’achat n’est pas fait —'
      + ' passez l’entrée en « acheté » pour qu’elle rejoigne vos dépenses.'),
  );
}

/* -------------------------------------------------------------- budget ---- */

function sectionBudget() {
  const b = etat.prefs.budget;
  if (!b || !(b.montant > 0)) {
    return h('section', { class: 'bloc' },
      h('h3', { class: 'bloc__titre' }, 'Budget'),
      h('div', { class: 'bloc__note', style: { marginTop: 0 } },
        'Optionnel. Si vous en posez un, le carnet vous dira où vous en êtes — sans jamais vous faire la morale.'),
      h('div', { style: { padding: '0.7rem 1rem 0' } },
        h('button', { class: 'bouton bouton--calme', onclick: feuilleBudget }, 'Poser un budget')));
  }

  const ajd = isoLocal();
  const finEcoulee = b.fin && b.fin < ajd ? b.fin : ajd;
  const depense = evenementsVivants()
    .filter((e) => estDepense(e) && e.date >= b.debut && e.date <= finEcoulee)
    .reduce((s, e) => s + enEuros(e), 0);

  const reste = b.montant - depense;
  const joursEcoules = Math.max(1, nbJours(b.debut, finEcoulee < b.debut ? b.debut : finEcoulee));
  const rythme = depense / joursEcoules;
  const part = Math.min(100, (depense / b.montant) * 100);

  // Ton informatif : on décrit, on ne réprimande pas.
  let projection;
  if (b.fin && b.fin >= ajd) {
    const joursRestants = Math.max(1, nbJours(ajd, b.fin));
    projection = reste >= 0
      ? 'Il reste ' + formatEuros(reste) + ' pour ' + joursRestants
        + (joursRestants > 1 ? ' jours' : ' jour') + ', soit ' + formatEuros(reste / joursRestants) + ' par jour.'
      : 'Le budget est dépassé de ' + formatEuros(-reste) + ', à ' + joursRestants
        + (joursRestants > 1 ? ' jours' : ' jour') + ' de la fin.';
  } else if (reste >= 0 && rythme > 0) {
    projection = 'À ce rythme, le budget tient jusqu’au '
      + formatDateCourte(decalerJours(ajd, Math.floor(reste / rythme))) + '.';
  } else if (reste >= 0) {
    projection = 'Il reste ' + formatEuros(reste) + '.';
  } else {
    projection = 'Le budget est dépassé de ' + formatEuros(-reste) + '.';
  }

  return h('section', { class: 'bloc' },
    h('h3', { class: 'bloc__titre' }, 'Budget'),
    h('div', { class: 'part' },
      h('div', { class: 'part__haut' },
        h('span', { class: 'part__nom' }, formatEuros(depense) + ' sur ' + formatEuros(b.montant)),
        h('span', { class: 'part__valeur' }, Math.round(part) + ' %')),
      h('div', { class: 'jauge' },
        h('div', { class: 'jauge__fill', style: { width: part + '%' } })),
      h('div', { class: 'part__note' },
        'Depuis le ' + formatDateCourte(b.debut)
        + ' — ' + formatEuros(rythme) + ' par jour en moyenne'),
    ),
    h('div', { class: 'bloc__note' }, projection),
    h('div', { style: { padding: '0.7rem 1rem 0' } },
      h('button', { class: 'bouton bouton--calme', onclick: feuilleBudget }, 'Modifier le budget')),
  );
}

function feuilleBudget() {
  const b = etat.prefs.budget || {};
  let champMontant, champDebut, champFin;

  // Par défaut, le budget démarre au premier jour noté dans le carnet.
  const dates = evenementsVivants().map((e) => e.date).sort();
  const debutParDefaut = b.debut || dates[0] || isoLocal();

  ouvrirFeuille({
    titre: 'Budget',
    labelValider: 'Enregistrer',
    corps: (f) => {
      champMontant = h('input', {
        type: 'text', inputmode: 'decimal',
        value: b.montant ? String(b.montant) : '',
        style: { fontFamily: 'var(--police-chiffres)', textAlign: 'right' },
      });
      champDebut = h('input', { type: 'date', value: debutParDefaut });
      champFin = h('input', { type: 'date', value: b.fin || '' });
      return h('div', null,
        h('div', { class: 'champ' },
          h('label', null, 'Montant prévu, en euros'), champMontant),
        h('div', { class: 'champ' },
          h('label', null, 'Depuis le'), champDebut),
        h('div', { class: 'champ' },
          h('label', null, 'Jusqu’au (facultatif)'), champFin,
          h('div', { class: 'aide' },
            'Avec une date de fin, le carnet vous dit combien vous pouvez dépenser par jour. Sans elle, il vous dit jusqu’à quand le budget tient au rythme actuel.')),
        b.montant ? h('button', {
          class: 'bouton bouton--danger', type: 'button',
          onclick: async () => {
            await ecrirePref('budget', null);
            f.fermer(false, rendre);
          },
        }, 'Retirer le budget') : null,
        h('p', { class: 'note-info' },
          'Le budget n’est qu’un repère. Il ne bloque rien et ne change aucune de vos entrées.'),
      );
    },
    valider: async () => {
      const m = nombre(champMontant.value);
      if (!Number.isFinite(m) || m <= 0) { toast('Indiquez un montant supérieur à zéro.'); return false; }
      if (champFin.value && champFin.value < champDebut.value) {
        toast('La date de fin tombe avant le début.');
        return false;
      }
      await ecrirePref('budget', {
        montant: m,
        debut: champDebut.value || debutParDefaut,
        fin: champFin.value || '',
      });
      return rendre;
    },
  });
}

/* ==========================================================================
   LIRE UN TICKET (phase 3, confort de saisie)

   Le téléphone sait déjà lire un ticket : Live Text sur iOS, Lens sur Android.
   Plutôt que d'embarquer un moteur OCR de vingt mégaoctets, on récupère le
   texte que le système a reconnu et on en extrait le montant. Hors ligne,
   sans dépendance, et avec la précision de l'OS.
   ========================================================================== */

const SYMBOLES_DEVISE = {
  '€': 'EUR', '£': 'GBP', '¥': 'JPY', '₩': 'KRW', '₫': 'VND',
  '฿': 'THB', '₹': 'INR', '₺': 'TRY', '円': 'JPY', 'CHF': 'CHF', '$': 'USD',
};

/**
 * Lit un nombre écrit dans n'importe quelle convention de séparateurs.
 * « 3 200 », « 3,200 », « 1.234,56 » et « 24,90 » doivent tous tomber juste.
 */
function lireNombreLibre(brut) {
  const s = String(brut).replace(/[\s  ']/g, '');
  const virgule = s.lastIndexOf(',');
  const point = s.lastIndexOf('.');

  if (virgule > -1 && point > -1) {
    // Le séparateur décimal est le dernier des deux ; l'autre sépare les milliers.
    return virgule > point
      ? parseFloat(s.replace(/\./g, '').replace(',', '.'))
      : parseFloat(s.replace(/,/g, ''));
  }
  if (virgule > -1) {
    // Trois chiffres après la virgule : ce sont des milliers, pas des centimes.
    return s.length - virgule - 1 === 3
      ? parseFloat(s.replace(/,/g, ''))
      : parseFloat(s.replace(',', '.'));
  }
  if (point > -1) {
    return s.length - point - 1 === 3 ? parseFloat(s.replace(/\./g, '')) : parseFloat(s);
  }
  return parseFloat(s);
}

/** Extrait un montant et, si possible, une devise d'un texte de ticket. */
function analyserTicket(texte) {
  if (!texte || !texte.trim()) return null;

  let devise = null;
  const iso = texte.toUpperCase().match(
    /\b(EUR|USD|GBP|CHF|JPY|THB|VND|IDR|INR|KRW|CNY|MAD|TRY|CAD|AUD|MXN|BRL|ZAR|SEK|NOK|DKK|PLN|CZK|HUF)\b/);
  if (iso) devise = iso[1];
  else for (const [sym, code] of Object.entries(SYMBOLES_DEVISE)) {
    if (texte.includes(sym)) { devise = code; break; }
  }

  /*
    Un nombre, c'est soit des groupes de trois séparés par une espace
    (« 3 200 »), soit une suite de chiffres avec des points ou des virgules
    (« 1.234,56 »). Autoriser n'importe quelle espace ferait fusionner deux
    montants de deux lignes voisines en un seul nombre faux.
  */
  const MOTIF_NOMBRE = /\d{1,3}(?:[   ]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d+)*/g;

  // Dates et heures écartées : sur un ticket sans mot-clé, « 2026 » gagnerait.
  const sansDatesNiHeures = (s) => s
    .replace(/\d{1,4}\s*[/.\-]\s*\d{1,2}\s*[/.\-]\s*\d{1,4}/g, ' ')
    .replace(/\d{1,2}\s*:\s*\d{2}(?:\s*:\s*\d{2})?/g, ' ');

  const nombresDe = (s) => (sansDatesNiHeures(s).match(MOTIF_NOMBRE) || []);
  const MOTS_TOTAL = /(total|montant|somme|à\s*payer|a\s*payer|net\s*à|ttc|合\s*計|総\s*計|합\s*계|amount|sum)/i;

  const lignes = texte.split(/[\n\r]+/);

  // L'enseigne est presque toujours en tête de ticket : la première ligne qui
  // ressemble à un nom plutôt qu'à une date, un numéro ou une mention légale.
  const enseigne = (() => {
    const BRUIT = /^(ticket|facture|re[çc]u|caisse|tel|t[ée]l|siret|siren|tva|vat|merci|thank|www\.|http|n°|no\.|date|heure|adresse)/i;
    for (const l of lignes.slice(0, 4)) {
      const net = l.trim().replace(/\s{2,}/g, ' ');
      if (net.length < 2 || net.length > 40) continue;
      if (BRUIT.test(net)) continue;
      if (!/\p{L}{2,}/u.test(net)) continue;          // il faut de vraies lettres
      if (/^[\d\s/:.-]+$/.test(net)) continue;        // une date, une heure
      return net;
    }
    return '';
  })();

  // 1) La ligne qui annonce un total, en partant de la fin : sur un ticket,
  //    le vrai total est le dernier (« Total HT » précède « Total TTC »).
  for (let l = lignes.length - 1; l >= 0; l--) {
    if (!MOTS_TOTAL.test(lignes[l])) continue;
    const n = nombresDe(lignes[l]);
    for (let i = n.length - 1; i >= 0; i--) {
      const v = lireNombreLibre(n[i]);
      if (Number.isFinite(v) && v > 0) return { montant: v, devise, enseigne, sur: 'un total' };
    }
  }

  // 2) Sinon, le plus gros nombre plausible du ticket, ligne par ligne.
  let max = null;
  for (const s of lignes.flatMap(nombresDe)) {
    const v = lireNombreLibre(s);
    if (Number.isFinite(v) && v > 0 && v < 1e9 && (max === null || v > max)) max = v;
  }
  return max === null ? null : { montant: max, devise, enseigne, sur: 'le plus gros montant' };
}

/**
 * Bouton « Coller » : lit le presse-papier, sinon ouvre un champ où déposer
 * le texte à la main (certains navigateurs refusent la lecture directe).
 */
function boutonLireTicket(appliquer, lieuDuTicket, ajouterPhoto) {
  const traiter = (texte) => {
    const trouve = analyserTicket(texte);
    if (!trouve) { toast('Aucun montant reconnu dans ce texte.'); return false; }
    appliquer(trouve);

    // L'enseigne lue en tête de ticket nomme le lieu, s'il n'a pas de nom.
    const lieu = etat.lieux.get(lieuDuTicket);
    const actions = [];
    if (trouve.enseigne && lieu && !nomLieu(lieu)) {
      actions.push({
        label: 'Nommer « ' + trouve.enseigne + ' »',
        action: async () => {
          const maj = { ...lieu, nom: trouve.enseigne };
          try {
            await ecrire('lieux', (s) => s.lieux.put(maj));
            etat.lieux.set(lieu.id, maj);
            rendre();
            toast('Lieu nommé.');
          } catch (err) { toast(messageErreurEcriture(err)); }
        },
      });
    }
    toast('Montant repris depuis ' + trouve.sur + '. Vérifiez-le.', actions, actions.length ? 9000 : 4200);
    return true;
  };

  return h('button', {
    type: 'button', class: 'bouton bouton--calme', style: { marginTop: '0.5rem' },
    onclick: () => feuilleTicket(traiter, ajouterPhoto),
  }, 'Lire un ticket');
}

/**
 * Le parcours complet, en un seul écran : photographier le ticket, le voir en
 * grand, y sélectionner le total, coller.
 *
 * Le téléphone fait la reconnaissance de texte lui-même — Live Text sur iOS,
 * Lens sur Android — directement sur l'image affichée ici. L'app n'embarque
 * aucun moteur d'OCR : elle se contente de récupérer ce que vous avez copié.
 */
function feuilleTicket(traiter, ajouterPhoto) {
  let apercu, zone, urlApercu = null;

  const nettoyer = () => { if (urlApercu) URL.revokeObjectURL(urlApercu); urlApercu = null; };

  const photographier = () => {
    const entree = h('input', {
      type: 'file', accept: 'image/*', capture: 'environment', hidden: true,
      onchange: async (e) => {
        const fichier = e.target.files && e.target.files[0];
        entree.remove();
        if (!fichier) return;

        const t = toast('Traitement de la photo…', [], 0);
        try {
          const prete = await preparerPhoto(fichier);
          t.fermer();

          nettoyer();
          urlApercu = URL.createObjectURL(prete.enregistrement.blob);
          apercu.textContent = '';
          apercu.append(
            // Une <img> nue, sans bouton autour : c'est ce qui permet à l'appui
            // long du système d'attraper le texte plutôt qu'un clic.
            h('img', { src: urlApercu, alt: 'Ticket photographié', class: 'ticket__image' }),
            h('p', { class: 'aide', style: { marginTop: '0.5rem' } },
              'Appui long sur le total dans l’image, puis « Copier ». Ensuite, le bouton ci-dessous.'),
          );

          if (ajouterPhoto) ajouterPhoto(prete);
        } catch (err) {
          t.fermer();
          toast(err && err.message === 'image-illisible'
            ? 'Cette photo n’a pas pu être lue. Réessayez.'
            : 'Le traitement de la photo a échoué.');
        }
      },
    });
    document.body.append(entree);
    entree.click();
  };

  const collerEtLire = async (f) => {
    let texte = null;
    try {
      if (navigator.clipboard && navigator.clipboard.readText) {
        texte = await navigator.clipboard.readText();
      }
    } catch (_) { /* refus du navigateur : on retombe sur le champ manuel */ }

    if (texte && texte.trim()) {
      if (traiter(texte)) { nettoyer(); f.fermer(); return; }
      zone.value = texte;
      toast('Rien de reconnu. Corrigez le texte ci-dessous, puis relancez.');
      return;
    }
    toast('Presse-papier vide. Sélectionnez le total sur la photo et copiez-le.');
    setTimeout(() => zone.focus(), 60);
  };

  ouvrirFeuille({
    titre: 'Lire un ticket',
    corps: (f) => {
      apercu = h('div', { class: 'ticket__apercu' },
        h('p', { class: 'note-info', style: { margin: 0 } },
          'Photographiez le ticket : il s’affichera ici, et vous pourrez y sélectionner le total.'));
      zone = h('textarea', {
        placeholder: 'Ou collez ici le texte du ticket…',
        style: { minHeight: '4.5rem', fontSize: '0.85rem' },
      });

      return h('div', null,
        h('button', { type: 'button', class: 'bouton', onclick: photographier },
          'Photographier le ticket'),
        apercu,
        h('button', { type: 'button', class: 'bouton', onclick: () => collerEtLire(f) },
          'Coller le total copié'),
        h('div', { class: 'champ', style: { marginTop: '1.2rem' } },
          h('label', null, 'Si le collage ne marche pas'), zone,
          h('button', {
            type: 'button', class: 'bouton bouton--calme',
            onclick: () => { if (traiter(zone.value)) { nettoyer(); f.fermer(); } },
          }, 'Lire ce texte')),
        h('p', { class: 'note-info' },
          'La photo prise ici est ajoutée à l’entrée : votre ticket reste avec la dépense.'),
      );
    },
  });
}

/* ==========================================================================
   ENRICHISSEMENT EN LIGNE (optionnel)

   Traduire une position en nom de rue demande d'interroger un service tiers :
   c'est impossible hors ligne, et cela revient à confier ses coordonnées à
   quelqu'un d'autre. C'est donc entièrement optionnel, soumis à un accord
   explicite, et strictement additif : sans réseau, sans accord, ou en cas de
   panne du service, l'app se comporte exactement comme si ce code n'existait
   pas — aucune attente, aucune erreur, aucun champ vidé.

   Rien de ce qui est trouvé n'écrase jamais ce que vous avez écrit.
   ========================================================================== */

const CACHE_GEO = new Map();
const cleGeo = (lat, lon) => lat.toFixed(4) + ',' + lon.toFixed(4);   // ~11 m

let dernierAppelReseau = 0;

/** Nominatim demande au maximum une requête par seconde. On la respecte. */
async function respecterCadence() {
  const attente = 1100 - (Date.now() - dernierAppelReseau);
  if (attente > 0) await delai(attente);
  dernierAppelReseau = Date.now();
}

async function recuperer(url, options = {}) {
  const stop = new AbortController();
  const minuteur = setTimeout(() => stop.abort(), options.limite || 9000);
  try {
    const r = await fetch(url, { ...options, signal: stop.signal });
    if (!r.ok) throw new Error('http-' + r.status);
    return await r.json();
  } finally { clearTimeout(minuteur); }
}

/** L'accord n'est demandé qu'une fois, et reste révocable dans les réglages. */
function autoriserReseau() {
  if (etat.prefs.enrichissement === true) return Promise.resolve(true);
  if (etat.prefs.enrichissement === false) return Promise.resolve(false);

  return new Promise((resoudre) => {
    let decide = false;
    const f = ouvrirFeuille({
      titre: 'Compléter depuis Internet',
      corps: () => h('div', null,
        h('p', { style: { marginTop: 0, fontFamily: 'var(--police-texte)', fontSize: '1.02rem' } },
          'Pour retrouver la ville, la rue et les commerces autour de vous, l’app doit envoyer '
          + 'vos coordonnées à OpenStreetMap, un service public et gratuit.'),
        h('p', { class: 'note-info' },
          'Rien d’autre ne part : ni vos photos, ni vos montants, ni vos notes. '
          + 'Vous pouvez revenir sur ce choix à tout moment dans les réglages, et le carnet '
          + 'reste entièrement utilisable sans.'),
        h('button', {
          class: 'bouton',
          onclick: async () => { decide = true; await ecrirePref('enrichissement', true); f.fermer(); resoudre(true); },
        }, 'Autoriser'),
        h('button', {
          class: 'bouton bouton--calme',
          onclick: async () => { decide = true; await ecrirePref('enrichissement', false); f.fermer(); resoudre(false); },
        }, 'Non merci'),
      ),
    });
    const veille = setInterval(() => {
      if (f.ferme) { clearInterval(veille); if (!decide) resoudre(false); }
    }, 120);
  });
}

const reseauUtilisable = () => etat.prefs.enrichissement === true && navigator.onLine !== false;

/**
 * Géocodage inverse : une position devient une ville, un pays, une rue.
 * Renvoie null en cas d'échec — jamais d'exception qui remonte à l'interface.
 */
async function geocoderInverse(lat, lon) {
  const cle = cleGeo(lat, lon);
  if (CACHE_GEO.has(cle)) return CACHE_GEO.get(cle);
  try {
    await respecterCadence();
    const d = await recuperer('https://nominatim.openstreetmap.org/reverse'
      + '?format=jsonv2&zoom=18&addressdetails=1&accept-language=fr'
      + '&lat=' + encodeURIComponent(lat) + '&lon=' + encodeURIComponent(lon));

    const a = d.address || {};
    const resultat = {
      ville: a.city || a.town || a.village || a.municipality || a.suburb || a.county || '',
      pays: a.country || '',
      adresse: [
        [a.house_number, a.road].filter(Boolean).join(' '),
        a.neighbourhood || a.suburb || '',
        a.postcode || '',
      ].filter(Boolean).join(', '),
      nom: d.name || '',
    };
    CACHE_GEO.set(cle, resultat);
    return resultat;
  } catch (_) {
    return null;      // hors ligne, service muet, requête trop lente : on n'insiste pas
  }
}

/** Traduit les étiquettes OpenStreetMap vers les six types du carnet. */
function typeDepuisTags(t = {}) {
  if (t.shop) return 'boutique';
  if (['restaurant', 'cafe', 'fast_food', 'bar', 'pub', 'ice_cream', 'food_court'].includes(t.amenity)) return 'restaurant';
  if (['hotel', 'hostel', 'guest_house', 'motel', 'apartment', 'chalet'].includes(t.tourism)) return 'hébergement';
  if (['museum', 'attraction', 'gallery', 'artwork', 'viewpoint', 'zoo', 'theme_park'].includes(t.tourism)) return 'activité';
  if (t.historic || t.leisure) return 'activité';
  if (['bus_station', 'ferry_terminal', 'taxi', 'car_rental'].includes(t.amenity)) return 'transport';
  if (t.public_transport || t.railway || t.aeroway) return 'transport';
  if (t.amenity) return 'activité';
  return 'autre';
}

/** Les commerces et curiosités nommés autour d'un point, du plus proche au plus loin. */
async function lieuxAlentour(lat, lon, rayon = 70) {
  const requete = '[out:json][timeout:12];('
    + ['shop', 'amenity', 'tourism', 'leisure', 'historic']
      .map((c) => 'nwr(around:' + rayon + ',' + lat + ',' + lon + ')[name][' + c + '];').join('')
    + ');out center 40;';
  try {
    await respecterCadence();
    const d = await recuperer('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: 'data=' + encodeURIComponent(requete),
      limite: 14000,
    });
    const vus = new Set();
    return (d.elements || [])
      .map((e) => {
        const la = e.lat ?? (e.center && e.center.lat);
        const lo = e.lon ?? (e.center && e.center.lon);
        const t = e.tags || {};
        if (!Number.isFinite(la) || !t.name) return null;
        return {
          nom: t.name,
          type: typeDepuisTags(t),
          adresse: [
            [t['addr:housenumber'], t['addr:street']].filter(Boolean).join(' '),
            t['addr:postcode'] || '', t['addr:city'] || '',
          ].filter(Boolean).join(', '),
          d: distance(lat, lon, la, lo),
        };
      })
      .filter((x) => x && !vus.has(x.nom) && vus.add(x.nom))
      .sort((a, b) => a.d - b.d)
      .slice(0, 15);
  } catch (_) {
    return [];
  }
}

/**
 * Complète en arrière-plan un lieu qui vient d'être créé. Ne remplit que les
 * champs restés vides, et n'affiche rien : c'est un confort, pas un événement.
 */
async function enrichirEnArrierePlan(lieuId) {
  if (!reseauUtilisable()) return;
  const lieu = etat.lieux.get(lieuId);
  if (!lieu || !Number.isFinite(lieu.latitude)) return;
  if (lieu.ville && lieu.pays && lieu.adresse) return;

  const trouve = await geocoderInverse(lieu.latitude, lieu.longitude);
  if (!trouve) return;

  const frais = etat.lieux.get(lieuId);
  if (!frais || frais.supprime_le) return;

  const maj = { ...frais };
  let change = false;
  if (!maj.ville && trouve.ville) { maj.ville = trouve.ville; change = true; }
  if (!maj.pays && trouve.pays) { maj.pays = trouve.pays; change = true; }
  if (!maj.adresse && trouve.adresse) { maj.adresse = trouve.adresse; change = true; }
  if (!change) return;

  try {
    await ecrire('lieux', (s) => s.lieux.put(maj));
    etat.lieux.set(lieuId, maj);
    // La ville courante n'est renseignée que si elle ne l'était pas : on ne
    // touche jamais à un réglage que vous avez posé vous-même.
    const vc = etat.prefs.ville_courante;
    if ((!vc || !vc.ville) && maj.ville) {
      await ecrirePref('ville_courante', { ville: maj.ville, pays: maj.pays || '' });
    }
    rendre();
  } catch (_) { /* le lieu reste parfaitement utilisable sans ces champs */ }
}

/** Panneau de suggestions : les commerces autour, à choisir d'un doigt. */
function feuilleAlentour(lieu, appliquer) {
  let zone;
  const f = ouvrirFeuille({
    titre: 'Autour de vous',
    corps: () => {
      zone = h('div', null, h('p', { class: 'note-info', style: { marginTop: 0 } }, 'Recherche…'));
      return zone;
    },
  });

  (async () => {
    if (!await autoriserReseau()) {
      if (!f.ferme) { zone.textContent = ''; zone.append(h('p', { class: 'note-info' },
        'La recherche en ligne est désactivée. Vous pouvez l’activer dans les réglages.')); }
      return;
    }
    const liste = await lieuxAlentour(lieu.latitude, lieu.longitude);
    if (f.ferme) return;
    zone.textContent = '';

    if (!liste.length) {
      zone.append(h('p', { class: 'note-info' },
        navigator.onLine === false
          ? 'Pas de réseau pour l’instant. Le nom s’écrit très bien à la main.'
          : 'Rien de référencé à moins de 70 mètres. Le nom s’écrit très bien à la main.'));
      return;
    }

    zone.append(
      h('p', { class: 'note-info', style: { marginTop: 0 } },
        'Données OpenStreetMap. Choisir un lieu remplit son nom, son type et son adresse.'),
      h('div', { style: { margin: '0.6rem -1rem 0' } }, liste.map((p) => h('button', {
        class: 'rangee',
        onclick: () => f.fermer(false, () => appliquer(p)),
      },
        h('div', { class: 'rangee__texte' },
          h('div', { class: 'rangee__titre' }, p.nom),
          h('div', { class: 'rangee__sous' }, [p.type, p.adresse].filter(Boolean).join(' — '))),
        h('div', { class: 'rangee__droite' }, Math.round(p.d) + ' m'),
      ))),
    );
  })();
}

/* ==========================================================================
   PARTAGE (phase 3)

   Sans backend, sans compte, sans serveur. L'app fabrique un data.json allégé
   et dépose les vignettes ; un viewer statique, déployé une seule fois, les
   lit. L'adresse ne change jamais.

   Choix par défaut : ni les montants, ni les coordonnées précises ne sortent.
   Les idées de cadeaux non plus — on ne divulgue pas une surprise. Et les
   bénéficiaires ne quittent jamais le téléphone.
   ========================================================================== */

const optionsPartage = () => Object.assign(
  { montants: false, gps: false }, etat.prefs.partage_options || {});

/** Rassemble les vignettes d'une liste de références, sans doublon. */
async function collecterVignettes(refs, sac) {
  const sortie = [];
  for (const ref of refs || []) {
    const id = ref.id || ref;
    if (sac.has(id)) { sortie.push(sac.get(id).meta); continue; }
    const rec = await lire('photos', id).catch(() => null);
    if (!rec) continue;
    const blob = rec.vignette || rec.blob;
    if (!blob) continue;
    const meta = {
      f: id + (blob.type === 'image/webp' ? '.webp' : '.jpg'),
      l: ref.l || rec.largeur || null,
      h: ref.h || rec.hauteur || null,
    };
    sac.set(id, { meta, blob });
    sortie.push(meta);
  }
  return sortie;
}

async function construireExport() {
  const opts = optionsPartage();
  const partages = lieuxVivants().filter((l) => l.partage);
  const sac = new Map();
  const lieux = [];

  for (const l of partages) {
    const evs = evenementsVivants()
      .filter((e) => e.lieu_id === l.id && !estIdee(e))   // une surprise reste une surprise
      .sort((a, b) => (a.date + (a.heure || '')) < (b.date + (b.heure || '')) ? -1 : 1);

    const evenements = [];
    for (const ev of evs) {
      const entree = {
        date: ev.date,
        heure: ev.heure || '',
        type: ev.type,
        commentaire: ev.commentaire || '',
        photos: await collecterVignettes(ev.photos, sac),
      };
      if (opts.montants && aUnMontant(ev)) {
        entree.montant = ev.montant;
        entree.devise = ev.devise;
        entree.euros = Math.round(enEuros(ev) * 100) / 100;
      }
      // Une entrée sans photo, sans mot et sans montant n'a rien à raconter.
      if (entree.photos.length || entree.commentaire || entree.montant) evenements.push(entree);
    }

    const fiche = {
      id: l.id,
      nom: l.nom || '',
      type: l.type || '',
      ville: l.ville || '',
      pays: l.pays || '',
      note: l.note || 0,
      commentaire: l.commentaire || '',
      tags: l.tags || [],
      photos: await collecterVignettes(l.photos, sac),
      evenements,
    };
    if (opts.gps && Number.isFinite(l.latitude)) {
      fiche.latitude = l.latitude;
      fiche.longitude = l.longitude;
    }
    lieux.push(fiche);
  }

  const dates = lieux.flatMap((l) => l.evenements.map((e) => e.date)).sort();
  const data = {
    version: 1,
    genere_le: new Date().toISOString(),
    titre: 'Carnet de voyage',
    options: { montants: opts.montants, gps: opts.gps },
    stats: {
      lieux: lieux.length,
      villes: new Set(lieux.map((l) => l.ville).filter(Boolean)).size,
      pays: new Set(lieux.map((l) => l.pays).filter(Boolean)).size,
      photos: sac.size,
      premier_jour: dates[0] || null,
      dernier_jour: dates[dates.length - 1] || null,
      jours: dates.length ? nbJours(dates[0], dates[dates.length - 1]) : 0,
    },
    lieux,
  };

  return {
    json: JSON.stringify(data, null, 1),
    photos: [...sac.values()].map((v) => ({ nom: v.meta.f, blob: v.blob })),
  };
}

/* ------------------------------------------------------------ écran ------- */

function vuePartage() {
  const frag = document.createDocumentFragment();
  const opts = optionsPartage();
  const cfg = etat.prefs.github || {};
  const lieux = lieuxVivants().sort((a, b) =>
    (nomLieu(a) || 'zzz').localeCompare(nomLieu(b) || 'zzz', 'fr'));
  const coches = lieux.filter((l) => l.partage);

  const url = (cfg.proprietaire && cfg.depot)
    ? 'https://' + cfg.proprietaire.toLowerCase() + '.github.io/' + cfg.depot + '/'
    : null;

  frag.append(h('p', { class: 'note-info', style: { margin: '1rem' } },
    'Vous cochez ce qui peut sortir ; le reste ne quitte jamais le téléphone. '
    + 'La page de votre famille garde toujours la même adresse — seules les données y sont remplacées.'));

  if (url) {
    frag.append(h('div', { class: 'sous-titre' }, 'Adresse de la page'),
      h('div', { style: { padding: '0 1rem' } },
        h('a', {
          href: url, target: '_blank', rel: 'noopener',
          style: { color: 'var(--bille)', wordBreak: 'break-all', fontSize: '0.88rem' },
        }, url)));
  }

  /* --- ce qui sort --- */
  frag.append(h('div', { class: 'sous-titre' }, 'Ce qui est partagé'));
  frag.append(bascule('Les montants dépensés', opts.montants,
    'Sans cela, votre famille voit les lieux et les photos, jamais l’argent.',
    async (v) => { await ecrirePref('partage_options', { ...opts, montants: v }); rendre(); }));
  frag.append(bascule('La position précise', opts.gps,
    'Par défaut, seule la ville est publiée. Les coordonnées exactes de vos nuits restent ici.',
    async (v) => { await ecrirePref('partage_options', { ...opts, gps: v }); rendre(); }));

  /* --- les lieux --- */
  frag.append(h('div', { class: 'sous-titre' },
    coches.length + ' lieu' + (coches.length > 1 ? 'x cochés' : ' coché') + ' sur ' + lieux.length));

  if (lieux.length) {
    frag.append(h('div', { style: { padding: '0 1rem 0.6rem' } },
      h('button', {
        class: 'bouton bouton--calme',
        onclick: () => basculerTousLesLieux(coches.length !== lieux.length),
      }, coches.length === lieux.length ? 'Tout décocher' : 'Tout cocher')));

    for (const l of lieux) {
      const n = evenementsVivants().filter((e) => e.lieu_id === l.id && !estIdee(e)).length;
      frag.append(h('label', { class: 'rangee', style: { cursor: 'pointer' } },
        h('input', {
          type: 'checkbox', checked: !!l.partage,
          style: { width: '22px', height: '22px', accentColor: 'var(--bille)', flex: '0 0 auto' },
          onchange: (e) => basculerLieu(l, e.target.checked),
        }),
        (l.photos && l.photos[0]) ? imgVignette(l.photos[0], 'rangee__miniature') : null,
        h('div', { class: 'rangee__texte' },
          h('div', { class: 'rangee__titre' }, nomLieu(l) || 'Lieu sans nom'),
          h('div', { class: 'rangee__sous' },
            [l.ville, n + (n > 1 ? ' entrées' : ' entrée')].filter(Boolean).join(', '))),
      ));
    }
  } else {
    frag.append(h('p', { class: 'note-info', style: { margin: '0 1rem' } },
      'Aucun lieu à partager pour l’instant.'));
  }

  /* --- actions --- */
  frag.append(h('div', { class: 'sous-titre' }, 'Publier'),
    h('div', { id: 'zone-poids', class: 'note-info', style: { margin: '0 1rem' } }, 'Calcul…'),
    h('div', { style: { padding: '0.9rem 1rem' } },
      h('button', {
        class: 'bouton', disabled: !coches.length,
        onclick: () => coches.length ? confirmerPublication() : null,
      }, 'Publier'),
      h('button', { class: 'bouton bouton--calme', onclick: copierDonnees }, 'Copier les données'),
      h('button', { class: 'bouton bouton--calme', onclick: feuilleGitHub },
        cfg.token ? 'Modifier la connexion GitHub' : 'Connecter GitHub')),
  );

  decrirePoids();
  return frag;
}

function bascule(titre, valeur, aide, onchange) {
  return h('label', { class: 'rangee', style: { cursor: 'pointer' } },
    h('input', {
      type: 'checkbox', checked: valeur,
      style: { width: '22px', height: '22px', accentColor: 'var(--bille)', flex: '0 0 auto' },
