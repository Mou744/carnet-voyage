/* Encodage base64 sans dépassement de pile sur les gros tableaux. */
function versBase64(octets) {
  let s = '';
  const PAS = 0x8000;
  for (let i = 0; i < octets.length; i += PAS) {
    s += String.fromCharCode.apply(null, octets.subarray(i, i + PAS));
  }
  return btoa(s);
}
const blobEnBase64 = async (blob) => versBase64(new Uint8Array(await blob.arrayBuffer()));

/** Appel générique sur le dépôt. Lève toujours si GitHub n'est pas content. */
async function appelGitHub(cfg, sousChemin, methode, corps) {
  const url = 'https://api.github.com/repos/' + encodeURIComponent(cfg.proprietaire)
    + '/' + encodeURIComponent(cfg.depot) + sousChemin;

  const r = await fetch(url, {
    method: methode,
    headers: {
      Authorization: 'Bearer ' + cfg.token,
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    },
    body: corps ? JSON.stringify(corps) : undefined,
  });

  if (!r.ok) {
    const detail = await r.text().catch(() => '');
    const e = new Error('github-' + r.status);
    e.statut = r.status;
    e.detail = detail;
    throw e;
  }
  return r.status === 204 ? null : r.json();
}

async function apiGitHub(cfg, chemin, methode, corps) {
  const sous = '/contents/' + chemin
    + (methode === 'GET' ? '?ref=' + encodeURIComponent(cfg.branche || 'main') : '');
  try {
    return await appelGitHub(cfg, sous, methode, corps);
  } catch (e) {
    // Sur une lecture, un 404 veut dire « ce fichier n'existe pas encore ».
    if (e.statut === 404 && methode === 'GET') return null;
    throw e;
  }
}

function messageErreurGitHub(err) {
  if (err && (err.statut === 401 || err.statut === 403)) {
    return 'GitHub refuse le jeton : il a expiré, ou il a été révoqué. Créez-en un nouveau.';
  }
  if (err && err.statut === 404) {
    // GitHub renvoie 404 — et non 403 — quand un jeton n'a pas accès à un
    // dépôt : impossible de distinguer « inexistant » de « interdit ».
    return 'Dépôt introuvable. Deux causes possibles : le nom saisi n’est pas celui '
      + 'du dépôt sur GitHub (celui de l’adresse github.com/pseudo/ce-nom-là, pas le nom '
      + 'de votre voyage) ; ou le jeton n’a pas accès à ce dépôt — il doit le lister dans '
      + '« Repository access » et avoir « Contents : Read and write ».';
  }
  if (err && err.statut === 409) return 'Le dépôt a changé entre-temps. Relancez la publication.';
  if (err && err.statut === 422) return 'GitHub a refusé le contenu. Relancez la publication.';
  return 'Publication interrompue : pas de réseau, ou GitHub injoignable. Rien n’est perdu, réessayez plus tard.';
}

/**
 * Diagnostic honnête de la connexion : on interroge le dépôt lui-même, puis
 * le droit d'écriture, puis la branche. L'ancien test lisait un fichier
 * absent, dont le 404 était traité comme un succès — il annonçait « connexion
 * établie » à un jeton qui ne voyait rien.
 */
async function diagnostiquerGitHub(cfg) {
  if (!cfg.proprietaire || !cfg.depot) return { ok: false, message: 'Indiquez le propriétaire et le nom du dépôt.' };
  if (!cfg.token) return { ok: false, message: 'Collez le jeton d’accès.' };
  if (navigator.onLine === false) return { ok: false, message: 'Pas de réseau : impossible de vérifier maintenant.' };

  let depot;
  try {
    depot = await appelGitHub(cfg, '', 'GET');
  } catch (e) {
    return { ok: false, message: messageErreurGitHub(e) };
  }

  if (depot && depot.permissions && depot.permissions.push === false) {
    return {
      ok: false,
      message: 'Le jeton voit ' + depot.full_name + ' mais ne peut pas y écrire. '
        + 'Passez « Contents » sur « Read and write » dans les permissions du jeton.',
    };
  }

  const branche = cfg.branche || 'main';
  try {
    await appelGitHub(cfg, '/branches/' + encodeURIComponent(branche), 'GET');
  } catch (e) {
    if (e.statut === 404) {
      let dispo = '';
      try {
        const bs = await appelGitHub(cfg, '/branches', 'GET');
        dispo = (bs || []).map((b) => b.name).join(', ');
      } catch (_) { /* tant pis, on reste sur le message court */ }
      return {
        ok: false,
        message: 'La branche « ' + branche + ' » n’existe pas'
          + (dispo ? '. Branches disponibles : ' + dispo : '') + '.',
      };
    }
    return { ok: false, message: messageErreurGitHub(e) };
  }

  return { ok: true, message: 'Connexion établie : ' + depot.full_name + ', branche ' + branche + ', écriture autorisée.' };
}

/**
 * Rattrape les saisies naturelles : une URL complète, ou « pseudo/depot »
 * collé dans le champ du dépôt.
 */
function normaliserConfigGitHub(v) {
  let proprietaire = (v.proprietaire || '').trim();
  let depot = (v.depot || '').trim()
    .replace(/^https?:\/\/(www\.)?github\.com\//i, '')
    .replace(/\.git$/i, '')
    .replace(/\/+$/, '');

  if (depot.includes('/')) {
    const bouts = depot.split('/').filter(Boolean);
    depot = bouts.pop();
    if (!proprietaire && bouts.length) proprietaire = bouts.pop();
  }
  return {
    proprietaire: proprietaire.replace(/^https?:\/\/(www\.)?github\.com\//i, '').replace(/\/+$/, ''),
    depot,
    branche: (v.branche || '').trim() || 'main',
    token: (v.token || '').trim(),
  };
}

async function publierSurGitHub() {
  const cfg = etat.prefs.github;
  if (!cfg || !cfg.token || !cfg.proprietaire || !cfg.depot) {
    toast('Connectez d’abord GitHub.');
    return feuilleGitHub();
  }

  const t = toast('Préparation…', [], 0);
  const dire = (m) => { const z = t.el.querySelector('.toast__texte'); if (z) z.textContent = m; };
  const publie = Object.assign({ data: null, photos: {} }, etat.prefs.publie || {});

  try {
    const paquet = await construireExport();

    /* --- les vignettes d'abord : le JSON ne doit jamais pointer dans le vide --- */
    let envoyees = 0;
    for (const p of paquet.photos) {
      if (publie.photos[p.nom]) continue;                 // déjà en ligne
      envoyees++;
      dire('Envoi des photos ' + envoyees + '/'
        + paquet.photos.filter((x) => !publie.photos[x.nom]).length + '…');
      const rep = await apiGitHub(cfg, 'photos/' + p.nom, 'PUT', {
        message: 'Carnet : photo ' + p.nom,
        content: await blobEnBase64(p.blob),
        branch: cfg.branche || 'main',
      });
      publie.photos[p.nom] = rep && rep.content ? rep.content.sha : true;
      await ecrirePref('publie', publie);                 // reprise possible si ça coupe
    }

    /* --- puis data.json --- */
    dire('Envoi des données…');
    const existant = await apiGitHub(cfg, 'data.json', 'GET');
    const rep = await apiGitHub(cfg, 'data.json', 'PUT', {
      message: 'Carnet : mise à jour du ' + formatDateCourte(isoLocal()),
      content: versBase64(new TextEncoder().encode(paquet.json)),
      branch: cfg.branche || 'main',
      sha: existant ? existant.sha : undefined,
    });
    publie.data = rep && rep.content ? rep.content.sha : null;

    /* --- retirer les vignettes qui ne sont plus partagées --- */
    const encore = new Set(paquet.photos.map((p) => p.nom));
    const aRetirer = Object.keys(publie.photos).filter((nom) => !encore.has(nom));
    let retirees = 0;
    for (const nom of aRetirer) {
      dire('Retrait des photos décochées…');
      try {
        const info = await apiGitHub(cfg, 'photos/' + nom, 'GET');
        if (info && info.sha) {
          await apiGitHub(cfg, 'photos/' + nom, 'DELETE', {
            message: 'Carnet : retrait de ' + nom,
            sha: info.sha,
            branch: cfg.branche || 'main',
          });
          retirees++;
        }
      } catch (_) { /* une photo déjà absente n'est pas un échec */ }
      delete publie.photos[nom];
    }

    await ecrirePref('publie', publie);
    t.fermer();

    const url = 'https://' + cfg.proprietaire.toLowerCase() + '.github.io/' + cfg.depot + '/';
    toast('Publié' + (envoyees ? ' — ' + envoyees + ' photo(s) ajoutée(s)' : '')
      + (retirees ? ', ' + retirees + ' retirée(s)' : '') + '.',
      [{ label: 'Voir', action: () => window.open(url, '_blank', 'noopener') }], 10000);
  } catch (err) {
    t.fermer();
    console.error(err);
    await ecrirePref('publie', publie);   // on garde ce qui a réussi
    toast(messageErreurGitHub(err), [], 9000);
  }
}

/* ==========================================================================
   SAUVEGARDE COMPLÈTE (phase 4)

   Vos données vous appartiennent : un fichier, tout dedans, lisible sans cette
   app. C'est le seul filet contre un téléphone perdu ou un navigateur qui
   purge son stockage.

   Le jeton GitHub, lui, ne part JAMAIS dans la sauvegarde : un fichier qui
   traîne dans un cloud ne doit pas contenir un droit d'écriture.
   ========================================================================== */

const FORMAT_SAUVEGARDE = 'carnet-voyage';

function base64EnBlob(b64, type) {
  const bin = atob(b64);
  const octets = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) octets[i] = bin.charCodeAt(i);
  return new Blob([octets], { type: type || 'application/octet-stream' });
}

/** Préférences sauvegardables : tout, sauf le secret. */
function prefsSauvegardables() {
  const copie = { ...etat.prefs };
  if (copie.github) copie.github = { ...copie.github, token: '' };
  delete copie.publie;          // propre au dépôt, se reconstruit tout seul
  return copie;
}

/**
 * Construit le fichier morceau par morceau. Chaque photo devient un Blob
 * indépendant aussitôt encodée : la chaîne base64 peut être libérée, au lieu
 * de s'accumuler en mémoire jusqu'à faire tomber le navigateur.
 */
async function construireSauvegarde({ avecPhotos, avancement }) {
  const lieux = [...etat.lieux.values()];
  const evenements = etat.evenements;
  const photos = avecPhotos ? await lireTout('photos') : [];

  const morceaux = [];
  morceaux.push('{\n"format":"' + FORMAT_SAUVEGARDE + '",\n"version":1,\n'
    + '"genere_le":' + JSON.stringify(new Date().toISOString()) + ',\n'
    + '"avec_photos":' + (avecPhotos ? 'true' : 'false') + ',\n'
    + '"compte":' + JSON.stringify({
      lieux: lieux.length, evenements: evenements.length, photos: photos.length,
    }) + ',\n');
  morceaux.push('"prefs":' + JSON.stringify(prefsSauvegardables()) + ',\n');
  morceaux.push('"lieux":' + JSON.stringify(lieux) + ',\n');
  morceaux.push('"evenements":' + JSON.stringify(evenements) + ',\n');
  morceaux.push('"photos":[');

  for (let i = 0; i < photos.length; i++) {
    const p = photos[i];
    if (avancement) avancement(i + 1, photos.length);
    const entree = {
      id: p.id, type_mime: p.type_mime, largeur: p.largeur, hauteur: p.hauteur,
      poids: p.poids, cree_le: p.cree_le, parent_id: p.parent_id,
      blob: p.blob ? await blobEnBase64(p.blob) : null,
      vignette: p.vignette ? await blobEnBase64(p.vignette) : null,
    };
    // Emballé immédiatement : la chaîne base64 devient collectable.
    morceaux.push(new Blob([(i ? ',' : '') + JSON.stringify(entree)]));
  }

  morceaux.push(']\n}\n');
  return new Blob(morceaux, { type: 'application/json' });
}

/** Remet le fichier à l'utilisateur, par le canal que son téléphone préfère. */
async function livrerFichier(blob, nom) {
  try {
    const fichier = new File([blob], nom, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [fichier] })) {
      await navigator.share({ files: [fichier], title: nom });
      return 'partage';
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return 'annule';
    // Partage indisponible ou refusé : on retombe sur le téléchargement.
  }
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: nom });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return 'telecharge';
}

const nomSauvegarde = () => 'carnet-' + isoLocal() + '.json';

function feuilleSauvegarde() {
  let avecPhotos = true;
  let corps;

  const construire = (f) => {
    const boite = h('div');
    boite.append(
      h('p', { class: 'note-info', style: { marginTop: 0 } },
        'Un seul fichier, qui contient tout : lieux, entrées, taux, réglages — '
        + 'et les photos si vous les incluez. Rangez-le ailleurs que sur ce téléphone.'),

      h('div', { class: 'champ' },
        h('span', { class: 'legende' }, 'Contenu'),
        h('div', { class: 'segments', role: 'group' },
          [[true, 'Avec les photos'], [false, 'Sans les photos']].map(([v, label]) =>
            h('button', {
              type: 'button', 'aria-pressed': avecPhotos === v ? 'true' : 'false',
              onclick: () => { avecPhotos = v; corps.textContent = ''; corps.append(construire(f)); },
            }, label))),
        h('div', { id: 'zone-taille', class: 'aide' }, 'Estimation…')),

      h('button', {
        class: 'bouton',
        onclick: async () => {
          const t = toast('Préparation de la sauvegarde…', [], 0);
          const dire = (m) => { const z = t.el.querySelector('.toast__texte'); if (z) z.textContent = m; };
          try {
            const blob = await construireSauvegarde({
              avecPhotos,
              avancement: (i, n) => { if (n > 4) dire('Photo ' + i + ' sur ' + n + '…'); },
            });
            dire('Enregistrement…');
            const issue = await livrerFichier(blob, nomSauvegarde());
            t.fermer();
            if (issue === 'annule') return;
            await ecrirePref('derniere_sauvegarde', new Date().toISOString());
            toast(issue === 'partage'
              ? 'Sauvegarde envoyée.'
              : 'Sauvegarde téléchargée : ' + nomSauvegarde() + '.');
            rendre();
          } catch (err) {
            t.fermer();
            console.error(err);
            toast('La sauvegarde n’a pas pu être créée. Réessayez sans les photos pour un fichier plus léger.', [], 9000);
          }
        },
      }, 'Créer la sauvegarde'),

      h('button', { class: 'bouton bouton--calme', onclick: () => f.fermer(false, choisirSauvegarde) },
        'Restaurer un fichier'),

      h('p', { class: 'note-info' },
        'Le jeton GitHub n’est jamais inclus : un fichier de sauvegarde ne doit pas '
        + 'transporter un droit d’écriture sur votre dépôt.'),
    );
    return boite;
  };

  ouvrirFeuille({
    titre: 'Sauvegarde',
    corps: (f) => {
      corps = h('div');
      corps.append(construire(f));
      estimerTailleSauvegarde();
      return corps;
    },
  });
}

async function estimerTailleSauvegarde() {
  const zone = $('#zone-taille');
  if (!zone) return;
  try {
    const photos = await lireTout('photos');
    const octets = photos.reduce((s, p) =>
      s + (p.blob ? p.blob.size : 0) + (p.vignette ? p.vignette.size : 0), 0);
    if (!$('#zone-taille')) return;
    // Le base64 gonfle d'environ un tiers.
    $('#zone-taille').textContent = photos.length
      ? photos.length + ' photos, soit environ ' + ((octets * 1.37) / 1048576).toFixed(0)
        + ' Mo avec les photos, quelques dizaines de Ko sans.'
      : 'Aucune photo pour l’instant : le fichier sera très léger.';
  } catch (_) { /* estimation facultative */ }
}

function choisirSauvegarde() {
  const entree = h('input', {
    type: 'file', accept: 'application/json,.json', hidden: true,
    onchange: async (e) => {
      const fichier = e.target.files && e.target.files[0];
      entree.remove();
      if (fichier) await ouvrirSauvegarde(fichier);
    },
  });
  document.body.append(entree);
  entree.click();
}

async function ouvrirSauvegarde(fichier) {
  const t = toast('Lecture du fichier…', [], 0);
  let data;
  try {
    data = JSON.parse(await fichier.text());
  } catch (_) {
    t.fermer();
    return toast('Ce fichier n’est pas lisible. Choisissez une sauvegarde du carnet.', [], 8000);
  }
  t.fermer();

  if (!data || data.format !== FORMAT_SAUVEGARDE || !Array.isArray(data.lieux)) {
    return toast('Ce fichier n’est pas une sauvegarde du carnet.', [], 8000);
  }

  const c = data.compte || {};
  const dejaLa = etat.lieux.size > 0 || etat.evenements.length > 0;

  ouvrirFeuille({
    titre: 'Restaurer',
    corps: (f) => h('div', null,
      h('p', { style: { marginTop: 0, fontFamily: 'var(--police-texte)', fontSize: '1.02rem' } },
        'Sauvegarde du ' + (data.genere_le ? formatDateCourte(data.genere_le.slice(0, 10)) : '?')
        + ' : ' + (c.lieux || 0) + ' lieux, ' + (c.evenements || 0) + ' entrées, '
        + (c.photos || 0) + ' photos.'),

      h('button', {
        class: 'bouton',
        onclick: () => f.fermer(false, () => appliquerSauvegarde(data, 'fusion')),
      }, 'Ajouter ce qui manque'),
      h('div', { class: 'aide', style: { marginBottom: '1rem' } },
        'Rien n’est supprimé. Seuls les éléments absents du carnet actuel sont ajoutés.'),

      h('button', {
        class: 'bouton bouton--danger',
        onclick: async () => {
          if (dejaLa && !await confirmer({
            titre: 'Tout remplacer',
            message: 'Le contenu actuel du carnet — ' + etat.lieux.size + ' lieux et '
              + etat.evenements.length + ' entrées — sera effacé et remplacé par cette sauvegarde. '
              + 'C’est sans retour : la corbeille ne récupère pas cette opération.',
            labelOk: 'Effacer et remplacer', danger: true,
          })) return;
          f.fermer(false, () => appliquerSauvegarde(data, 'remplacement'));
        },
      }, 'Tout remplacer'),
      h('div', { class: 'aide' },
        'Le carnet actuel est effacé, puis la sauvegarde est écrite à sa place.'),
    ),
  });
}

async function appliquerSauvegarde(data, mode) {
  const t = toast('Restauration…', [], 0);
  const dire = (m) => { const z = t.el.querySelector('.toast__texte'); if (z) z.textContent = m; };

  try {
    if (mode === 'remplacement') {
      dire('Effacement du carnet actuel…');
      await ecrire(['lieux', 'evenements', 'photos'], (s) => {
        s.lieux.clear(); s.evenements.clear(); s.photos.clear();
      });
    }

    const existants = mode === 'fusion'
      ? { lieux: new Set(etat.lieux.keys()), evs: new Set(etat.evenements.map((e) => e.id)) }
      : { lieux: new Set(), evs: new Set() };

    dire('Lieux et entrées…');
    const lieuxAEcrire = (data.lieux || []).filter((l) => l && l.id && !existants.lieux.has(l.id));
    const evsAEcrire = (data.evenements || []).filter((e) => e && e.id && !existants.evs.has(e.id));
    await ecrire(['lieux', 'evenements'], (s) => {
      for (const l of lieuxAEcrire) s.lieux.put(l);
      for (const e of evsAEcrire) s.evenements.put(e);
    });

    // Les photos par paquets : une transaction géante tiendrait mal sur mobile.
    const photos = data.photos || [];
    let ecrites = 0;
    for (let i = 0; i < photos.length; i += 40) {
      const lot = photos.slice(i, i + 40);
      dire('Photos ' + Math.min(i + lot.length, photos.length) + ' sur ' + photos.length + '…');
      const prets = lot.map((p) => ({
        id: p.id, type_mime: p.type_mime, largeur: p.largeur, hauteur: p.hauteur,
        poids: p.poids, cree_le: p.cree_le, parent_id: p.parent_id,
        blob: p.blob ? base64EnBlob(p.blob, p.type_mime) : null,
        vignette: p.vignette ? base64EnBlob(p.vignette, p.type_mime) : null,
      })).filter((p) => p.id);
      await ecrire('photos', (s) => { for (const p of prets) s.photos.put(p); });
      ecrites += prets.length;
    }

    // Réglages : on complète sans écraser, et le jeton en place est préservé.
    if (data.prefs) {
      dire('Réglages…');
      for (const [cle, valeur] of Object.entries(data.prefs)) {
        if (cle === 'github') {
          const actuel = etat.prefs.github || {};
          await ecrirePref('github', { ...valeur, token: actuel.token || '' });
          continue;
        }
        if (mode === 'remplacement' || etat.prefs[cle] === undefined) {
          await ecrirePref(cle, valeur);
        }
      }
    }

    await chargerEtat();
    etat.filtres = videsFiltres();
    etat.vue = { nom: 'journal' };
    rendre();
    t.fermer();
    toast('Restauré : ' + lieuxAEcrire.length + ' lieux, ' + evsAEcrire.length
      + ' entrées, ' + ecrites + ' photos.', [], 9000);
  } catch (err) {
    t.fermer();
    console.error(err);
    await chargerEtat().catch(() => {});
    rendre();
    toast(messageErreurEcriture(err), [], 9000);
  }
}

/* ==========================================================================
   CARTE ET STATISTIQUES (phase 4)

   Pas de fond de plan : les tuiles d'une carte classique se téléchargent au
   runtime, et une carte qui attend le réseau est morte en voyage. On dessine
   donc la constellation des lieux sur une toile vide, avec une échelle pour
   donner la mesure et le tracé chronologique pour donner le sens.

   Elle ne dégrade pas hors ligne : il n'y a rien à dégrader.
   ========================================================================== */

const A_UNE_POSITION = (l) => Number.isFinite(l.latitude) && Number.isFinite(l.longitude);

function statistiquesVoyage() {
  const lieux = lieuxVivants();
  const evs = evenementsVivants();
  const dates = evs.map((e) => e.date).sort();

  // Kilomètres à vol d'oiseau entre lieux successifs, dans l'ordre de la
  // première visite : ce n'est pas la distance parcourue, c'est son ombre.
  const ordonnes = lieux.filter(A_UNE_POSITION).map((l) => {
    const siens = evs.filter((e) => e.lieu_id === l.id).map((e) => e.date).sort();
    return { l, premier: siens[0] || l.cree_le || '' };
  }).sort((a, b) => (a.premier < b.premier ? -1 : 1));

  let metres = 0;
  for (let i = 1; i < ordonnes.length; i++) {
    metres += distance(
      ordonnes[i - 1].l.latitude, ordonnes[i - 1].l.longitude,
      ordonnes[i].l.latitude, ordonnes[i].l.longitude);
  }

  return {
    lieux: lieux.length,
    villes: new Set(lieux.map((l) => l.ville).filter(Boolean)).size,
    pays: new Set(lieux.map((l) => l.pays).filter(Boolean)).size,
    entrees: evs.length,
    jours: new Set(dates).size,
    etendue: dates.length ? nbJours(dates[0], dates[dates.length - 1]) : 0,
    premier: dates[0] || null,
    dernier: dates[dates.length - 1] || null,
    kilometres: Math.round(metres / 1000),
    ordonnes,
  };
}

/**
 * Projette des lieux dans un carré normalisé, en respectant les proportions
 * du terrain : un degré de longitude est plus court qu'un degré de latitude
 * dès qu'on s'éloigne de l'équateur.
 */
/** Projection de Mercator sphérique, en pixels « monde » (256 px au zoom 0). */
function versMondePx(lat, lon, zoom) {
  const n = 256 * Math.pow(2, zoom);
  const s = Math.sin(Math.max(-85, Math.min(85, lat)) * Math.PI / 180);
  return {
    x: (lon + 180) / 360 * n,
    y: (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n,
  };
}

/**
 * Cadre la constellation des lieux. Mercator, et non plus une projection
 * maison : c'est la seule qui s'aligne avec des tuiles de carte, et elle garde
 * des pixels carrés — donc une échelle honnête.
 */
function projeterLieux(lieux, aspect) {
  const brut = lieux.map((l) => versMondePx(l.latitude, l.longitude, 0));
  let x0 = Math.min(...brut.map((p) => p.x)), x1 = Math.max(...brut.map((p) => p.x));
  let y0 = Math.min(...brut.map((p) => p.y)), y1 = Math.max(...brut.map((p) => p.y));

  // Un lieu unique, ou plusieurs confondus : fenêtre d'environ 600 m.
  const MINI = 0.004;
  if (x1 - x0 < MINI) { const c = (x0 + x1) / 2; x0 = c - MINI / 2; x1 = c + MINI / 2; }
  if (y1 - y0 < MINI) { const c = (y0 + y1) / 2; y0 = c - MINI / 2; y1 = c + MINI / 2; }

  // Zoom entier le plus proche pour occuper ~900 px de large, marge comprise.
  let zoom = Math.floor(Math.log2(900 / ((x1 - x0) * 1.35)));
  zoom = Math.max(0, Math.min(18, zoom));
  const e = Math.pow(2, zoom);

  let rx0 = x0 * e, rx1 = x1 * e, ry0 = y0 * e, ry1 = y1 * e;
  const marge = 0.16;
  const mx = (rx1 - rx0) * marge, my = (ry1 - ry0) * marge;
  rx0 -= mx; rx1 += mx; ry0 -= my; ry1 += my;

  // On étire la plus petite dimension pour épouser le cadre sans déformer.
  let dx = rx1 - rx0, dy = ry1 - ry0;
  if (dx / dy < aspect) { const v = (dy * aspect - dx) / 2; rx0 -= v; rx1 += v; }
  else { const v = (dx / aspect - dy) / 2; ry0 -= v; ry1 += v; }
  dx = rx1 - rx0; dy = ry1 - ry0;

  const latMoy = lieux.reduce((s, l) => s + l.latitude, 0) / lieux.length;

  return {
    points: lieux.map((l) => {
      const p = versMondePx(l.latitude, l.longitude, zoom);
      return { lieu: l, x: (p.x - rx0) / dx, y: (p.y - ry0) / dy };
    }),
    // En Mercator, l'échelle dépend de la latitude.
    metresParUnite: 156543.03392 * Math.cos(latMoy * Math.PI / 180) / e,
    largeurVirtuelle: dx,
    zoom,
    rect: { x0: rx0, y0: ry0, x1: rx1, y1: ry1 },
  };
}

/**
 * Les tuiles qui couvrent le cadre, positionnées en pourcentages : la carte
 * reste juste quelle que soit la largeur réelle du conteneur.
 */
function tuilesDuCadre(rect, zoom, maximum = 40) {
  const n = Math.pow(2, zoom);
  const dx = rect.x1 - rect.x0, dy = rect.y1 - rect.y0;
  const tuiles = [];

  for (let ty = Math.floor(rect.y0 / 256); ty <= Math.floor((rect.y1 - 1e-6) / 256); ty++) {
    if (ty < 0 || ty >= n) continue;                 // au-delà des pôles
    for (let tx = Math.floor(rect.x0 / 256); tx <= Math.floor((rect.x1 - 1e-6) / 256); tx++) {
      if (tuiles.length >= maximum) return tuiles;
      tuiles.push({
        z: zoom, x: ((tx % n) + n) % n, y: ty,       // la longitude fait le tour
        gauche: (tx * 256 - rect.x0) / dx * 100,
        haut: (ty * 256 - rect.y0) / dy * 100,
        largeur: 256 / dx * 100,
        hauteur: 256 / dy * 100,
      });
    }
  }
  return tuiles;
}

/** Choisit une longueur d'échelle ronde : 1, 2 ou 5 fois une puissance de dix. */
function barreEchelle(metresParUnite, largeurVirtuelle) {
  const cible = metresParUnite * largeurVirtuelle * 0.3;
  const puissance = Math.pow(10, Math.floor(Math.log10(cible)));
  const rond = [1, 2, 5, 10].map((f) => f * puissance).filter((v) => v <= cible * 1.3).pop() || puissance;
  return {
    metres: rond,
    fraction: rond / (metresParUnite * largeurVirtuelle),
    libelle: rond >= 1000 ? (rond / 1000).toLocaleString('fr-FR') + ' km' : rond + ' m',
  };
}

const EST_APPLE = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent);
function lienCarteExterne(lieu) {
  const nom = encodeURIComponent(nomLieu(lieu) || 'Lieu');
  return EST_APPLE
    ? 'https://maps.apple.com/?ll=' + lieu.latitude + ',' + lieu.longitude + '&q=' + nom
    : 'geo:' + lieu.latitude + ',' + lieu.longitude + '?q=' + lieu.latitude + ',' + lieu.longitude + '(' + nom + ')';
}

function vueCarte() {
  const frag = document.createDocumentFragment();
  const st = statistiquesVoyage();

  /* --- les chiffres du voyage --- */
  frag.append(h('div', { class: 'stats' },
    [
      [st.lieux, st.lieux > 1 ? 'lieux' : 'lieu'],
      [st.villes, st.villes > 1 ? 'villes' : 'ville'],
      [st.pays, st.pays > 1 ? 'pays' : 'pays'],
      [st.jours, st.jours > 1 ? 'jours notés' : 'jour noté'],
    ].map(([n, mot]) => h('div', { class: 'stat' },
      h('div', { class: 'stat__n' }, String(n)),
      h('div', { class: 'stat__mot' }, mot))),
  ));

  if (st.premier) {
    frag.append(h('p', { class: 'bloc__note', style: { marginTop: '0.2rem' } },
      'Du ' + formatDateCourte(st.premier) + ' au ' + formatDateCourte(st.dernier)
      + ', soit ' + st.etendue + (st.etendue > 1 ? ' jours' : ' jour')
      + ' — ' + st.entrees + (st.entrees > 1 ? ' entrées' : ' entrée')
      + (st.kilometres ? ', et ' + st.kilometres.toLocaleString('fr-FR')
        + ' km à vol d’oiseau entre vos lieux.' : '.')));
  }

  /* --- la carte --- */
  const avecPosition = lieuxVivants().filter(A_UNE_POSITION);
  const villes = [...new Set(avecPosition.map((l) => l.ville).filter(Boolean))].sort(
    (a, b) => a.localeCompare(b, 'fr'));
  const filtreVille = etat.vue.ville || '';
  const affiches = filtreVille ? avecPosition.filter((l) => l.ville === filtreVille) : avecPosition;

  frag.append(h('div', { class: 'sous-titre' }, 'Carte'));

  if (!avecPosition.length) {
    frag.append(h('div', { class: 'vide' },
      h('div', { class: 'vide__trait', style: { background: 'var(--reglure)' } }),
      h('h2', null, 'Aucun lieu n’a de position.'),
      h('p', null, 'Les prochaines photos prises dehors en poseront une toute seule.')));
    return frag;
  }

  if (villes.length > 1) {
    const sel = h('select', {
      onchange: (e) => majVue({ nom: 'carte', ville: e.target.value }),
    },
      h('option', { value: '', selected: !filtreVille }, 'Tout le voyage'),
      villes.map((v) => h('option', { value: v, selected: filtreVille === v }, v)));
    frag.append(h('div', { class: 'champ', style: { padding: '0 1rem' } }, sel));
  }

  const ASPECT = 4 / 3;
  const { points, metresParUnite, largeurVirtuelle, zoom, rect } = projeterLieux(affiches, ASPECT);
  const echelle = barreEchelle(metresParUnite, largeurVirtuelle);

  const toile = h('div', { class: 'toile' });

  /* --- le fond de plan, si le réseau est autorisé et présent --- */
  const avecFond = reseauUtilisable();
  if (avecFond) {
    for (const t of tuilesDuCadre(rect, zoom)) {
      toile.append(h('img', {
        class: 'tuile', alt: '', loading: 'lazy', decoding: 'async',
        src: 'https://tile.openstreetmap.org/' + t.z + '/' + t.x + '/' + t.y + '.png',
        style: {
          left: t.gauche + '%', top: t.haut + '%',
          width: t.largeur + '%', height: t.hauteur + '%',
        },
        // Une tuile qui ne vient pas s'efface : la trame reprend sa place.
        onerror: (e) => e.target.remove(),
      }));
    }
    toile.append(h('div', { class: 'attribution' }, '© OpenStreetMap'));
  }

  // Le tracé chronologique, en dessous et sans interception du toucher.
  const suite = st.ordonnes.map((o) => points.find((p) => p.lieu.id === o.l.id)).filter(Boolean);
  if (suite.length > 1) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 100 ' + (100 / ASPECT).toFixed(3));
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('class', 'toile__trace');
    svg.setAttribute('aria-hidden', 'true');
    const ligne = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    ligne.setAttribute('points', suite.map((p) =>
      (p.x * 100).toFixed(2) + ',' + (p.y * 100 / ASPECT).toFixed(2)).join(' '));
    svg.append(ligne);
    toile.append(svg);
  }

  for (const p of points) {
    const n = evenementsVivants().filter((e) => e.lieu_id === p.lieu.id).length;
    toile.append(h('button', {
      class: 'point',
      style: { left: (p.x * 100) + '%', top: (p.y * 100) + '%' },
      'aria-label': (nomLieu(p.lieu) || 'Lieu sans nom')
        + (p.lieu.ville ? ', ' + p.lieu.ville : '') + ' — ' + n + ' entrée(s)',
      onclick: () => naviguer({ nom: 'lieu', lieu_id: p.lieu.id }),
    },
      h('span', { class: 'point__rond' }),
      points.length <= 12
        ? h('span', { class: 'point__nom' }, nomLieu(p.lieu) || 'sans nom')
        : null,
    ));
  }

  toile.append(h('div', { class: 'echelle' },
    h('div', { class: 'echelle__barre', style: { width: (echelle.fraction * 100) + '%' } }),
    h('div', { class: 'echelle__mot' }, echelle.libelle)));

  frag.append(h('div', { style: { padding: '0 1rem' } }, toile));

  // Combien de lieux se confondent visuellement à cette échelle ?
  const CONFUSION = 0.022;
  const superposes = points.filter((a) => points.some((b) =>
    b !== a && Math.abs(a.x - b.x) < CONFUSION && Math.abs(a.y - b.y) < CONFUSION)).length;

  frag.append(h('p', { class: 'bloc__note' },
    affiches.length + (affiches.length > 1 ? ' lieux placés' : ' lieu placé')
    + (suite.length > 1 ? ', reliés dans l’ordre de la première visite' : '')
    + '. Touchez un point pour ouvrir sa fiche.',
    superposes > 1
      ? ' À cette échelle, ' + superposes + ' d’entre eux se superposent'
        + (villes.length > 1 ? ' — choisissez une ville ci-dessus pour les séparer.' : '.')
      : '',
    avecFond ? '' : ' Sans réseau, la carte reste utilisable : seul le fond de plan manque.'));

  if (!avecFond) {
    frag.append(h('div', { style: { padding: '0.2rem 1rem 0' } },
      h('button', {
        class: 'bouton bouton--calme',
        onclick: async () => { if (await autoriserReseau()) rendre(); },
      }, 'Afficher le fond de plan')));
  }

  /* --- la liste, pour ouvrir dans Plans --- */
  frag.append(h('div', { class: 'sous-titre' }, 'Ouvrir ailleurs'));
  for (const l of affiches.slice(0, 60)) {
    frag.append(h('a', {
      class: 'rangee', href: lienCarteExterne(l), target: '_blank', rel: 'noopener',
      style: { textDecoration: 'none', color: 'inherit' },
    },
      h('div', { class: 'rangee__texte' },
        h('div', { class: 'rangee__titre' }, nomLieu(l) || 'Lieu sans nom'),
        h('div', { class: 'rangee__sous' }, [l.type, l.ville].filter(Boolean).join(', '))),
      h('div', { class: 'rangee__droite' }, 'Plans'),
    ));
  }
  return frag;
}

/**
 * Fabrique une photo plausible sans rien télécharger : des bandes de couleur
 * et quelques formes, encodées par la même chaîne que les vraies photos.
 */
async function photoExemple(graine) {
  const c = document.createElement('canvas');
  c.width = 1200; c.height = 900;
  const ctx = c.getContext('2d');

  // Un générateur déterministe : la même graine redonne la même image.
  let n = graine * 9301 + 49297;
  const alea = () => { n = (n * 9301 + 49297) % 233280; return n / 233280; };

  const teinte = Math.floor(alea() * 360);
  const ciel = ctx.createLinearGradient(0, 0, 0, c.height);
  ciel.addColorStop(0, 'hsl(' + teinte + ' 45% 78%)');
  ciel.addColorStop(1, 'hsl(' + ((teinte + 40) % 360) + ' 35% 55%)');
  ctx.fillStyle = ciel;
  ctx.fillRect(0, 0, c.width, c.height);

  const horizon = c.height * (0.55 + alea() * 0.2);
  ctx.fillStyle = 'hsl(' + ((teinte + 200) % 360) + ' 25% ' + (22 + alea() * 12) + '%)';
  ctx.beginPath();
  ctx.moveTo(0, horizon);
  for (let x = 0; x <= c.width; x += c.width / 6) {
    ctx.lineTo(x, horizon - alea() * 120);
  }
  ctx.lineTo(c.width, c.height);
  ctx.lineTo(0, c.height);
  ctx.closePath();
  ctx.fill();

  ctx.globalAlpha = 0.85;
  for (let i = 0; i < 3 + Math.floor(alea() * 3); i++) {
    ctx.fillStyle = 'hsl(' + ((teinte + 160 + i * 25) % 360) + ' 40% ' + (35 + i * 8) + '%)';
    const l = 60 + alea() * 160;
    ctx.fillRect(alea() * (c.width - l), horizon - alea() * 200, l, c.height);
  }
  ctx.globalAlpha = 1;

  const type = await detecterFormat();
  const grand = dessiner(c, PHOTO_MAX_PX);
  const petit = dessiner(c, VIGNETTE_MAX_PX);
  const blob = await versBlob(grand, type, PHOTO_QUALITE);
  const vignette = await versBlob(petit, type, PHOTO_QUALITE);
  const id = uid();
  return {
    enregistrement: {
      id, blob, vignette, type_mime: type,
      largeur: grand.width, hauteur: grand.height, poids: blob.size,
      cree_le: new Date().toISOString(), parent_id: null, exemple: true,
    },
    reference: { id, l: grand.width, h: grand.height },
  };
}

async function retirerExemples() {
  const lieux = [...etat.lieux.values()].filter((l) => l.exemple);
  const evs = etat.evenements.filter((e) => e.exemple);
  if (!lieux.length && !evs.length) return toast('Aucune donnée d’exemple.');

  if (!await confirmer({
    titre: 'Retirer les exemples',
    message: lieux.length + ' lieux et ' + evs.length + ' entrées d’exemple seront '
      + 'effacés définitivement, avec leurs photos. Vos vraies entrées ne sont pas touchées.',
    labelOk: 'Retirer', danger: true,
  })) return;

  const t = toast('Nettoyage…', [], 0);
  try {
    const photos = (await lireTout('photos')).filter((p) => p.exemple);
    await ecrire(['photos', 'lieux', 'evenements'], (s) => {
      for (const p of photos) s.photos.delete(p.id);
      for (const e of evs) s.evenements.delete(e.id);
      for (const l of lieux) s.lieux.delete(l.id);
    });
    await chargerEtat();
    etat.filtres = videsFiltres();
    rendre();
    t.fermer();
    toast('Données d’exemple retirées.');
  } catch (err) {
    t.fermer();
    toast(messageErreurEcriture(err), [], 9000);
  }
}

/** Affiche noir sur blanc si le code affiché est en retard sur le cache. */
async function decrireVersion() {
  const v = await versionDuServiceWorker();
  const zone = $('#zone-version');
  if (!zone || !v) return;
  if (v === VERSION_APP) return;
  zone.textContent = '';
  zone.append(
    'Cette page fait tourner ' + VERSION_APP + ', mais ' + v
    + ' est déjà installée. Rechargez pour l’utiliser.',
  );
}

function arrondiLisible(v) {
  if (!Number.isFinite(v)) return '?';
  if (v >= 100) return v.toFixed(0);
  if (v >= 1) return v.toFixed(2);
  return v.toPrecision(3);
}

async function decrireStockage() {
  const zone = $('#zone-stockage');
  if (!zone) return;
  const nbPhotos = (await lireTout('photos').catch(() => [])).length;
  let texte = nbPhotos + (nbPhotos > 1 ? ' photos' : ' photo') + ' · '
    + lieuxVivants().length + ' lieux · ' + evenementsVivants().length + ' entrées';
  if (navigator.storage && navigator.storage.estimate) {
    try {
      const { usage, quota } = await navigator.storage.estimate();
      if (usage && quota) {
        texte += ' — ' + (usage / 1048576).toFixed(1) + ' Mo utilisés sur '
          + (quota / 1048576).toFixed(0) + ' Mo disponibles';
      }
    } catch (_) {}
  }
  let persiste = null;
  if (navigator.storage && navigator.storage.persisted) {
    try { persiste = await navigator.storage.persisted(); } catch (_) {}
  }
  zone.textContent = '';
  zone.append(h('p', { class: 'note-info', style: { margin: 0 } }, texte,
    persiste === false
      ? " Le navigateur peut effacer ces données s'il manque de place : installez l'app sur l'écran d'accueil pour l'en empêcher."
      : persiste === true ? ' Stockage protégé contre l’effacement automatique.' : ''));
}

  « retour » du téléphone ferme la feuille plutôt que de quitter l'app).

function ouvrirFeuille({ titre, corps, valider, labelValider }) {
  const f = { ferme: false };

  /** `puis` : ce qu'il faut faire une fois la feuille vraiment refermée. */
  const fermer = (viaPop, puis) => {
    if (f.ferme) { if (puis) setTimeout(puis, 0); return; }
    f.ferme = true;
    f.voile.remove();
    const i = feuillesOuvertes.indexOf(f);
    if (i >= 0) feuillesOuvertes.splice(i, 1);
    if (puis) apresPops.push(puis);
    if (!viaPop) { popsAIgnorer++; history.back(); }
    else if (popsAIgnorer === 0) viderApresPops();
  };
  f.fermer = fermer;

  const boiteCorps = h('div', { class: 'feuille__corps' });

  const feuille = h('div', { class: 'feuille', role: 'dialog', 'aria-modal': 'true', 'aria-label': titre },
    h('div', { class: 'feuille__entete' },
      h('button', { onclick: () => fermer() }, valider ? 'Annuler' : 'Fermer'),
      h('div', { class: 'feuille__titre' }, titre),
      valider
        ? h('button', {
          class: 'principal',
          onclick: async () => {
            // `valider` peut renvoyer une fonction : elle sera exécutée après
            // la fermeture, jamais pendant (voir la note sur l'historique).
            const r = await valider(boiteCorps);
            if (r === false) return;
            fermer(false, typeof r === 'function' ? r : null);
          },
        }, labelValider || 'Enregistrer')
        : h('span'),
    ),
    boiteCorps,
  );

  const voile = h('div', { class: 'voile', onclick: (e) => { if (e.target === voile) fermer(); } }, feuille);
  f.voile = voile;
  boiteCorps.append(corps(f));

  $('#feuilles').append(voile);
  feuillesOuvertes.push(f);
  history.pushState({ feuille: true }, '');
  return f;
}

/** Confirmation explicite. Toute suppression passe par là, sans exception. */
function confirmer({ titre, message, labelOk, danger }) {
  return new Promise((resoudre) => {
    let decide = false;
    const f = ouvrirFeuille({
      titre,
      corps: () => h('div', null,
        h('p', { style: { marginTop: 0, fontFamily: 'var(--police-texte)', fontSize: '1.02rem' } }, message),
        h('button', {
          class: 'bouton ' + (danger ? 'bouton--danger' : ''),
          onclick: () => { decide = true; f.fermer(); resoudre(true); },
        }, labelOk),
        h('button', { class: 'bouton bouton--calme', onclick: () => f.fermer() }, 'Annuler'),
      ),
    });
    // Fermeture par le voile ou par le bouton retour = refus.
    const observer = setInterval(() => {
      if (f.ferme) { clearInterval(observer); if (!decide) resoudre(false); }
    }, 120);
  });
}

function feuilleTaux(deviseExistante) {
  const taux = etat.prefs.taux || {};
  let champDevise, champVersEur, champDepuisEur;

  const synchro = (source) => {
    if (source === 'vers') {
      const v = nombre(champVersEur.value);
      champDepuisEur.value = Number.isFinite(v) && v > 0 ? arrondiLisible(1 / v) : '';
    } else {
      const v = nombre(champDepuisEur.value);
      champVersEur.value = Number.isFinite(v) && v > 0 ? Number((1 / v).toPrecision(8)) : '';
    }
  };

  ouvrirFeuille({
    titre: deviseExistante ? 'Taux ' + deviseExistante : 'Nouveau taux',
    corps: (f) => {
      champDevise = h('input', {
        type: 'text', value: deviseExistante || '', placeholder: 'JPY',
        list: 'l-devises', maxlength: '6', autocapitalize: 'characters', autocomplete: 'off',
        disabled: !!deviseExistante,
      });
      champVersEur = h('input', {
        type: 'text', inputmode: 'decimal',
        value: deviseExistante ? String(taux[deviseExistante]) : '',
        oninput: () => synchro('vers'),
      });
      champDepuisEur = h('input', {
        type: 'text', inputmode: 'decimal',
        value: deviseExistante ? arrondiLisible(1 / taux[deviseExistante]) : '',
        oninput: () => synchro('depuis'),
      });
      return h('div', null,
        h('div', { class: 'champ' }, h('label', null, 'Devise'), champDevise,
          h('datalist', { id: 'l-devises' }, DEVISES_COURANTES.map((d) => h('option', { value: d })))),
        h('div', { class: 'champ' },
          h('label', null, '1 unité de cette devise vaut, en euros'), champVersEur),
        h('div', { class: 'champ' },
          h('label', null, 'Ou, dans l’autre sens : 1 € vaut'), champDepuisEur,
          h('div', { class: 'aide' }, 'Les deux champs se répondent. Saisissez celui que vous avez sous les yeux.')),
        deviseExistante ? h('button', {
          class: 'bouton bouton--danger',
          onclick: async () => {
            const t = { ...(etat.prefs.taux || {}) };
            delete t[deviseExistante];
            await ecrirePref('taux', t);
            f.fermer();
            rendre();
          },
        }, 'Oublier ce taux') : null,
        h('p', { class: 'note-info' },
          'Modifier un taux ici ne change aucune entrée déjà enregistrée : chacune garde le taux du jour où vous l’avez saisie.'),
      );
    },
    valider: async () => {
      const d = (deviseExistante || champDevise.value).trim().toUpperCase();
      const v = nombre(champVersEur.value);
      if (!d) { toast('Indiquez le code de la devise, par exemple JPY.'); return false; }
      if (!Number.isFinite(v) || v <= 0) { toast('Le taux doit être un nombre supérieur à zéro.'); return false; }
      await ecrirePref('taux', { ...(etat.prefs.taux || {}), [d]: v });
      rendre();
      return true;
    },
  });
}

/* ==========================================================================
   SAISIE RAPIDE

   Objectif : enregistrer quelque chose en moins de cinq secondes, debout dans
   la rue, à une main, sans réseau. Tout ce qui peut être déduit l'est ; tout
   ce qui manque s'ajoute le soir.
   ========================================================================== */

let positionEnCours = null;

/** Demande la position sans jamais bloquer : le résultat arrivera ou pas. */
function demanderPosition({ frais } = {}) {
  if (!navigator.geolocation) return Promise.resolve(null);
  positionEnCours = new Promise((resoudre) => {
    navigator.geolocation.getCurrentPosition(
      (p) => {
        const pos = { latitude: p.coords.latitude, longitude: p.coords.longitude, precision: p.coords.accuracy };
        ecrirePref('derniere_position', { ...pos, quand: Date.now() }).catch(() => {});
        resoudre(pos);
      },
      () => resoudre(null),               // refus, panne, intérieur d'un bâtiment : on continue
      { enableHighAccuracy: true, timeout: 12000, maximumAge: frais ? 0 : 60000 },
    );
  });
  return positionEnCours;
}

/** Le chemin le plus court : appareil photo, puis tout est déduit. */
function saisirParPhoto() {
  demanderPosition();                      // en parallèle de l'ouverture de l'appareil
  const entree = $('#entree-camera');
  entree.value = '';
  entree.click();
}

$('#entree-camera').addEventListener('change', async (e) => {
  const fichier = e.target.files && e.target.files[0];
  e.target.value = '';
  if (fichier) await enregistrerCapture(fichier);
});

async function enregistrerCapture(fichier) {
  const t = toast('Enregistrement…', [], 0);
  try {
    const alerte = await verifierEspace();
    if (alerte) toast(alerte);

    const photo = await preparerPhoto(fichier);

    // On n'attend la position que le temps qu'il faut pour rester rapide.
    const position = await Promise.race([
      positionEnCours || Promise.resolve(null),
      delai(2500).then(() => null),
    ]);

    const { lieu, nouveau } = trouverOuPreparerLieu(position);
    const maintenant = new Date();
    const evenement = nouvelEvenement({
      lieu_id: lieu.id,
      type: 'visite',
      date: isoLocal(maintenant),
      heure: heureLocale(maintenant),
      photos: [photo.reference],
    });
    photo.enregistrement.parent_id = evenement.id;

    // Une seule transaction : la photo, le lieu et l'entrée arrivent ensemble
    // ou pas du tout. Pas de photo orpheline, pas d'entrée sans image.
    await ecrire(['photos', 'lieux', 'evenements'], (s) => {
      s.photos.put(photo.enregistrement);
      if (nouveau) s.lieux.put(lieu);
      s.evenements.put(evenement);
    });

    if (nouveau) etat.lieux.set(lieu.id, lieu);
    etat.evenements.unshift(evenement);
    etat.evenements.sort(triChronoDesc);
    idNouvelleLigne = evenement.id;
    if (etat.vue.nom !== 'journal' && etat.vue.nom !== 'lieu') etat.vue = { nom: 'journal' };
    rendre();

    t.fermer();
    annoncerAjout(evenement, lieu, nouveau);

    // Si la position arrive en retard, elle complète le lieu sans rien écraser.
    completerPositionPlusTard(lieu, position);
    if (nouveau) enrichirEnArrierePlan(lieu.id);
  } catch (err) {
    t.fermer();
    console.error(err);
    if (err && err.message === 'pas-une-image') toast("Ce fichier n'est pas une image.");
    else if (err && err.message === 'image-illisible') toast("Cette photo n'a pas pu être lue. Réessayez.");
    else toast(messageErreurEcriture(err));
  }
}

function annoncerAjout(evenement, lieu, nouveau) {
  const message = nouveau
    ? 'Enregistré' + (etat.prefs.ville_courante && etat.prefs.ville_courante.ville
      ? ' à ' + etat.prefs.ville_courante.ville : '')
    : 'Ajouté à ' + (nomLieu(lieu) || 'un lieu déjà connu');

  toast(message, [
    { label: nouveau ? 'Nommer' : 'Changer', action: () => nouveau ? feuilleLieu(lieu) : choisirLieu(evenement) },
    { label: 'Annuler', action: () => annulerAjout(evenement, nouveau ? lieu : null) },
  ], 7000);
}

/** Annulation immédiate d'une capture : elle n'a jamais eu lieu, pas de corbeille. */
async function annulerAjout(evenement, lieu) {
  try {
    await ecrire(['photos', 'lieux', 'evenements'], (s) => {
      for (const p of evenement.photos || []) s.photos.delete(typeof p === 'string' ? p : p.id);
      s.evenements.delete(evenement.id);
      if (lieu) s.lieux.delete(lieu.id);
    });
    etat.evenements = etat.evenements.filter((e) => e.id !== evenement.id);
    if (lieu) etat.lieux.delete(lieu.id);
    rendre();
    toast('Annulé.');
  } catch (err) {
    toast(messageErreurEcriture(err));
  }
}

/**
 * Cherche un lieu déjà enregistré à moins de 100 m. Si on en trouve un, on s'y
 * rattache plutôt que de créer un doublon ; le toast dit lequel et permet d'en
 * changer d'un geste.
 */
function trouverOuPreparerLieu(position) {
  if (position) {
    let meilleur = null, meilleureDistance = Infinity;
    for (const l of lieuxVivants()) {
      if (!Number.isFinite(l.latitude) || !Number.isFinite(l.longitude)) continue;
      const d = distance(position.latitude, position.longitude, l.latitude, l.longitude);
      if (d < RAYON_LIEU_M && d < meilleureDistance) { meilleur = l; meilleureDistance = d; }
    }
    if (meilleur) return { lieu: meilleur, nouveau: false };
  }
  return { lieu: nouveauLieu(position), nouveau: true };
}

function nouveauLieu(position) {
  const ville = etat.prefs.ville_courante || {};
  return {
    id: uid(),
    nom: '',                       // nommé plus tard : ne pas ralentir la saisie
    type: 'autre',
    ville: ville.ville || '',
    pays: ville.pays || '',
    latitude: position ? position.latitude : null,
    longitude: position ? position.longitude : null,
    adresse: '',
    note: 0,
    commentaire: '',
    tags: [],
    photos: [],
    cree_le: new Date().toISOString(),
    supprime_le: null,
  };
}

function nouvelEvenement(champs) {
  return Object.assign({
    id: uid(),
    lieu_id: null,
    date: isoLocal(),
    heure: heureLocale(),
    type: 'visite',
    montant: null,
    devise: etat.prefs.devise_courante || 'EUR',
    taux_vers_eur: 1,
    categorie: '',
    beneficiaire: '',
    statut_achat: '',
    commentaire: '',
    photos: [],
    cree_le: new Date().toISOString(),
    supprime_le: null,
  }, champs);
}

/**
 * La géolocalisation peut mettre dix secondes en ville dense. Si elle arrive
 * après coup, on complète le lieu — sans jamais écraser une position déjà là.
 */
function completerPositionPlusTard(lieu, dejaObtenue) {
  if (dejaObtenue || !positionEnCours) return;
  positionEnCours.then(async (pos) => {
    if (!pos) return;
    const frais = etat.lieux.get(lieu.id);
    if (!frais || Number.isFinite(frais.latitude)) return;
    frais.latitude = pos.latitude;
    frais.longitude = pos.longitude;
    try {
      await ecrire('lieux', (s) => s.lieux.put(frais));
      if (etat.vue.nom === 'lieu') rendre();
      enrichirEnArrierePlan(lieu.id);
    } catch (_) { /* sans position, le lieu reste parfaitement utilisable */ }
  });
}

async function verifierEspace() {
  if (!navigator.storage || !navigator.storage.estimate) return null;
  try {
    const { usage, quota } = await navigator.storage.estimate();
    if (quota && usage / quota > 0.92) {
      return "Il reste peu de place sur le téléphone. Videz la corbeille avant que les photos ne soient refusées.";
    }
  } catch (_) {}
  return null;
}

/* ------------------------------------------- saisie d'un montant seul ----- */

function saisirMontant() {
  demanderPosition();
  const devise = etat.prefs.devise_courante || 'EUR';
  const taux = etat.prefs.taux || {};
  let champMontant, champDevise, apercu;
  let photoTicket = null;   // le ticket photographie, attache a la creation

  const rafraichir = () => {
    const m = nombre(champMontant.value);
    const d = champDevise.value.trim().toUpperCase() || 'EUR';
    const t = d === 'EUR' ? 1 : taux[d];
    apercu.textContent = (Number.isFinite(m) && d !== 'EUR' && t)
      ? '≈ ' + formatEuros(m * t)
      : (d !== 'EUR' && !t ? 'Taux inconnu — à saisir en enregistrant' : '');
  };

  const f = ouvrirFeuille({
    titre: 'Montant',
    labelValider: 'Enregistrer',
    corps: () => {
      champMontant = h('input', {
        type: 'text', inputmode: 'decimal', placeholder: '0',
        style: { fontSize: '1.6rem', fontFamily: 'var(--police-chiffres)', textAlign: 'right' },
        oninput: rafraichir,
      });
      champDevise = h('input', {
        type: 'text', value: devise, list: 'l-devises-2', maxlength: '6',
        autocapitalize: 'characters', autocomplete: 'off',
        style: { textAlign: 'center', fontFamily: 'var(--police-chiffres)' },
        oninput: rafraichir,
      });
      apercu = h('div', { class: 'aide', style: { textAlign: 'right' } });
      setTimeout(() => champMontant.focus(), 60);
      return h('div', null,
        h('div', { class: 'champ' },
          h('div', { class: 'duo', style: { gridTemplateColumns: '2fr 1fr' } }, champMontant, champDevise),
          h('datalist', { id: 'l-devises-2' },
            [...new Set([...Object.keys(taux), ...DEVISES_COURANTES])].map((d) => h('option', { value: d }))),
          apercu),
        h('p', { class: 'note-info' },
          'Le lieu est déduit de votre position. Vous pourrez préciser la catégorie et le bénéficiaire ce soir.'),
        boutonLireTicket(({ montant, devise }) => {
          champMontant.value = String(montant);
          if (devise) champDevise.value = devise;
          rafraichir();
        }, null, (prete) => { photoTicket = prete; }),
      );
    },
    valider: async () => {
      const m = nombre(champMontant.value);
      if (!Number.isFinite(m)) { toast('Saisissez un montant.'); return false; }
      const d = champDevise.value.trim().toUpperCase() || 'EUR';
      const t = d === 'EUR' ? 1 : (etat.prefs.taux || {})[d];
      if (!t) {
        // Une devise sans taux connu : on demande le taux maintenant, une fois.
        f.fermer(false, () => demanderTauxPuis(d, (tauxSaisi) => creerDepenseRapide(m, d, tauxSaisi, photoTicket)));
        return false;
      }
      await creerDepenseRapide(m, d, t, photoTicket);
      return true;
    },
  });
}

function demanderTauxPuis(devise, suite) {
  let champ;
  ouvrirFeuille({
    titre: 'Taux du jour',
    labelValider: 'Continuer',
    corps: () => {
      champ = h('input', { type: 'text', inputmode: 'decimal', placeholder: 'ex. 158' });
      setTimeout(() => champ.focus(), 60);
      return h('div', null,
        h('div', { class: 'champ' }, h('label', null, '1 € vaut combien de ' + devise + ' ?'), champ,
          h('div', { class: 'aide' }, 'Saisi une seule fois : il sera reproposé pour les prochains montants.')),
        h('p', { class: 'note-info' },
          'Le montant reste enregistré en ' + devise + ' pour toujours. L’euro n’est qu’un affichage.'),
      );
    },
    valider: async () => {
      const v = nombre(champ.value);
      if (!Number.isFinite(v) || v <= 0) { toast('Un nombre supérieur à zéro, par exemple 158.'); return false; }
      const versEur = 1 / v;
      await ecrirePref('taux', { ...(etat.prefs.taux || {}), [devise]: versEur });
      await suite(versEur);
      return true;
    },
  });
}

async function creerDepenseRapide(montant, devise, taux, photo) {
  try {
    const position = await Promise.race([
      positionEnCours || Promise.resolve(null),
      delai(2000).then(() => null),
    ]);
    const { lieu, nouveau } = trouverOuPreparerLieu(position);
    const maintenant = new Date();
    const ev = nouvelEvenement({
      lieu_id: lieu.id, type: 'depense',
      date: isoLocal(maintenant), heure: heureLocale(maintenant),
      montant, devise, taux_vers_eur: taux,
      photos: photo ? [photo.reference] : [],
    });
    if (photo) photo.enregistrement.parent_id = ev.id;

    // Une seule transaction : le ticket et sa dépense arrivent ensemble.
    await ecrire(['photos', 'lieux', 'evenements'], (s) => {
      if (photo) s.photos.put(photo.enregistrement);
      if (nouveau) s.lieux.put(lieu);
      s.evenements.put(ev);
    });
    await ecrirePref('devise_courante', devise);

    if (nouveau) etat.lieux.set(lieu.id, lieu);
    etat.evenements.unshift(ev);
    etat.evenements.sort(triChronoDesc);
    idNouvelleLigne = ev.id;
    if (etat.vue.nom !== 'journal' && etat.vue.nom !== 'lieu') etat.vue = { nom: 'journal' };
    rendre();
    annoncerAjout(ev, lieu, nouveau);
    completerPositionPlusTard(lieu, position);
    if (nouveau) enrichirEnArrierePlan(lieu.id);
  } catch (err) {
    console.error(err);
    toast(messageErreurEcriture(err));
  }
}

/* ------------------------------------------------- saisie d'une note ----- */

function saisirNote() {
  demanderPosition();
  Promise.race([positionEnCours, delai(2000).then(() => null)]).then((position) => {
    const { lieu, nouveau } = trouverOuPreparerLieu(position);
    const maintenant = new Date();
    const ev = nouvelEvenement({
      lieu_id: lieu.id, type: 'visite',
      date: isoLocal(maintenant), heure: heureLocale(maintenant),
    });
    // Rien n'est écrit tant que la feuille n'est pas validée.
    feuilleEvenement(ev, { creation: true, lieuANouveau: nouveau ? lieu : null });
  });
}

function feuilleEvenement(evOrigine, options = {}) {
  const creation = !!options.creation;
  const ev = { ...evOrigine, photos: [...(evOrigine.photos || [])] };
  let lieuCourant = options.lieuANouveau || etat.lieux.get(ev.lieu_id) || null;

      h('span', { class: 'legende' }, 'Type'),

          type: 'button', 'aria-pressed': ev.type === t ? 'true' : 'false',
          onclick: () => { collecter(); ev.type = t; redessiner(); },
        }, LIBELLE_EVENEMENT[t]))),
    ));

    /* --- lieu --- */
    boite.append(h('div', { class: 'champ' },
      h('span', { class: 'legende' }, 'Lieu'),
      h('button', {
        class: 'lien-lieu', type: 'button',
        onclick: () => {
          collecter();
          choisirLieu(ev, (l) => { lieuCourant = l; ev.lieu_id = l.id; redessiner(); });
        },
      },
        h('span', null,
          nomLieu(lieuCourant) || h('i', { style: { color: 'var(--graphite)' } }, 'Lieu sans nom'),
          lieuCourant && lieuCourant.ville
            ? h('span', { style: { color: 'var(--graphite)' } }, ' — ' + lieuCourant.ville) : null),
        h('span', { class: 'chevron' }, svg(ICONES.chevron))),
      lieuCourant && !creation ? h('div', { class: 'aide' },
        h('button', {
          type: 'button',
          style: { background: 'none', border: 0, color: 'var(--bille)', padding: 0, cursor: 'pointer' },
          onclick: () => {
            const f = feuillesOuvertes[feuillesOuvertes.length - 1];
            if (f) f.fermer(false, () => feuilleLieu(lieuCourant));
            else feuilleLieu(lieuCourant);
          },
        }, 'Modifier ce lieu')) : null,
    ));

    /* --- date et heure --- */
    champs.date = h('input', { type: 'date', value: ev.date });
    champs.heure = h('input', { type: 'time', value: ev.heure || '' });
    boite.append(h('div', { class: 'champ' },
      h('span', { class: 'legende' }, 'Quand'),
      h('div', { class: 'duo' }, champs.date, champs.heure)));

    /* --- argent : montant d'origine + taux, jamais la conversion --- */
    if (argent) {
      champs.montant = h('input', {
        type: 'text', inputmode: 'decimal',
        value: Number.isFinite(ev.montant) && ev.montant !== null ? String(ev.montant) : '',
        style: { fontFamily: 'var(--police-chiffres)', textAlign: 'right' },
        oninput: majApercu,
      });
      champs.devise = h('input', {
        type: 'text', value: ev.devise || 'EUR', list: 'l-devises-3',
        maxlength: '6', autocapitalize: 'characters', autocomplete: 'off',
        style: { fontFamily: 'var(--police-chiffres)', textAlign: 'center' },
        oninput: () => {
          const d = champs.devise.value.trim().toUpperCase();
          if (d && d !== 'EUR' && taux[d]) champs.taux.value = String(taux[d]);
          if (d === 'EUR') champs.taux.value = '1';
          majApercu();
        },
      });
      champs.taux = h('input', {
        type: 'text', inputmode: 'decimal',
        value: String(ev.taux_vers_eur ?? 1),
        style: { fontFamily: 'var(--police-chiffres)' },
        oninput: majApercu,
      });
      champs.apercu = h('div', { class: 'aide', style: { textAlign: 'right' } });

      boite.append(h('div', { class: 'champ' },
        h('span', { class: 'legende' }, 'Montant'),
        h('div', { class: 'duo', style: { gridTemplateColumns: '2fr 1fr' } }, champs.montant, champs.devise),
        h('datalist', { id: 'l-devises-3' },
          [...new Set([...Object.keys(taux), ...DEVISES_COURANTES])].map((d) => h('option', { value: d }))),
        champs.apercu,
        boutonLireTicket(({ montant, devise }) => {
          champs.montant.value = String(montant);
          if (devise) {
            champs.devise.value = devise;
            const connu = (etat.prefs.taux || {})[devise];
            if (devise === 'EUR') champs.taux.value = '1';
            else if (connu) champs.taux.value = String(connu);
          }
          majApercu();
        }, lieuCourant && lieuCourant.id, (prete) => {
          // Le ticket photographié rejoint l'entrée : la preuve reste avec la dépense.
          collecter();
          ev.photos.push(prete.reference);
          photosAAjouter.push(prete.enregistrement);
          redessiner();
        })));

      boite.append(h('div', { class: 'champ' },
        h('label', null, '1 unité de cette devise, en euros, le jour de la dépense'),
        champs.taux,
        h('div', { class: 'aide' },
          'Le montant reste enregistré dans sa devise d’origine, pour toujours. L’euro est recalculé à l’affichage.')));

      champs.categorie = h('select', null,
        h('option', { value: '' }, '—'),
        CATEGORIES.map((c) => h('option', { value: c, selected: ev.categorie === c }, c)));
      boite.append(h('div', { class: 'champ' }, h('label', null, 'Catégorie'), champs.categorie));
    }

    /* --- bénéficiaire : un achat pour quelqu'un reste une dépense --- */
    champs.beneficiaire = h('input', {
      type: 'text', value: ev.beneficiaire || '', list: 'l-benef',
      placeholder: 'Marie', autocomplete: 'off',
    });
    boite.append(h('div', { class: 'champ' },
      h('label', null, 'Pour qui ?'), champs.beneficiaire,
      h('datalist', { id: 'l-benef' }, tousLesBeneficiaires().map((b) => h('option', { value: b }))),
      h('div', { class: 'aide' }, 'Laissez vide si c’est pour vous.')));

    if (ev.type === 'achat') {
      boite.append(h('div', { class: 'champ' },
        h('span', { class: 'legende' }, 'Où en est cet achat ?'),
        h('div', { class: 'segments', role: 'group' }, STATUTS_ACHAT.map((s) =>
          h('button', {
            type: 'button', 'aria-pressed': (ev.statut_achat || 'acheté') === s ? 'true' : 'false',
            onclick: () => { collecter(); ev.statut_achat = s; redessiner(); },
          }, s)))));
    }

    /* --- mot libre --- */
    champs.commentaire = h('textarea', {
      placeholder: 'Ce dont vous vous souviendrez dans dix ans…',
    });
    champs.commentaire.value = ev.commentaire || '';
    boite.append(h('div', { class: 'champ' }, h('label', null, 'Note'), champs.commentaire));

    /* --- photos --- */
    boite.append(h('div', { class: 'champ' },
      h('span', { class: 'legende' }, 'Photos'),
      h('div', { class: 'galerie' },
        ev.photos.map((p) => h('button', {
          type: 'button', 'aria-label': 'Retirer cette photo',
          onclick: async () => {
            if (!await confirmer({
              titre: 'Retirer la photo',
              message: 'Cette photo sera supprimée définitivement de cette entrée.',
              labelOk: 'Retirer', danger: true,
            })) return;
            ev.photos = ev.photos.filter((x) => (x.id || x) !== (p.id || p));
            photosARetirer.push(p.id || p);
            redessiner();
          },
        }, imgVignette(p, ''))),
        h('button', {
          type: 'button', class: 'ajouter',
          onclick: async () => {
            const nouvelles = await choisirPhotos();
            for (const n of nouvelles) { ev.photos.push(n.reference); photosAAjouter.push(n.enregistrement); }
            redessiner();
          },
        }, '+ photo'),
      ),
      photosAAjouter.length ? h('div', { class: 'aide' },
        photosAAjouter.length + ' photo(s) enregistrée(s) à la validation.') : null,
    ));

    /* --- suppression --- */
    if (!creation) {
      boite.append(h('button', {
        class: 'bouton bouton--danger', type: 'button',
        onclick: async () => {
          const f = feuillesOuvertes[feuillesOuvertes.length - 1];
          if (await supprimerEvenement(evOrigine) && f) f.fermer();
        },
      }, 'Mettre à la corbeille'));
    }

    return boite;
  };

  const photosAAjouter = [];
  const photosARetirer = [];

  function majApercu() {
    if (!champs.apercu) return;
    const m = nombre(champs.montant.value);
    const d = champs.devise.value.trim().toUpperCase() || 'EUR';
    const t = d === 'EUR' ? 1 : nombre(champs.taux.value);
    champs.apercu.textContent = (Number.isFinite(m) && Number.isFinite(t) && d !== 'EUR')
      ? '= ' + formatEuros(m * t) : '';
  }

  /** Recopie les champs visibles dans l'objet en cours d'édition. */
  function collecter() {
    if (champs.date) ev.date = champs.date.value || ev.date;
    if (champs.heure) ev.heure = champs.heure.value;
    if (champs.commentaire) ev.commentaire = champs.commentaire.value.trim();
    if (champs.beneficiaire) ev.beneficiaire = champs.beneficiaire.value.trim();
    if (champs.categorie) ev.categorie = champs.categorie.value;
    if (champs.montant) {
      const m = nombre(champs.montant.value);
      ev.montant = Number.isFinite(m) ? m : null;
      ev.devise = champs.devise.value.trim().toUpperCase() || 'EUR';
      const t = nombre(champs.taux.value);
      ev.taux_vers_eur = ev.devise === 'EUR' ? 1 : (Number.isFinite(t) ? t : null);
    }
  }

  function redessiner() {
    if (!corpsFeuille) return;
    corpsFeuille.textContent = '';
    corpsFeuille.append(construire());
    majApercu();
  }

  ouvrirFeuille({
    titre: creation ? 'Nouvelle entrée' : LIBELLE_EVENEMENT[evOrigine.type],
    labelValider: 'Enregistrer',
    corps: (f) => {
      corpsFeuille = h('div');
      corpsFeuille.append(construire());
      setTimeout(majApercu, 0);
      return corpsFeuille;
    },
    valider: async () => {
      collecter();

      // Une visite à laquelle on ajoute un montant devient une dépense : le
      // type suit l'intention, on ne force pas l'utilisateur à y penser.
      if (ev.type === 'visite' && aUnMontant(ev)) ev.type = 'depense';
      if (ev.type === 'achat' && !ev.statut_achat) ev.statut_achat = 'acheté';
      if (ev.type !== 'achat') ev.statut_achat = '';
      if (ev.type === 'depense' || ev.type === 'achat') {
        if (!aUnMontant(ev) && ev.type === 'depense') {
          // Une dépense sans montant n'a pas de sens : on la remet en visite.
          ev.type = 'visite';
        }
        if (aUnMontant(ev) && ev.devise !== 'EUR' && !(ev.taux_vers_eur > 0)) {
          toast('Indiquez le taux du jour pour ' + ev.devise + '.');
          return false;
        }
      }

      try {
        await ecrire(['photos', 'lieux', 'evenements'], (s) => {
          for (const p of photosAAjouter) { p.parent_id = ev.id; s.photos.put(p); }
          for (const id of photosARetirer) s.photos.delete(id);
          if (options.lieuANouveau && !etat.lieux.has(options.lieuANouveau.id)) {
            s.lieux.put(options.lieuANouveau);
          }
          s.evenements.put(ev);
        });
      } catch (err) {
        toast(messageErreurEcriture(err));
        return false;
      }

      // Le taux tout juste saisi devient le taux proposé par défaut.
      if (ev.devise && ev.devise !== 'EUR' && ev.taux_vers_eur > 0) {
        await ecrirePref('taux', { ...(etat.prefs.taux || {}), [ev.devise]: ev.taux_vers_eur });
        await ecrirePref('devise_courante', ev.devise);
      }

      if (options.lieuANouveau) etat.lieux.set(options.lieuANouveau.id, options.lieuANouveau);
      const i = etat.evenements.findIndex((x) => x.id === ev.id);
      if (i >= 0) etat.evenements[i] = ev; else etat.evenements.push(ev);
      etat.evenements.sort(triChronoDesc);
      if (creation) idNouvelleLigne = ev.id;
      rendre();
      return true;
    },
  });
}

      try {
        await ecrire(['photos', 'lieux'], (s) => {
          for (const p of photosAAjouter) { p.parent_id = lieu.id; s.photos.put(p); }
          for (const id of photosARetirer) s.photos.delete(id);
          s.lieux.put(lieu);
        });
      } catch (err) {
        toast(messageErreurEcriture(err));
        return false;
      }
      etat.lieux.set(lieu.id, lieu);
      // Rester cohérent : la ville du dernier lieu nommé devient la ville courante.
      if (lieu.ville) {
        const vc = etat.prefs.ville_courante || {};
        if (vc.ville !== lieu.ville) await ecrirePref('ville_courante', { ville: lieu.ville, pays: lieu.pays });
      }
      rendre();
      return true;
    },
  });
}

/** Choix d'un lieu existant, par distance quand on connaît la position. */
function choisirLieu(ev, retour) {
  const ref = etat.lieux.get(ev.lieu_id);
  const base = (ref && Number.isFinite(ref.latitude)) ? ref : null;

  const liste = lieuxVivants().map((l) => ({
    lieu: l,
    d: (base && Number.isFinite(l.latitude))
      ? distance(base.latitude, base.longitude, l.latitude, l.longitude) : null,
  })).sort((a, b) => {
    if (a.d !== null && b.d !== null) return a.d - b.d;
    if (a.d !== null) return -1;
    if (b.d !== null) return 1;
    return (nomLieu(a.lieu) || 'zzz').localeCompare(nomLieu(b.lieu) || 'zzz', 'fr');
  });

  const appliquer = async (l) => {
    if (retour) return retour(l);
    // Appelé depuis le toast : on rattache tout de suite.
    const maj = { ...ev, lieu_id: l.id };
    try {
      await ecrire('evenements', (s) => s.evenements.put(maj));
      const i = etat.evenements.findIndex((x) => x.id === ev.id);
      if (i >= 0) etat.evenements[i] = maj;
      rendre();
      toast('Rattaché à ' + (nomLieu(l) || 'ce lieu') + '.');
    } catch (err) { toast(messageErreurEcriture(err)); }
  };

  const f = ouvrirFeuille({
    titre: 'Choisir un lieu',
    corps: () => h('div', null,
      h('button', {
        class: 'bouton', onclick: () => f.fermer(false, () => {
          const l = nouveauLieu(base ? { latitude: base.latitude, longitude: base.longitude } : null);
          ecrire('lieux', (s) => s.lieux.put(l))
            .then(() => { etat.lieux.set(l.id, l); return appliquer(l); })
            .then(() => feuilleLieu(l))
            .catch((err) => { etat.lieux.delete(l.id); toast(messageErreurEcriture(err)); });
        }),
      }, 'Créer un nouveau lieu'),
      h('div', { style: { margin: '0.9rem -1rem 0' } },
        liste.map(({ lieu, d }) => h('button', {
          class: 'rangee',
          onclick: () => f.fermer(false, () => appliquer(lieu)),
        },
          (lieu.photos && lieu.photos[0]) ? imgVignette(lieu.photos[0], 'rangee__miniature') : null,
          h('div', { class: 'rangee__texte' },
            h('div', { class: 'rangee__titre' }, nomLieu(lieu) || 'Lieu sans nom'),
            h('div', { class: 'rangee__sous' }, [lieu.type, lieu.ville].filter(Boolean).join(', '))),
          h('div', { class: 'rangee__droite' },
            d === null ? '' : d < 1000 ? Math.round(d) + ' m' : (d / 1000).toFixed(1) + ' km'),
        ))),
    ),
  });
}

/* -------------------------------------------------------- ajout photos ---- */

let resolvePhotos = null;

/** Ouvre la photothèque et renvoie les photos préparées (pas encore écrites). */
function choisirPhotos() {
  return new Promise((resoudre) => {
    resolvePhotos = resoudre;
    const e = $('#entree-galerie');
    e.value = '';
    e.click();
    // Si l'utilisateur annule le sélecteur, aucun événement n'est émis par le
    // navigateur : on libère la promesse au retour sur la page.
    const liberer = () => {
      setTimeout(() => {
        if (resolvePhotos === resoudre) { resolvePhotos = null; resoudre([]); }
      }, 800);
      window.removeEventListener('focus', liberer);
    };
    setTimeout(() => window.addEventListener('focus', liberer), 300);
  });
}

$('#entree-galerie').addEventListener('change', async (e) => {
  const fichiers = [...(e.target.files || [])];
  e.target.value = '';
  const suite = resolvePhotos;
  resolvePhotos = null;
  if (!suite) return;

  const t = toast('Préparation des photos…', [], 0);
  const prets = [];
  for (const f of fichiers) {
    try { prets.push(await preparerPhoto(f)); }
    catch (err) { toast('Une photo n’a pas pu être lue, elle a été ignorée.'); }
  }
  t.fermer();
  suite(prets);
});

/** Ajout direct de photos à un lieu, depuis sa fiche. */
async function ajouterPhotosA(type, id) {
  const nouvelles = await choisirPhotos();
  if (!nouvelles.length) return;
  const cible = etat.lieux.get(id);
  if (!cible) return;
  const maj = { ...cible, photos: [...(cible.photos || []), ...nouvelles.map((n) => n.reference)] };
  try {
    await ecrire(['photos', 'lieux'], (s) => {
      for (const n of nouvelles) { n.enregistrement.parent_id = id; s.photos.put(n.enregistrement); }
      s.lieux.put(maj);
    });
    etat.lieux.set(id, maj);
    rendre();
  } catch (err) { toast(messageErreurEcriture(err)); }
}

/* ==========================================================================
   SUPPRESSION — confirmation explicite, puis corbeille de 30 jours
   ========================================================================== */

async function supprimerEvenement(ev) {
  const ok = await confirmer({
    titre: 'Supprimer cette entrée',
    message: 'Elle part à la corbeille et y reste ' + JOURS_CORBEILLE
      + ' jours. Vous pourrez la récupérer d’ici là.',
    labelOk: 'Mettre à la corbeille', danger: true,
  });
  if (!ok) return false;
  const maj = { ...ev, supprime_le: new Date().toISOString() };
  try {
    await ecrire('evenements', (s) => s.evenements.put(maj));
    const i = etat.evenements.findIndex((x) => x.id === ev.id);
    if (i >= 0) etat.evenements[i] = maj;
    animerRature(ev.id);
    setTimeout(rendre, 180);
    return true;
  } catch (err) { toast(messageErreurEcriture(err)); return false; }
}

async function supprimerLieu(lieu) {
  const lies = etat.evenements.filter((e) => e.lieu_id === lieu.id && !e.supprime_le);
  const ok = await confirmer({
    titre: 'Supprimer ce lieu',
    message: lies.length
      ? 'Ce lieu et ses ' + lies.length + ' entrées partent ensemble à la corbeille, pour '
        + JOURS_CORBEILLE + ' jours. Les restaurer les ramènera tous.'
      : 'Ce lieu part à la corbeille et y reste ' + JOURS_CORBEILLE + ' jours.',
    labelOk: 'Mettre à la corbeille', danger: true,
  });
  if (!ok) return false;

  const quand = new Date().toISOString();
  const majLieu = { ...lieu, supprime_le: quand };
  // `supprime_avec` marque les entrées entraînées par le lieu : elles ne
  // s'affichent pas séparément dans la corbeille et reviennent avec lui.
  const majEvs = lies.map((e) => ({ ...e, supprime_le: quand, supprime_avec: lieu.id }));
  try {
    await ecrire(['lieux', 'evenements'], (s) => {
      s.lieux.put(majLieu);
      for (const e of majEvs) s.evenements.put(e);
    });
    etat.lieux.set(lieu.id, majLieu);
    for (const e of majEvs) {
      const i = etat.evenements.findIndex((x) => x.id === e.id);
      if (i >= 0) etat.evenements[i] = e;
    }
    rendre();
    return true;
  } catch (err) { toast(messageErreurEcriture(err)); return false; }
}

async function restaurerEvenement(ev) {
  const maj = { ...ev, supprime_le: null, supprime_avec: null };
  try {
    await ecrire('evenements', (s) => s.evenements.put(maj));
    const i = etat.evenements.findIndex((x) => x.id === ev.id);
    if (i >= 0) etat.evenements[i] = maj;
    rendre();
    toast('Restaurée.');
  } catch (err) { toast(messageErreurEcriture(err)); }
}

async function restaurerLieu(lieu) {
  const lies = etat.evenements.filter((e) => e.supprime_avec === lieu.id);
  const majLieu = { ...lieu, supprime_le: null };
  const majEvs = lies.map((e) => ({ ...e, supprime_le: null, supprime_avec: null }));
  try {
    await ecrire(['lieux', 'evenements'], (s) => {
      s.lieux.put(majLieu);
      for (const e of majEvs) s.evenements.put(e);
    });
    etat.lieux.set(lieu.id, majLieu);
    for (const e of majEvs) {
      const i = etat.evenements.findIndex((x) => x.id === e.id);
      if (i >= 0) etat.evenements[i] = e;
    }
    rendre();
    toast('Restauré' + (lies.length ? ' avec ses ' + lies.length + ' entrées.' : '.'));
  } catch (err) { toast(messageErreurEcriture(err)); }
}

async function detruireEvenement(ev) {
  const ok = await confirmer({
    titre: 'Supprimer pour de bon',
    message: 'Cette entrée et ses photos seront effacées définitivement. C’est sans retour.',
    labelOk: 'Effacer définitivement', danger: true,
  });
  if (!ok) return;
  try {
    await ecrire(['photos', 'evenements'], (s) => {
      for (const p of ev.photos || []) s.photos.delete(p.id || p);
      s.evenements.delete(ev.id);
    });
    etat.evenements = etat.evenements.filter((x) => x.id !== ev.id);
    rendre();
  } catch (err) { toast(messageErreurEcriture(err)); }
}

async function detruireLieu(lieu) {
  const lies = etat.evenements.filter((e) => e.lieu_id === lieu.id);
  const ok = await confirmer({
    titre: 'Supprimer pour de bon',
    message: 'Ce lieu' + (lies.length ? ', ses ' + lies.length + ' entrées' : '')
      + ' et toutes leurs photos seront effacés définitivement. C’est sans retour.',
    labelOk: 'Effacer définitivement', danger: true,
  });
  if (!ok) return;
  try {
    await ecrire(['photos', 'lieux', 'evenements'], (s) => {
      for (const p of lieu.photos || []) s.photos.delete(p.id || p);
      for (const e of lies) {
        for (const p of e.photos || []) s.photos.delete(p.id || p);
        s.evenements.delete(e.id);
      }
      s.lieux.delete(lieu.id);
    });
    etat.lieux.delete(lieu.id);
    etat.evenements = etat.evenements.filter((e) => e.lieu_id !== lieu.id);
    rendre();
  } catch (err) { toast(messageErreurEcriture(err)); }
}

function animerRature(id) {
  const el = document.querySelector('.ligne[data-id="' + CSS.escape(id) + '"]');
  if (el) el.classList.add('ligne--rature');
}

/** Purge silencieuse au démarrage de ce qui a dépassé les 30 jours. */
async function purgerCorbeille() {
  const limite = new Date(Date.now() - JOURS_CORBEILLE * 86400000).toISOString();
  const lieux = [...etat.lieux.values()].filter((l) => l.supprime_le && l.supprime_le < limite);
  const evs = etat.evenements.filter((e) => e.supprime_le && e.supprime_le < limite);
  if (!lieux.length && !evs.length) return;

  await ecrire(['photos', 'lieux', 'evenements'], (s) => {
    for (const e of evs) {
      for (const p of e.photos || []) s.photos.delete(p.id || p);
      s.evenements.delete(e.id);
    }
    for (const l of lieux) {
      for (const p of l.photos || []) s.photos.delete(p.id || p);
      s.lieux.delete(l.id);
    }
  });
  for (const e of evs) etat.evenements = etat.evenements.filter((x) => x.id !== e.id);
  for (const l of lieux) etat.lieux.delete(l.id);
}

/* ==========================================================================
   TOASTS
   ========================================================================== */

function toast(message, actions = [], duree = 4200) {
  const el = h('div', { class: 'toast', role: 'status' },
    h('div', { class: 'toast__texte' }, message),
    actions.map((a) => h('button', {
      onclick: () => { fermer(); a.action(); },
    }, a.label)),
  );
  let minuteur = null;
  const fermer = () => { clearTimeout(minuteur); el.remove(); };
  $('#toasts').append(el);
  if (duree > 0) minuteur = setTimeout(fermer, duree);
  return { fermer, el };
}

function naviguer(vue) {
  etat.vue = vue;
  history.pushState({ vue }, '');
  window.scrollTo(0, 0);

}

/**
 * Changement d'état à l'intérieur d'un même écran (changer de période dans
 * Argent, par exemple). On remplace l'entrée d'historique au lieu d'en empiler
