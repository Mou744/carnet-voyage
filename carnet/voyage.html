/* ==========================================================================
   REPRISE APRÈS VEILLE

   Au retour dans l'app après plusieurs heures, deux choses peuvent avoir
   changé : le jour, et la connexion à la base (iOS la ferme parfois). On
   recharge sans rien demander.
   ========================================================================== */

let jourAffiche = isoLocal();

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  const changementDeJour = jourAffiche !== isoLocal();
  const longueAbsence = Date.now() - dernierRendu > 5 * 60 * 1000;
  if (!changementDeJour && !longueAbsence) return;
  try {
    await chargerEtat();
    jourAffiche = isoLocal();
    rendre();
  } catch (err) {
    toast("La base s'est fermée pendant la veille. Rechargez la page pour la rouvrir.");
  }
  // Une mise à jour a pu s'installer pendant que l'app dormait en arrière-plan.
  if (await pageEstPerimee()) proposerRechargement('Une version plus récente est installée.');
});

/* ==========================================================================
   MISE À JOUR DE L'APP
   ========================================================================== */

/**
 * Version du code effectivement en train de tourner dans cette page.
 * À garder identique à VERSION dans sw.js — c'est la comparaison des deux qui
 * dit la vérité sur l'état de l'app.
 */
const VERSION_APP = 'carnet-v12';

/**
 * Demande au service worker aux commandes quelle version il sert.
 * Passer par un canal de message est le seul moyen fiable : un `fetch` de
 * sw.js repasserait par le cache de ce même service worker et renverrait
 * l'ancienne version.
 */
function versionDuServiceWorker() {
  return new Promise((resoudre) => {
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
    if (!sw) return resoudre(null);
    const canal = new MessageChannel();
    const minuteur = setTimeout(() => resoudre(null), 1500);
    canal.port1.onmessage = (e) => { clearTimeout(minuteur); resoudre(e.data); };
    try { sw.postMessage('version', [canal.port2]); }
    catch (_) { clearTimeout(minuteur); resoudre(null); }
  });
}

/** Le code affiché est-il en retard sur ce que le service worker sert ? */
async function pageEstPerimee() {
  const v = await versionDuServiceWorker();
  return !!v && v !== VERSION_APP;
}

function proposerRechargement(message) {
  toast(message, [{ label: 'Recharger', action: () => location.reload() }], 12000);
}

async function chercherMiseAJour() {
  if (!('serviceWorker' in navigator)) return toast('Pas de mise à jour possible dans ce contexte.');
  const reg = await navigator.serviceWorker.getRegistration();
  if (!reg) return toast('L’app n’est pas installée hors ligne ici.');

  // Le code déjà chargé peut être en retard même sans nouvelle publication :
  // le service worker a pu se mettre à jour tout seul pendant que la page
  // restait ouverte. On le vérifie avant même d'interroger le réseau.
  if (await pageEstPerimee()) {
    return proposerRechargement('Une version plus récente est déjà installée.');
  }

  const t = toast('Recherche…', [], 0);

  /*
    `reg.update()` rend la main dès que la vérification réseau est faite, pas
    quand le nouveau worker est prêt. Et comme l'installation appelle
    skipWaiting(), le nouveau worker ne passe jamais par l'état « waiting » :
    il prend directement les commandes. On écoute donc les deux signaux qui
    arrivent vraiment — une installation qui démarre, ou un changement de
    contrôleur — plutôt que de tester un état qui restera toujours vide.
  */
  const nouvelleVersion = new Promise((resoudre) => {
    let fait = false;
    const signaler = () => { if (!fait) { fait = true; resoudre(true); } };

    navigator.serviceWorker.addEventListener('controllerchange', signaler, { once: true });
    reg.addEventListener('updatefound', () => {
      const arrivant = reg.installing;
      if (!arrivant) return signaler();
      arrivant.addEventListener('statechange', () => {
        if (['installed', 'activating', 'activated'].includes(arrivant.state)) signaler();
      });
    }, { once: true });
  });

  try {
    await reg.update();
  } catch (_) {
    t.fermer();
    return toast('Pas de réseau : impossible de vérifier. L’app fonctionne quand même.');
  }

  const trouvee = await Promise.race([nouvelleVersion, delai(8000).then(() => false)]);
  t.fermer();

  if (trouvee || reg.waiting || reg.installing) {
    if (reg.waiting) reg.waiting.postMessage('activer-maintenant');
    proposerRechargement('Nouvelle version prête.');
  } else {
    toast('Vous avez déjà la dernière version.');
  }
}

/* ==========================================================================
   DÉMARRAGE
   ========================================================================== */

function ecranBloquant(titre, paragraphes) {
  $('#entete').hidden = true;
  $('#barre').hidden = true;
  $('#vue').textContent = '';
  $('#vue').append(h('div', { class: 'bloquant' },
    h('h1', null, titre),
    paragraphes.map((p) => h('p', null, p)),
  ));
}

async function demarrer() {
  try {
    await ouvrirBase();
  } catch (err) {
    // Navigation privée, stockage désactivé, ou fichier ouvert en file:// —
    // dans tous les cas on explique ce qui se passe et quoi faire.
    const enFichier = location.protocol === 'file:';
    ecranBloquant('Le carnet ne peut pas s’ouvrir ici.', enFichier ? [
      "Ce fichier est ouvert directement depuis le disque (file://). Dans ce mode, les navigateurs interdisent le stockage local : rien de ce que vous saisiriez ne serait conservé.",
      "Servez le dossier par HTTP — par exemple avec « python -m http.server » dans ce répertoire, puis ouvrez l’adresse indiquée — ou déposez ces fichiers sur GitHub Pages et installez l’app sur l’écran d’accueil.",
    ] : [
      "Le navigateur refuse l’accès à son stockage local. C’est le cas en navigation privée, ou lorsque les données de site sont bloquées dans les réglages.",
      "Ouvrez cette page dans une fenêtre normale, ou autorisez le stockage pour ce site. Aucune donnée n’a été perdue : elle n’a simplement pas pu être lue.",
    ]);
    console.error(err);
    return;
  }

  await chargerEtat();
  await purgerCorbeille().catch(() => {});

  history.replaceState({ vue: etat.vue }, '');
  rendre();

  // Demander la persistance évite que le navigateur efface le carnet quand il
  // manque de place. Sans réponse positive, l'app reste parfaitement utilisable.
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persisted().then((deja) => { if (!deja) navigator.storage.persist(); }).catch(() => {});
  }

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    // Mémorisé avant l'enregistrement : sur une toute première installation,
    // la prise de contrôle est normale et ne mérite aucun message.
    const dejaControlee = !!navigator.serviceWorker.controller;

    navigator.serviceWorker.register('sw.js').catch(() => {
      /* pas de service worker : l'app fonctionne, sans le mode avion complet */
    });

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (dejaControlee) proposerRechargement('Nouvelle version installée.');
    });
  }

  // Première ouverture : on demande où on est, c'est ce qui alimente tout le reste.
  if (!etat.prefs.ville_courante && !etat.evenements.length) {
    setTimeout(feuilleVille, 500);
  }
}

demarrer();
